<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U1 · multiACE</title>
<style>
  :root{
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --page:#e6e7e9; --panel:#ffffff; --hbar:#eef0f1; --hbar-line:#e2e4e6;
    --line:#e4e6e8; --line-soft:#eef0f1; --inset:#f4f5f6;
    --text:#2f3336; --dim:#7d868d; --faint:#a7aeb4;
    --teal:#14b8a6; --teal-ink:#fff; --teal-soft:rgba(20,184,166,.12);
    --blue:#4a90d9; --blue-soft:rgba(74,144,217,.12);
    --warn:#e2953a; --warn-soft:rgba(226,149,58,.14);
    --empty:#e7e9eb;
    --shadow:0 1px 2px rgba(16,24,32,.05), 0 10px 26px -18px rgba(16,24,32,.4);
  }
  :root[data-theme="dark"]{
    --page:#0f1215; --panel:#181c20; --hbar:#1f242a; --hbar-line:#262c32; --line:#272d33; --line-soft:#20262b; --inset:#1e242a;
    --text:#e8ecef; --dim:#98a2aa; --faint:#6a757d; --teal:#17b890; --teal-ink:#04211a; --teal-soft:rgba(23,184,144,.16);
    --blue:#5aa0e6; --blue-soft:rgba(90,160,230,.16); --warn:#e6a23c; --warn-soft:rgba(230,162,60,.16);
    --empty:#232a30; --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font-sans);color:var(--text);background:var(--page);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .wrap{padding:14px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .phead{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--hbar);border-bottom:1px solid var(--hbar-line);}
  .phead .title{font-size:13.5px;font-weight:600;}
  .phead .right{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--dim);}
  .phead .rbtn{cursor:pointer;padding:4px;border-radius:6px;}
  .phead .rbtn:hover{color:var(--teal);}

  .empty-state{padding:44px 20px;text-align:center;color:var(--dim);font-size:13px;}

  /* feed map */
  .feedmap{position:relative;padding:16px 16px 10px;}
  .feed-sources{position:relative;z-index:1;display:flex;align-items:flex-start;gap:20px;}
  .feed-sources .grow{flex:1;}
  .feed-heads{position:relative;z-index:1;display:flex;justify-content:space-around;gap:12px;margin-top:66px;}
  .wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0;}
  .wireflow{stroke-dasharray:2 9;stroke-linecap:round;animation:flow 1.1s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-11;}}
  @media (prefers-reduced-motion:reduce){.wireflow{animation:none;stroke-dasharray:none;}}

  /* spool */
  .sp{width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .sp[data-do]{cursor:pointer;}
  .sp[data-do]:hover{border-color:color-mix(in srgb,var(--teal) 45%,var(--line));}
  .sp .spool{width:60px;height:60px;border-radius:50%;position:relative;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 50%, var(--panel) 0 30%, var(--c,#8fa7c8) 30.5%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}
  .sp .spool::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--inset);box-shadow:inset 0 0 0 2px var(--line);}
  .sp.empty .spool{background:repeating-linear-gradient(135deg,var(--empty) 0 7px,transparent 7px 14px);box-shadow:inset 0 0 0 2px var(--line);}
  .sp .nm{font-size:12.5px;font-weight:600;} .sp.empty .nm{color:var(--faint);font-weight:500;}
  .sp .tag{font-size:10px;color:var(--faint);font-family:var(--font-mono);margin-top:-3px;}
  .sp .role{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:1px 7px;}
  .spacts{display:flex;gap:9px;justify-content:center;margin-top:3px;}
  .spacts .act{width:24px;height:22px;border:1px solid var(--line);background:var(--panel);border-radius:6px;color:var(--dim);display:grid;place-items:center;padding:0;pointer-events:none;}
  .spacts .act svg{width:14px;height:14px;display:block;}
  .feed-sources > .sp, .acebox .sp{background:var(--inset);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,32,.06);}
  .feed-sources > .sp{padding:13px 15px 11px;}

  /* ACE tray */
  .acebox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.30), var(--shadow);}
  .aceband{display:flex;align-items:center;gap:10px;padding:11px 14px;background:color-mix(in srgb,var(--teal) 7%,var(--inset));border-bottom:1px solid var(--line);}
  .acebadge{width:26px;height:26px;border-radius:7px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:11px;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);}
  .aceband .nm{font-size:13.5px;font-weight:600;} .aceband .nm .mt{font-size:11px;font-weight:400;color:var(--dim);}
  .aceband .stats{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:4px 9px;}
  .stat b{color:var(--text);font-family:var(--font-mono);}
  .stat.group b{margin-left:1px;}
  .vdiv{width:1px;height:13px;background:var(--line);margin:0 5px;}
  .humid{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p,49)*1%),var(--line) 0);}
  .thermo{width:14px;height:14px;border-radius:50%;background:color-mix(in srgb,var(--warn) 45%,transparent);box-shadow:inset 0 0 0 2px var(--warn);}
  .btn{font:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);color:var(--text);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--teal);color:var(--teal);}
  .btn.primary{background:var(--teal);color:#fff;border-color:transparent;}
  .btn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
  .drybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--warn) 6%,var(--panel));font-size:12px;}
  .drybar[hidden]{display:none;} .drybar .dl{color:var(--dim);font-weight:600;}
  .pillset{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .pillset .p{font-size:12px;font-weight:600;color:var(--dim);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line);}
  .pillset .p:last-child{border-right:0;}
  .pillset .p.on{color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue);border-radius:8px;}
  .spools{display:grid;grid-template-columns:repeat(4,auto);justify-content:center;gap:10px;padding:12px;background:color-mix(in srgb,var(--teal) 3%,var(--panel));}
  .acebox .sp{width:auto;padding:13px 11px 11px;}

  /* toolhead cartridge */
  .headnode{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .headnode .tlab{font-size:11px;font-weight:700;color:var(--dim);}
  .cart{width:84px;display:flex;flex-direction:column;align-items:center;cursor:default;}
  .cart .neck{width:9px;height:15px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--text) 12%,var(--inset));margin-bottom:-5px;}
  .cart .body{width:84px;border-radius:16px;background:var(--inset);border:1px solid var(--line);padding:22px 8px 20px;display:flex;flex-direction:column;align-items:center;gap:15px;box-shadow:0 1px 2px rgba(16,24,32,.10);}
  .cart .disc{width:38px;height:38px;border-radius:50%;background:var(--c,#b8bdc2);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:inset 0 -2px 3px rgba(0,0,0,.22), inset 0 2px 2px rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.15);}
  .cart .matband{min-width:56px;max-width:72px;padding:3px 10px;border-radius:7px;background:color-mix(in srgb,var(--text) 13%,var(--inset));color:var(--dim);font-size:11px;font-weight:600;text-align:center;}
  .cart .nozzle{width:16px;height:11px;background:color-mix(in srgb,var(--text) 13%,var(--inset));clip-path:polygon(12% 0,88% 0,62% 100%,38% 100%);}
  .cart.empty .disc{background:var(--empty);color:var(--faint);box-shadow:inset 0 0 0 2px var(--line);}
  .cart.empty .matband{color:var(--faint);}

  /* view / edit sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .scrim.open{display:flex;}
  .sheet{width:min(680px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 70px -24px rgba(0,0,0,.6);}
  .sheet-head{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;background:var(--hbar);border-bottom:1px solid var(--hbar-line);position:sticky;top:0;}
  .sheet-head .stab{font-weight:600;font-size:13.5px;color:var(--text);background:var(--panel);border:1px solid var(--hbar-line);border-bottom:0;border-radius:7px 7px 0 0;padding:8px 16px;position:relative;top:1px;}
  .sheet-head .rfx{color:var(--dim);cursor:pointer;padding:4px;}
  .sheet-head .sx{margin-left:auto;color:var(--dim);cursor:pointer;font-size:17px;line-height:1;padding:6px;}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .srow.link{cursor:pointer;} .srow.link:hover{background:var(--inset);}
  .srow .k{font-size:15px;color:var(--text);}
  .srow .v{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:9px;}
  .srow .v .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);}
  .srow .v .chev{color:var(--faint);}
  .srow .radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);display:inline-grid;place-items:center;}
  .srow .radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);}
  .swgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:16px;padding:22px 18px;}
  .swgrid .sw{width:36px;height:36px;border-radius:50%;justify-self:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}
  .swgrid .sw.white{box-shadow:inset 0 0 0 1px var(--line);}
  .swgrid .sw.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="phead"><span class="title">Filament</span>
      <span class="right"><span class="rbtn" id="refresh" title="Refresh">&#8635;</span></span></div>
    <div id="feedmap" class="feedmap"></div>
    <div id="empty" class="empty-state" hidden>No ACE unit detected. Connect the Snapmaker U1 over LAN and make sure multiACE is running.</div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
  var ICONS={
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
  };
  var PALETTE=['#ffffff','#d9dce0','#8a9097','#111318','#6f4a2f','#f0dcae','#e0a92b',
               '#f4e01f','#aab792','#2f9e57','#3ad63a','#1f5e30','#7cc4e8','#3aa8a0',
               '#2b86e0','#0b3a6b','#6b5bb8','#8a2bc0','#d61f5a','#ee6b8f','#e5321f',
               '#f2c6d8','#f39221','#e2540f'];
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function attr(o){return Object.keys(o).map(function(k){return o[k]==null||o[k]===''?'':' data-'+k+'="'+esc(o[k])+'"';}).join('');}
  function fmtDur(min){ min=Math.max(0,Math.round(min)); var h=Math.floor(min/60), m=min%60; return h>0?(h+'h '+m+'m'):(m+'m'); }
  function actionFor(source){ return source==='rfid' ? 'view' : 'edit'; }
  function iconFor(doo){ return doo==='view' ? 'eye' : 'pen'; }

  var CONNS=[];

  function render(state){
    document.documentElement.setAttribute('data-theme', state && state.dark ? 'dark' : 'light');
    var map=document.getElementById('feedmap'), empty=document.getElementById('empty');
    var heads=(state&&state.toolheads)||[], units=(state&&state.units)||[];
    var hasAce = units.length>0;
    var showContent = hasAce || heads.length>0;
    empty.hidden = showContent;
    map.hidden = !showContent;
    if(!showContent){ map.innerHTML=''; return; }

    CONNS=[];
    var srcHTML='', headHTML='';

    // ---- direct feeder spools (top-left) ----
    heads.forEach(function(t){
      if(t.feeder && t.filament_detected){
        var doo=actionFor(t.source);
        var data={brand:t.brand,mat:t.material,color:t.color,colorname:t.colorname,nozzle:t.nozzle,bed:t.bed,do:doo};
        srcHTML+='<div class="sp" id="src'+t.idx+'" style="--c:'+esc(t.color||'#8fa7c8')+'"'+attr(data)+'>'
              +'<div class="spool"></div><div class="nm">'+esc(t.material||'?')+'</div><span class="role">Feeder</span>'
              +'<div class="spacts"><span class="act">'+ICONS[iconFor(doo)]+'</span></div></div>';
        CONNS.push({from:'src'+t.idx,to:'h'+t.idx,c:t.color||'#8fa7c8'});
      }
    });
    srcHTML+='<div class="grow"></div>';

    // ---- ACE units (top-right): tray box each ----
    units.forEach(function(u){
      var letter='A'+(u.idx+1);
      var model=(u.protocol==='v2'?'ACE 2 Pro':(u.protocol==='v1'?'ACE Pro':'ACE'));
      var slots='';
      (u.slots||[]).forEach(function(s){
        if(s.occupied){
          var doo=actionFor(s.source);
          var data={brand:s.brand,mat:s.material,color:s.color,colorname:s.colorname,nozzle:s.nozzle,bed:s.bed,do:doo};
          slots+='<div class="sp" style="--c:'+esc(s.color||'#8fa7c8')+'"'+attr(data)+'>'
              +'<div class="spool"></div><div class="nm">'+esc(s.material||'?')+'</div><div class="tag">'+letter+'-S'+(s.idx+1)+'</div>'
              +'<div class="spacts"><span class="act">'+ICONS[iconFor(doo)]+'</span></div></div>';
        } else {
          slots+='<div class="sp empty" data-do="edit"><div class="spool"></div><div class="nm">Empty</div><div class="tag">'+letter+'-S'+(s.idx+1)+'</div>'
              +'<div class="spacts"><span class="act">'+ICONS.pen+'</span></div></div>';
        }
      });
      var hum = (u.humidity!=null)?('<div class="stat group"><span class="humid" style="--p:'+u.humidity+'"></span><b>'+u.humidity+'%</b>'
                + (u.temp!=null?'<span class="vdiv"></span><span class="thermo"></span><b>'+Math.round(u.temp)+'°C</b>':'') +'</div>'):'';
      var drying = u.dryer_min && u.dryer_min>0;
      var dry = drying ? fmtDur(u.dryer_min) : 'Off';
      srcHTML+='<div class="acebox" id="aceU'+u.idx+'">'
            +'<div class="aceband"><div class="acebadge">'+letter+'</div>'
            +'<div class="nm">'+model+' <span class="mt">· '+(u.connected?'connected':'offline')+'</span></div>'
            +'<div class="stats">'+hum+'<div class="stat" id="dryerstat'+u.idx+'">Dryer <b>'+dry+'</b></div>'
            +'<button class="btn heatbtn" data-unit="'+u.idx+'"'+(drying?' aria-pressed="true"':'')+'>'+(drying?'■ Stop':'◈ Dry')+'</button></div></div>'
            +'<div class="drybar" id="drybar'+u.idx+'" hidden><span class="dl">Dry at</span>'
            +'<div class="pillset"><span class="p on">45°C</span><span class="p">55°C</span><span class="p">65°C</span></div>'
            +'<span class="dl">for</span><div class="pillset"><span class="p">2 h</span><span class="p on">4 h</span><span class="p">6 h</span></div>'
            +'<span style="flex:1"></span><button class="btn primary drystart" data-unit="'+u.idx+'">Start drying</button></div>'
            +'<div class="spools">'+slots+'</div></div>';
    });

    // ---- toolheads (bottom) ----
    heads.forEach(function(t){
      var cls=t.filament_detected?'cart':'cart empty';
      var style=t.filament_detected?(' style="--c:'+esc(t.color||'#8fa7c8')+'"'):'';
      var mat=t.filament_detected?esc(t.material||'?'):'/';
      headHTML+='<div class="headnode"><div class="'+cls+'" id="h'+t.idx+'"'+style+'>'
             +'<div class="neck"></div><div class="body"><div class="disc">'+(t.idx+1)+'</div>'
             +'<div class="matband">'+mat+'</div></div><div class="nozzle"></div></div>'
             +'<div class="tlab">T'+(t.idx+1)+'</div></div>';
      // ACE-fed head -> wire from its unit box
      if(!t.feeder && t.filament_detected && t.ace!=null){
        CONNS.push({from:'aceU'+t.ace,to:'h'+t.idx,c:t.color||'#8fa7c8'});
      }
    });

    map.innerHTML='<div class="feed-sources">'+srcHTML+'</div><svg class="wires" id="wires"></svg><div class="feed-heads">'+headHTML+'</div>';
    bindDynamic();
    requestAnimationFrame(drawWires);
  }

  function drawWires(){
    var map=document.getElementById('feedmap'), svg=document.getElementById('wires');
    if(!map||!svg) return;
    var box=map.getBoundingClientRect();
    svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
    var out='';
    CONNS.forEach(function(k){
      var a=document.getElementById(k.from), b=document.getElementById(k.to);
      if(!a||!b) return;
      var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
      var x1=ra.left+ra.width/2-box.left, y1=ra.bottom-box.top;
      var x2=rb.left+rb.width/2-box.left, y2=rb.top-box.top;
      var my=(y1+y2)/2;
      var d='M'+x1+' '+y1+' C '+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2;
      out+='<path d="'+d+'" fill="none" stroke="'+k.c+'" stroke-width="3" opacity="0.32"/>'
         +'<path d="'+d+'" fill="none" stroke="'+k.c+'" stroke-width="3" class="wireflow"/>'
         +'<circle cx="'+x1+'" cy="'+y1+'" r="3.5" fill="'+k.c+'"/>'
         +'<circle cx="'+x2+'" cy="'+y2+'" r="3.5" fill="'+k.c+'"/>';
    });
    svg.innerHTML=out;
  }
  window.addEventListener('resize', drawWires);

  // ---- sheets ----
  var scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
  function headHTMLsheet(){return '<div class="sheet-head"><span class="stab">Filament</span><span class="rfx">&#8635;</span><span class="sx" data-close>&#10005;</span></div>';}
  function viewHTML(d){
    return headHTMLsheet()
      +'<div class="srow"><span class="k">Filaments</span><span class="v">'+esc(((d.brand?d.brand+' ':'')+(d.mat||''))||'—')+'</span></div>'
      +'<div class="srow"><span class="k">Colors</span><span class="v"><span class="dot" style="background:'+esc(d.color||'#ccc')+'"></span></span></div>'
      +'<div class="srow"><span class="k">Extruder Temp.</span><span class="v">'+esc(d.nozzle||'—')+'</span></div>'
      +'<div class="srow" style="border-bottom:0"><span class="k">Heated Bed Temp.</span><span class="v">'+esc(d.bed||'—')+'</span></div>';
  }
  function editHTML(d){
    var grid=PALETTE.map(function(hex){
      var sel=(hex.toLowerCase()===String(d.color||'').toLowerCase())?' sel':'';
      var wh=(hex.toLowerCase()==='#ffffff')?' white':'';
      return '<span class="sw'+wh+sel+'" style="background:'+hex+'"></span>';
    }).join('');
    return headHTMLsheet()
      +'<div class="srow"><span class="k">Colors</span><span class="v">'+esc(d.colorname||'—')+' <span class="radio on"></span></span></div>'
      +'<div class="srow link"><span class="k">Filaments</span><span class="v">'+esc((d.brand||'NONE')+' '+(d.mat||'NONE')+' ?')+' <span class="chev">&#8250;</span></span></div>'
      +'<div class="swgrid">'+grid+'</div>';
  }
  function openSheet(html){ sheet.innerHTML=html; scrim.classList.add('open'); }
  function closeSheet(){ scrim.classList.remove('open'); }
  function spoolData(sp){ var d={}; ['brand','mat','color','colorname','nozzle','bed'].forEach(function(k){d[k]=sp.getAttribute('data-'+k);}); return d; }
  scrim.addEventListener('click',function(e){
    if(e.target===scrim||(e.target.hasAttribute&&e.target.hasAttribute('data-close'))) closeSheet();
    var sw=e.target.closest&&e.target.closest('.swgrid .sw');
    if(sw){ sheet.querySelectorAll('.swgrid .sw').forEach(function(x){x.classList.remove('sel');}); sw.classList.add('sel'); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

  // ---- per-render bindings (spool click, drying control) ----
  function bindDynamic(){
    document.querySelectorAll('.sp[data-do]').forEach(function(sp){
      sp.addEventListener('click',function(){
        var d=spoolData(sp);
        openSheet(sp.getAttribute('data-do')==='edit'?editHTML(d):viewHTML(d));
      });
    });
    document.querySelectorAll('.pillset').forEach(function(set){
      set.querySelectorAll('.p').forEach(function(p){
        p.addEventListener('click',function(){ set.querySelectorAll('.p').forEach(function(x){x.classList.remove('on');}); p.classList.add('on'); });
      });
    });
    document.querySelectorAll('.heatbtn').forEach(function(btn){
      var u=btn.getAttribute('data-unit'); var bar=document.getElementById('drybar'+u);
      btn.addEventListener('click',function(){
        if(btn.getAttribute('aria-pressed')==='true'){
          btn.setAttribute('aria-pressed','false'); btn.textContent='◈ Dry';
          var s=document.querySelector('#dryerstat'+u+' b'); if(s)s.textContent='Off'; if(bar)bar.hidden=true;
          window.sendGcode('ACE_STOP_DRYING ACE='+u);
        } else if(bar){ bar.hidden=!bar.hidden; }
        requestAnimationFrame(drawWires);
      });
    });
    document.querySelectorAll('.drystart').forEach(function(btn){
      var u=btn.getAttribute('data-unit'); var bar=document.getElementById('drybar'+u);
      btn.addEventListener('click',function(){
        var sets=bar.querySelectorAll('.pillset');
        var t=sets[0]&&sets[0].querySelector('.p.on'), h=sets[1]&&sets[1].querySelector('.p.on');
        var temp=t?parseInt(t.textContent,10):45, hours=h?parseInt(h.textContent,10):4;
        var s=document.querySelector('#dryerstat'+u+' b');
        if(s)s.textContent=temp+'°C · '+hours+' h';
        var hb=document.querySelector('.heatbtn[data-unit="'+u+'"]');
        if(hb){hb.setAttribute('aria-pressed','true'); hb.textContent='■ Stop';}
        bar.hidden=true; requestAnimationFrame(drawWires);
        window.sendGcode('ACE_DRY ACE='+u+' TEMP='+temp+' DURATION='+hours);
      });
    });
  }

  // bridge to the C++ host via the "wx" script-message handler CreateWebView registers
  window.__notify=function(m){ try{ if(window.wx&&window.wx.postMessage) window.wx.postMessage(String(m)); }catch(e){} };
  // send a Klipper G-code via the host, then refresh state to reflect the result
  window.sendGcode=function(script){ if(window.wx&&window.wx.postMessage){ window.__notify('gcode:'+script); setTimeout(function(){ window.__notify('refresh'); },1600); } };
  document.getElementById('refresh').addEventListener('click',function(){ if(window.wx&&window.wx.postMessage) window.__notify('refresh'); else render(DEMO); });

  // ---- entry point called by the host (C++), with a demo fallback ----
  window.setAceState=function(s){ try{ render(typeof s==='string'?JSON.parse(s):s); }catch(e){ var em=document.getElementById('empty'); if(em){em.hidden=false; em.textContent='Page error: '+((e&&e.message)||e);} } };

  var DEMO={dark:false,mode:'head',
    toolheads:[
      {idx:0,material:'PLA',color:'#f0483d',brand:'Jayo',source:'rfid',filament_detected:true,feeder:true,ace:null,nozzle:'190°C – 230°C',bed:'45°C',colorname:'Red'},
      {idx:1,material:'PETG',color:'#c23a6b',brand:'KINGROON',source:'rfid',filament_detected:true,feeder:true,ace:null,nozzle:'230°C – 260°C',bed:'50°C',colorname:'Ruby'},
      {idx:2,material:'',color:'',filament_detected:false,feeder:true,ace:null},
      {idx:3,material:'PETG',color:'#8fa7c8',brand:'Kingroon',source:'override',filament_detected:true,feeder:false,ace:0,nozzle:'230°C – 260°C',bed:'50°C',colorname:'Slate'}
    ],
    units:[{idx:0,protocol:'v2',connected:true,humidity:49,temp:31,dryer_min:0,slots:[
      {idx:0,occupied:true,material:'PETG',color:'#83afff',brand:'Kingroon',source:'rfid',colorname:'Sky',nozzle:'230°C – 260°C',bed:'50°C'},
      {idx:1,occupied:false},{idx:2,occupied:false},
      {idx:3,occupied:true,material:'PETG',color:'#8fa7c8',brand:'Kingroon',source:'override',colorname:'Slate',nozzle:'230°C – 260°C',bed:'50°C'}
    ]}]};
  // If the host never injects (e.g. opened directly), show the demo after a tick.
  window.__hasState=false;
  var _set=window.setAceState; window.setAceState=function(s){ window.__hasState=true; _set(s); };
  setTimeout(function(){ if(!window.__hasState) render(DEMO); }, 350);
</script>
</body>
</html>
