ull ? Number(activeUnit) : fromUnit;\n    if (!Number.isInteger(u) || u < 0 || u >= unitCount) u = 0;\n  }\n  // Which bay is PLUMBED to this head, as against which one is feeding it. Only multi has\n  // one: in head mode any of the unit's four may feed, so there is nothing to name.\n  const lane = mode === 'head' ? null : i;\n  return { source: 'ace', unitIndex: u, unitId: aceUnitId(u), bay: slot, lane };\n}\n\n/**\n * ACE Pro and ACE 2 Pro are different machines.\n *\n * The unit names itself - `model: \"ACE 2 Pro\"`, measured 2026-08-26 - so that is what is\n * used. `protocol` is the fallback for a firmware that does not, and it is the field the\n * distinction actually rides on: v2 is the ACE 2 Pro, v1 the ACE Pro.\n */\nfunction aceModel(u) {\n  const named = nonEmpty(u.model);\n  if (named) return named;\n  const p = String(u.protocol || '').toLowerCase();\n  if (p === 'v2') return 'ACE 2 Pro';\n  if (p === 'v1') return 'ACE Pro';\n  return 'ACE';\n}\n\n/**\n * A colour as the ACE reports it: `[r, g, b]` in the raw slots, `\"632C2C\"` in\n * `head_source`. Both are handed on as something cssColor() will take.\n */\nfunction aceColor(c) {\n  if (Array.isArray(c)) {\n    if (c.length < 3 || c.every((v) => !Number(v))) return null;   // [0,0,0] is \"none\"\n    return '#' + c.slice(0, 3)\n      .map((v) => Math.max(0, Math.min(255, Number(v) | 0)).toString(16).padStart(2, '0'))\n      .join('').toUpperCase();\n  }\n  if (typeof c === 'string' && c.trim()) return c.trim();\n  return null;\n}\n\nconst nonEmpty = (v) => (typeof v === 'string' && v.trim() && v.trim() !== 'NONE'\n  ? v.trim() : null);\n\n/** What `head_source[n]` says is loaded at a head - or null when it says nothing. */\nfunction spoolOf(from) {\n  if (!from || typeof from !== 'object') return null;\n  const material = nonEmpty(from.type) || nonEmpty(from.material);\n  const color = aceColor(from.color);\n  if (!material && !color) return null;\n  return {\n    material,\n    subType: nonEmpty(from.subtype) || nonEmpty(from.sub_type),\n    vendor: nonEmpty(from.brand) || nonEmpty(from.vendor),\n    color,\n    rfid: Number(from.rfid) || 0,\n  };\n}\n\n/**\n * One unit, its four bays, and its dryer.\n *\n * A bay is occupied when the hardware says so - `gate_status[k]` is the gate sensor and\n * `slots[k].state` is multiACE's naming of the same thing - and *named* only when\n * something carries an identity for it. Those are two different questions and the panel\n * draws the difference, because on this machine the answer to the second is almost\n * always no: the spools have no tags and multiACE keeps typed-in names in its own store,\n * behind CORS. Occupied-and-unnamed is drawn as exactly that rather than as empty.\n */\nfunction aceUnit(u, index) {\n  const gates = Array.isArray(u.gate_status) ? u.gate_status : [];\n  const rawSlots = Array.isArray(u.slots) ? u.slots : [];\n  const bays = [];\n  for (let k = 0; k < ACE_SLOTS; k += 1) {\n    const s = rawSlots[k] || {};\n    const state = nonEmpty(s.state) || nonEmpty(s.status);\n    const gate = gates[k];\n    const occupied = gate !== undefined ? Number(gate) !== 0 : (!!state && state !== 'empty');\n    const material = nonEmpty(s.material) || nonEmpty(s.type);\n    const rfid = Number(s.rfid) || 0;\n    bays.push({\n      index: k,\n      addr: aceBayAddr(index, k),\n      occupied,\n      known: !!material,\n      material,\n      subType: nonEmpty(s.subtype) || nonEmpty(s.sub_type),\n      vendor: nonEmpty(s.brand) || nonEmpty(s.vendor),\n      sku: nonEmpty(s.sku),\n      color: aceColor(s.color !== undefined ? s.color : s.color_rgb),\n      rfid,\n      // Where the name came from decides what may be done to it: a tag can be read and\n      // not written, so it gets an eye where a typed value gets a pencil.\n      source: rfid ? 'rfid' : (material ? 'typed' : (occupied ? 'unknown' : 'empty')),\n    });\n  }\n  return {\n    index,\n    id: aceUnitId(index),\n    model: aceModel(u),\n    firmware: nonEmpty(u.firmware) || nonEmpty(u.fw) || nonEmpty(u.version),\n    connected: u.connected !== false,\n    humidity: numOrNull(u.humidity),\n    temperature: numOrNull(u.temp !== undefined ? u.temp : u.temperature),\n    dryer: aceDryer(u.dryer_status || u.dryer),\n    // Its own object on the unit, not part of dryer_status - measured\n    // `{enabled, rh_start, rh_end, temp, master, add_time}`. rh_start is the humidity it\n    // starts at and rh_end the one it stops at, so the panel's \"above\" is rh_start.\n    autoDry: {\n      enabled: !!(u.auto_dry || {}).enabled,\n      running: !!u.auto_dry_running,\n      rhStart: numOrNull((u.auto_dry || {}).rh_start),\n      rhEnd: numOrNull((u.auto_dry || {}).rh_end),\n      temp: numOrNull((u.auto_dry || {}).temp),\n    },\n    bays,\n  };\n}\n\n/**\n * The dryer.\n *\n * Every field below was measured on 811002511261022618B3 on 2026-08-26, by running the\n * dryer at its mildest setting for ten seconds - which is the only way to see any of it,\n * and the reason two of the three guesses this replaced were wrong:\n *\n *   {\"status\": \"stop\",    \"target_temp\": 0,  \"duration\": 0,     \"remain_time\": 0}\n *   {\"status\": \"keeping\", \"target_temp\": 45, \"duration\": 180,   \"remain_time\": 179}\n *\n * `duration` and `remain_time` are **seconds**: `DURATION=3` gave 180 and `DURATION=240`\n * gave 14400, which also settles that ACE_DRY's own argument is in **minutes**. The\n * running word is `keeping`, not `running` or `drying`.\n *\n * The word sets below are still open at one end on purpose. `stop` and `keeping` are the\n * two that have been seen; a firmware with a third word for \"heating up to target\" would\n * otherwise read as idle, so anything that is neither empty nor a known stopped word\n * counts as running.\n */\nconst DRYER_STOPPED = new Set(['', 'stop', 'stopped', 'idle', 'off', 'none']);\n\nfunction aceDryer(d) {\n  const off = { running: false, target: null, totalMin: null, remainingMin: null,\n                doneMin: null, pct: null, status: null };\n  if (!d || typeof d !== 'object') return off;\n  const status = String(d.status || d.state || '').toLowerCase();\n  const running = d.running === true || (!!status && !DRYER_STOPPED.has(status));\n  const target = numOrNull(d.target_temp !== undefined ? d.target_temp\n    : (d.target !== undefined ? d.target : d.temp));\n  const totalMin = secondsToMin(d.duration !== undefined ? d.duration : d.total);\n  const remainingMin = secondsToMin(d.remain_time !== undefined ? d.remain_time\n    : (d.remaining !== undefined ? d.remaining : d.left));\n  const doneMin = (totalMin != null && remainingMin != null)\n    ? Math.max(0, totalMin - remainingMin) : null;\n  return {\n    running,\n    status: status || null,\n    target,\n    totalMin,\n    remainingMin,\n    doneMin,\n    pct: (totalMin && doneMin != null) ? Math.round((doneMin / totalMin) * 100) : null,\n  };\n}\n\n/** Seconds on the wire, minutes on the panel. A dash for anything unreadable. */\nfunction secondsToMin(v) {\n  const n = Number(v);\n  if (!Number.isFinite(n) || n < 0) return null;\n  return Math.round(n / 60);\n}\n\n", "grouping-view.js": "/*\n * grouping-view.js - what the slicer grouped onto each toolhead, and what is in the way.\n *\n * The panel a plate sliced onto an ACE gets instead of Edit Filament. Its shape is\n * option G's, settled in resources/web/print_processing/mockups/ and written up in\n * docs/u1-webui/03-print-processing/06-multiace.md.\n *\n * WHAT IT IS FOR, AND WHY IT HAS NO PICKER\n *\n * Edit Filament asks \"which toolhead does this filament print from\". An ACE plate cannot\n * be asked that: the file already decided, and its `ACE_SWAP_HEAD HEAD=n` names the head\n * directly, so a picker here would offer a way to desynchronise the swaps from the tool\n * changes and print the plate on the wrong heads. What is left is RECONCILIATION - the\n * file says which bay each filament comes from, the machine says what is in it, and the\n * panel says what to move.\n *\n * FOUR PARTS\n *\n *   the mode      `SET_ACE_MODE`'s three-way switch, stated and not offered. It decides\n *                 what an address MEANS, so nothing below it is legible without it.\n *   the band      the units, in multi and normal - where no head is wired to a cabinet,\n *                 so nothing about one belongs on a head's box\n *   the heads     one box each: what feeds it, and the filaments it runs in order\n *   the verdict   per bay, three-valued, and the limit stated rather than papered over\n */\n'use strict';\n\nimport { el } from '../../../../shared/js/dom.js';\nimport { text, keyedList } from '../../../../shared/js/render.js';\nimport { aceBadge, aceBayAddr, ACE_MODE_LABELS } from '../../../../shared/js/multiACE.js';\nimport { inkOn, grams1 } from '../../widgets/format.js';\n\n/* `dom.js` builds HTML elements; one mark on this panel is an SVG and needs the other\n   namespace. Local because it is the only user on this surface. */\nconst SVGNS = 'http://www.w3.org/2000/svg';\nfunction svg(tag, attrs = {}) {\n  const n = document.createElementNS(SVGNS, tag);\n  Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));\n  return n;\n}\n\n/*\n * What each mode means, in words. The machine's own three words are `normal`, `multi` and\n * `head`; these are what they mean for the thing on screen, which is what a label is for.\n */\nconst MODE_SAY = {\n  head: 'Each toolhead is its own feeder, or wired to one ACE.',\n  multi: 'Bay 1 of every ACE feeds toolhead 1, bay 2 feeds toolhead 2, and so on.',\n  normal: 'Stock feeders only \u2014 no ACE is feeding a toolhead.',\n};\n\nexport function mount(root) {\n  root.appendChild(el('div', 'g-mode'));\n  root.appendChild(el('div', 'g-band'));\n  root.appendChild(el('div', 'g-heads'));\n  root.appendChild(el('div', 'g-note'));\n  root.appendChild(el('div', 'g-cost'));\n}\n\nexport function update(root, model) {\n  const { plan, ace, check, filaments } = model;\n  if (!plan) return;                       // hidden by app.js; nothing to draw\n\n  const mode = ace && ace.present ? (ace.mode || 'head') : null;\n  paintMode(root.querySelector('.g-mode'), mode);\n\n  /* The band is the PANEL's row of units, and it exists only where a head has no cabinet\n     of its own to carry one: above the grid in multi, below it in normal. That placement\n     is the Device page's, and its reason is that an idle cabinet in normal mode is a\n     footnote while a lane's cabinets in multi are the subject. */\n  const band = root.querySelector('.g-band');\n  const wantBand = mode === 'multi' || mode === 'normal';\n  band.hidden = !wantBand;\n  if (wantBand) paintBand(band, ace);\n  root.classList.toggle('band-below', mode === 'normal');\n\n  paintHeads(root.querySelector('.g-heads'), plan, ace, check, filaments, mode);\n  paintNote(root.querySelector('.g-note'), plan, check);\n  paintCost(root.querySelector('.g-cost'), plan);\n}\n\n/* ---- the mode ---------------------------------------------------------- */\n\nfunction paintMode(row, mode) {\n  row.textContent = '';\n  if (!mode) {\n    row.appendChild(el('span', 'g-pill dim', 'No ACE'));\n    row.appendChild(el('span', 'g-say', 'This printer reports no ACE unit.'));\n    return;\n  }\n  row.appendChild(el('span', 'g-pill', `ACE mode \u00b7 ${ACE_MODE_LABELS[mode] || mode}`));\n  row.appendChild(el('span', 'g-say', MODE_SAY[mode] || ''));\n}\n\n/* ---- the unit band ----------------------------------------------------- */\n\nfunction paintBand(band, ace) {\n  band.textContent = '';\n  const units = (ace && ace.units) || [];\n  if (!units.length) {\n    band.appendChild(el('span', 'g-say', 'No ACE unit reported.'));\n    return;\n  }\n  units.forEach((u) => {\n    const one = el('div', 'g-unit');\n    const badge = aceBadge(u.bays, 20 / 26);\n    badge.setAttribute('aria-hidden', 'true');\n    one.appendChild(badge);\n    one.appendChild(el('b', null, `ACE ${u.id}`));\n    if (u.model) one.appendChild(el('span', 'g-dim', u.model));\n    if (u.humidity != null) one.appendChild(el('span', 'g-hum', `${u.humidity}%`));\n    one.title = `ACE ${u.id}${u.model ? ` \u00b7 ${u.model}` : ''}`;\n    band.appendChild(one);\n  });\n}\n\n/* ---- the heads --------------------------------------------------------- */\n\nfunction paintHeads(grid, plan, ace, check, filaments, mode) {\n  keyedList(grid, plan.heads, {\n    key: (h) => String(h.head),\n    create: () => buildHead(),\n    update: (node, h) => paintHead(node, h, ace, check, filaments, mode),\n  });\n}\n\nfunction buildHead() {\n  const box = el('div', 'g-head');\n  const head = el('div', 'g-hrow');\n  head.appendChild(el('h4', null, ''));\n  head.appendChild(el('span', 'g-spacer'));\n  head.appendChild(el('div', 'g-src'));\n  box.appendChild(head);\n  box.appendChild(el('div', 'g-chips'));\n  box.appendChild(el('div', 'g-verdict'));\n  return box;\n}\n\nfunction paintHead(box, h, ace, check, filaments, mode) {\n  text(box.querySelector('h4'), `Toolhead ${h.head + 1}`);\n  box.classList.toggle('is-idle', !h.run.length);\n\n  paintSource(box.querySelector('.g-src'), h, ace, mode);\n\n  const rows = check.rows.filter((r) => r.head === h.head);\n  const chips = box.querySelector('.g-chips');\n  keyedList(chips, h.run, {\n    key: (s) => String(s.filament),\n    create: () => buildChip(),\n    update: (node, s) => paintChip(node, s, h, filaments, rows),\n  });\n\n  paintVerdict(box.querySelector('.g-verdict'), h, rows);\n}\n\n/**\n * What feeds this head, drawn beside its name.\n *\n * In `head` mode that is ONE unit, and the badge - filled with that cabinet's own four\n * bay colours - is drawn once here rather than on every chip, because which unit feeds a\n * head is a property of the head: `ACE_SET_HEAD_ACE HEAD=n ACE=a` binds one to one, and\n * the Prepare tab's per-head `ACE` row is the same fact in the same place.\n *\n * In `multi` there is no unit to name. Bay `i` of EVERY cabinet is plumbed to head `i`,\n * so the head has a LANE and its label is the bays in it; one badge there would name one\n * cabinet out of a set and be wrong about the rest.\n *\n * A stock feeder gets the feeder module's own mark and never a small ACE - a different\n * device with one bay, and at this size the ACE's outline is the same picture.\n */\nfunction paintSource(host, h, ace, mode) {\n  host.textContent = '';\n  if (!h.run.length) return;\n\n  if (h.feeder) {\n    host.appendChild(feederMark());\n    host.appendChild(el('span', 'g-srcname', 'Stock feeder'));\n    return;\n  }\n\n  const units = (ace && ace.units) || [];\n\n  if (mode === 'multi') {\n    const lane = h.lane != null ? h.lane : h.head;\n    const ids = units.map((u) => aceBayAddr(u.index, lane));\n    host.classList.add('is-lane');\n    host.appendChild(el('span', 'g-srcname mono',\n      ids.length ? `Lane \u00b7 ${ids.join(' \u00b7 ')}` : `Lane ${lane + 1}`));\n    return;\n  }\n  host.classList.remove('is-lane');\n\n  const unit = units.find((u) => u.index === h.unit);\n  if (!unit) {\n    host.appendChild(el('span', 'g-srcname dim', 'No ACE reported'));\n    return;\n  }\n  const badge = aceBadge(unit.bays, 20 / 26);\n  badge.setAttribute('aria-hidden', 'true');\n  host.appendChild(badge);\n  const name = el('span', 'g-srcname', `ACE ${unit.id}`);\n  name.title = `ACE ${unit.id}${unit.model ? ` \u00b7 ${unit.model}` : ''}`\n    + (unit.humidity != null ? ` \u00b7 ${unit.humidity}% RH` : '');\n  host.appendChild(name);\n}\n\n/**\n * Snapmaker's Automatic Filament Feeder Module, at mark size: white over black on a\n * rounded square, which is the module's own drawing and not the ACE's.\n */\nfunction feederMark() {\n  const s = svg('svg', { width: 15, height: 15, viewBox: '0 0 24 24',\n                         'aria-hidden': 'true', class: 'g-feedmark' });\n  s.appendChild(svg('rect', { x: 1, y: 1, width: 22, height: 22, rx: 5, fill: '#FFFFFF' }));\n  s.appendChild(svg('path', {\n    d: 'M1 13 h22 v5 a5 5 0 0 1 -5 5 h-12 a5 5 0 0 1 -5 -5 Z', fill: '#1F1F1F' }));\n  s.appendChild(svg('rect', { x: 1, y: 1, width: 22, height: 22, rx: 5, fill: 'none',\n                              stroke: '#D9DDE3', 'stroke-width': 1 }));\n  return s;\n}\n\n/* ---- a chip ------------------------------------------------------------ */\n\nfunction buildChip() {\n  const chip = el('div', 'g-chip');\n  chip.appendChild(el('span', 'g-type'));\n  chip.appendChild(el('span', 'g-from'));\n  return chip;\n}\n\n/**\n * One filament, and where it comes from.\n *\n * The material on a bar in the filament's own colour, the source under it. A source the\n * machine disagrees with is MARKED on the chip rather than replaced on it: `A2` is still\n * where the plan looks, and hiding that would make the verdict below unexplainable.\n */\nfunction paintChip(chip, step, h, filaments, rows) {\n  const fil = filaments[step.filament]\n           || { index: step.filament, type: '---', colors: [] };\n  const colour = fil.colors[0] || '#B7BDC6';\n  const type = chip.querySelector('.g-type');\n  text(type, fil.type);\n  type.style.background = colour;\n  type.style.color = inkOn(colour);\n  chip.dataset.fil = String(fil.index);\n\n  /* The STEP's unit, never the head's: in multi a head has none, and reading the head's\n     produced `bayAddr(undefined, \u2026)`, which renders as `NaN1`. */\n  const addr = h.feeder ? 'Feeder'\n    : (step.slot != null && step.unit != null ? aceBayAddr(step.unit, step.slot) : '\u2014');\n  text(chip.querySelector('.g-from'), addr);\n\n  const row = rows.find((r) => r.want && r.want.index === fil.index);\n  chip.classList.toggle('is-bad', !!row && row.verdict === 'differs');\n  chip.classList.toggle('is-warn', !!row && row.verdict === 'unsure');\n  chip.title = `${fil.type} \u00b7 ${addr}${row && row.say ? ` \u00b7 ${row.say}` : ''}`;\n}\n\n/* ---- the verdict, per head --------------------------------------------- */\n\n/**\n * One line under the box saying where it stands.\n *\n * A head with nothing wrong says what it holds rather than the word \"Ready\": the absence\n * of a mark has already said ready, and a second copy of it is not information.\n */\nfunction paintVerdict(node, h, rows) {\n  node.className = 'g-verdict';\n  if (!h.run.length) { text(node, 'Not used by this plate.'); node.classList.add('dim'); return; }\n\n  const bad = rows.find((r) => r.verdict === 'differs');\n  if (bad) {\n    node.classList.add('bad');\n    text(node, `${bad.addr}: ${bad.say}.${bad.fix ? ` ${bad.fix}.` : ''}`);\n    return;\n  }\n  const unsure = rows.find((r) => r.verdict === 'unsure');\n  if (unsure) {\n    node.classList.add('warn');\n    text(node, `${unsure.addr}: ${unsure.say}.`);\n    return;\n  }\n  if (rows.every((r) => r.verdict === 'unchecked')) { text(node, ''); return; }\n  node.classList.add('ok');\n  text(node, rows.length > 1 ? `All ${rows.length} bays hold the plan.` : rows[0].say);\n}\n\n/* ---- the limit, and the cost ------------------------------------------- */\n\n/**\n * Said once, for the whole grid.\n *\n * The ACE reports its own bays and nothing else, so a wrong colour on a stock feeder goes\n * undetected. Stating that is the difference between a check and a claim - and three of\n * this machine's seven places are stock feeders.\n */\nfunction paintNote(node, plan, check) {\n  const feeders = plan.heads.filter((h) => h.feeder && h.run.length).length;\n  if (!check.checked) {\n    text(node, 'This plate was sliced for an ACE and the printer reports none, '\n             + 'so none of the bays can be checked.');\n    node.className = 'g-note warn';\n    return;\n  }\n  node.className = 'g-note';\n  text(node, feeders\n    ? `The ACE reports its own bays and nothing else, so the ${feeders} stock `\n      + `${feeders === 1 ? 'feeder has' : 'feeders have'} not been checked.`\n    : '');\n}\n\n/**\n * What the arrangement costs, before Send rather than after.\n *\n * ~300 swaps for seven colours on one four-bay head is inherent, not a defect, and an\n * operator is entitled to it before they start a 4-hour print. `saved_*` is what the\n * grouping bought against the same plate run entirely off the ACE head.\n */\nfunction paintCost(node, plan) {\n  node.textContent = '';\n  if (!plan.swaps) return;\n  node.appendChild(el('b', null, String(plan.swaps)));\n  node.appendChild(el('span', null, 'ACE swaps'));\n  /*\n   * Only when there IS one. The emitter's own header line carries `swaps:` and\n   * `optimal:` and no purge figure - measured on a real multiACE plate - so the page must\n   * not draw the clause with an em-dash in it and read \"300 ACE swaps \u2014 purged\".\n   */\n  if (plan.purgeG > 0) {\n    node.appendChild(el('b', null, grams1(plan.purgeG)));\n    node.appendChild(el('span', null, 'purged'));\n  }\n  if (plan.savedSwaps) {\n    node.appendChild(el('span', 'g-saved',\n      `saves ${plan.savedSwaps} swaps against one spool per head`));\n  }\n}\n", "art.js": "/*\n * art.js - the two things this dialog paints a filament colour into.\n *\n * A filament's colour is not one colour. `A.abX` (the card's block) and `A.a6K` (the\n * round target disc) both switch on `filamentColorMulti.mode`:\n *\n *   0 colours   nothing\n *   1 colour    solid - unless its alpha is ZERO, which is an absence and draws a hatch\n *   many, mode 0  equal vertical bands, one per colour\n *   many, mode 1  a left-to-right linear gradient\n *   many, mode 2  the first colour, solid            (disc only)\n *\n * The alpha-zero case is not a curiosity: multiACE wipes a stock-feeder head's identity\n * with `FILAMENT_COLOR_RGBA=00000000` when the machine enters head mode, and the spool is\n * still physically in the head while it happens. Drawing that black would be a lie about\n * the machine; the hatch says \"no colour recorded\".\n */\n'use strict';\n\nimport { el } from '../../../shared/js/dom.js';\n\n/**\n * Paint `node` with a filament's colours.\n *\n * Bands are real child elements rather than a `repeating-linear-gradient` because the\n * bundle builds them as flex children, and because a band has to be able to carry a\n * border when the colour is near-white - see the disc below.\n */\nexport function paintFilament(node, colors, mode = 0) {\n  node.classList.remove('sw-hatch', 'sw-banded');\n  node.style.background = '';\n  node.style.backgroundImage = '';\n  Array.from(node.querySelectorAll('.sw-band')).forEach((n) => n.remove());\n\n  const list = (colors || []).filter(Boolean);\n  if (!list.length) { node.classList.add('sw-hatch'); return; }\n  if (list.length === 1) { node.style.background = list[0]; return; }\n\n  if (Number(mode) === 1) {\n    node.style.backgroundImage = `linear-gradient(90deg, ${list.join(', ')})`;\n    return;\n  }\n  if (Number(mode) === 2) { node.style.background = list[0]; return; }\n\n  node.classList.add('sw-banded');\n  list.forEach((c) => {\n    const b = el('span', 'sw-band');\n    b.style.background = c;\n    node.appendChild(b);\n  });\n}\n\n/**\n * The 28px target disc, with the toolhead's 1-based number on it.\n *\n * `!` rather than a number is the bundle's own mark for an unassigned filament\n * (`s ? \"\"+(a2+1) : \"!\"`), and it is drawn in the warning colour along with the card's\n * border. Nothing else on this surface says \"you have not chosen yet\".\n */\nexport function makeDisc(cls = '') {\n  const d = el('div', `disc ${cls}`.trim());\n  d.appendChild(el('span', 'disc-n'));\n  return d;\n}\n\nexport function updateDisc(disc, { colors, mode, label, ink, unset }) {\n  paintFilament(disc, colors, mode);\n  disc.classList.toggle('unset', !!unset);\n  const n = disc.querySelector('.disc-n');\n  const want = label == null ? '' : String(label);\n  if (n.textContent !== want) n.textContent = want;\n  n.style.color = ink || '';\n}\n", "connection.js": "/*\n * connection.js - bring an MQTT session to the printer up.\n *\n * SHARED by both surfaces. It grew on the Device page, and the print dialog needs the\n * same thing for the same reason: `sw_GetMachineState` answers out of a Moonraker host\n * that something has to attach first. Inside Orca the Device tab usually has, and the\n * popup inherits it; opened on its own - or run outside Orca against u1_bridge.py -\n * nothing has, and every state command comes back \"no engine attached yet\".\n *\n * The page owns the transport; Orca owns the socket. Every step below is a\n * bridge command, and the whole sequence is recovered from SSWCP.cpp and\n * MoonRaker.cpp - see docs/u1-webui/02-device-page/06-connection.md\n *\n * Two paths, chosen by whether the saved device already carries mTLS material:\n *\n *   already paired          first-time LAN pairing\n *   --------------          ----------------------\n *                           sw_GetPincode        printer shows a PIN\n *                           (user reads it off the machine)\n *   sw_create_mqtt_client   sw_create_mqtt_client   mqtts:// vs mqtt://:1884\n *   sw_mqtt_connect         sw_mqtt_connect\n *   sw_mqtt_set_engine      sw_mqtt_set_engine      + code: <PIN>\n *\n * `sw_mqtt_set_engine` is where the real work happens on the C++ side: it builds\n * a Moonraker_Mqtt host, attaches the engine, and - when a `code` is supplied -\n * runs Moonraker_Mqtt::ask_for_tls_info(), which publishes `server.request_key`\n * and receives {state, sn, clientid, ca, cert, key, port}. Orca then stores that\n * on the device record and flips `connected` to true, which reaches us as a\n * push on sw_SubscribeLocalDevices.\n */\n'use strict';\n\nimport { CMD, DEVICE, PAIR_PORT, LAN_AUTH_CODE, MQTT_KEEPALIVE, hasTlsMaterial }\n  from './protocol.js';\n\n/*\n * Cloud hosts. The `.com` / `.cn` split is region selection; Orca appends the\n * locale to this page's own URL, so the region can be read from there.\n * docs/u1-webui/05-printer-protocol/05-cloud-api.md\n */\nfunction cloudBase() {\n  const loc = new URLSearchParams(location.search).get('locale') || '';\n  return /(^|-)(cn|CN)$/.test(loc) || /zh/i.test(loc)\n    ? 'https://api.snapmaker.cn/api'\n    : 'https://api.snapmaker.com/api';\n}\n\n/**\n * Ask the cloud for a device's mTLS material.\n *\n * This is the counterpart of the LAN `server.request_key` handshake: both end\n * with {ca, cert, key, port, clientId}, after which the transport is identical.\n * Used when the user is signed in and the saved device has no keys of its own \u2014\n * which is the normal state, because Orca force-clears `connected` on every\n * config save and never persists cloud-issued keys.\n */\nexport async function fetchCloudCert(device, user) {\n  if (!user || !user.token) return null;\n  const sn = device[DEVICE.SN];\n  const url = `${cloudBase()}/user/device/getMqttCert?sn=${encodeURIComponent(sn)}`;\n  const r = await fetch(url, {\n    headers: { Authorization: `Bearer ${user.token}`, Accept: 'application/json' },\n  });\n  if (!r.ok) throw new Error(`cloud responded ${r.status}`);\n  const j = await r.json();\n  const d = (j && (j.data || j.result)) || j;\n  if (!d || !d.ca || !d.cert || !d.key) return null;\n  return {\n    [DEVICE.CA]: d.ca,\n    [DEVICE.CERT]: d.cert,\n    [DEVICE.KEY]: d.key,\n    [DEVICE.PORT]: d.port || 8883,\n    [DEVICE.CLIENT_ID]: d.clientId || d.clientid || device[DEVICE.CLIENT_ID],\n  };\n}\n\n/**\n * Ask the printer for its mTLS material over the plain connection.\n *\n * This has to happen here, in the page. `sw_mqtt_set_engine` looks like it would\n * do it \u2014 Moonraker_Mqtt::connect() calls ask_for_tls_info() \u2014 but that path is\n * dead: SSWCP.cpp:6643 hardcodes `bool res = true;` and never calls connect().\n * The host expects to be handed an ALREADY-CONNECTED mTLS engine, which is\n * exactly what a captured session from the shipped page shows it doing.\n *\n * Wire form, both on `<auth code>/config/...`:\n *   \u2192 {\"jsonrpc\":\"2.0\",\"method\":\"server.request_key\",\"params\":{\"clientid\":\u2026},\"id\":n}\n *   \u2190 {\"jsonrpc\":\"2.0\",\"id\":n,\"result\":{state,sn,clientid,ca,cert,key,port}}\n */\nasync function requestKeys(bridge, engineId, clientId, trace, timeoutMs = 30000) {\n  const reqTopic = `${LAN_AUTH_CODE}/config/request`;\n  const resTopic = `${LAN_AUTH_CODE}/config/response`;\n  const id = Date.now() % 100000000;\n\n  let resolveKeys;\n  const keys = new Promise((res) => { resolveKeys = res; });\n\n  await bridge.subscribe(CMD.MQTT_SUBSCRIBE,\n    { id: engineId, topic: resTopic, qos: 1, event_id: resTopic },\n    (data) => {\n      // The push carries the raw MQTT payload as a string.\n      const raw = (data && (data.data !== undefined ? data.data : data)) || '';\n      let msg;\n      try { msg = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return; }\n      const r = msg && (msg.result || msg.params || msg);\n      trace(`config/response payload: ${JSON.stringify(msg).slice(0, 300)}`);\n      if (r && r.ca && r.cert && r.key) {\n        trace(`request_key: got material (state=${r.state || '?'}, port=${r.port || '?'})`);\n        resolveKeys(r);\n      }\n    });\n  trace(`subscribed ${resTopic}`);\n\n  // TimeSyncManager::addTimeFields stamps every request the C++ sends, and the\n  // printer expects them: cli_time in unix seconds, dev_time -1 until the clocks\n  // have been synced. Without these the request is ignored silently.\n  // Which auth method a firmware implements is not recoverable from the bundle \u2014\n  // it ships call sites for several. The printer is the oracle: an unsupported\n  // method comes back as -32601, so try each and keep the one it accepts.\n  //\n  // request_lan_auth is first because it is the one verified against real\n  // hardware; server.request_key \u2014 the method the C++ itself sends \u2014 is answered\n  // with \"Method not found\" by this firmware.\n  const appId = `orca-${Date.now() * 1000}`;\n  const candidates = [\n    { method: 'server.client_manager.request_lan_auth',\n      params: { clientid: clientId, app_id: appId } },\n    { method: 'server.client_manager.request_pin_code',\n      params: { userid: '', nickname: 'Snapmaker Orca', app_id: appId } },\n    { method: 'server.request_key', params: { clientid: clientId } },\n  ];\n\n  for (const c of candidates) {\n    const body = JSON.stringify({\n      jsonrpc: '2.0', method: c.method, params: c.params, id: id + candidates.indexOf(c),\n      // TimeSyncManager stamps every request the C++ sends and the printer\n      // expects them: cli_time in unix seconds, dev_time -1 until synced.\n      cli_time: Math.floor(Date.now() / 1000),\n      dev_time: -1,\n    });\n    await bridge.request(CMD.MQTT_PUBLISH,\n                         { id: engineId, topic: reqTopic, qos: 1, payload: body });\n    trace(`tried ${c.method}`);\n    const got = await Promise.race([\n      keys,\n      new Promise((r) => setTimeout(() => r(null), 6000)),\n    ]);\n    if (got) return got;\n  }\n\n  return Promise.race([\n    keys,\n    new Promise((_, rej) =>\n      setTimeout(() => rej(new Error(`no key material within ${timeoutMs}ms`)), timeoutMs)),\n  ]);\n}\n\n/** The create payload the shipped page sends, minus the credentials. */\nfunction mqttParams(address, clientId, device, sn, user) {\n  return {\n    server_address: address,\n    clientId,\n    // The shipped page sends both spellings.\n    clientid: clientId,\n    keepAlivePeriod: MQTT_KEEPALIVE,\n    clean_session: false,\n    link_mode: device[DEVICE.LINK_MODE] || 'lan',\n    sn,\n    userid: (user && user.userid) || '',\n    nickname: (user && user.nickname) || '',\n    id: device[DEVICE.ID] || '',\n  };\n}\n\nexport class ConnectError extends Error {\n  constructor(step, cause) {\n    super(`${step}: ${cause}`);\n    this.name = 'ConnectError';\n    this.step = step;\n  }\n}\n\n/** A client id is required; reuse the saved one so the printer recognises us. */\nfunction clientIdFor(device) {\n  const saved = device[DEVICE.CLIENT_ID];\n  if (saved) return saved;\n  const rnd = (crypto && crypto.randomUUID)\n    ? crypto.randomUUID()\n    : String(Date.now()) + Math.random().toString(16).slice(2);\n  return `orca-${rnd}`;\n}\n\n/**\n * Optional diagnostic sink. Set `opts.trace` and every step reports its params\n * and the host's reply, which is the only way to see what a real printer said\n * when the simulator disagrees with it.\n */\nlet TRACE = () => {};\n\nasync function step(name, promise) {\n  try {\n    const r = await promise;\n    TRACE(`${name}: ok ${summarise(r)}`);\n    return r;\n  } catch (e) {\n    TRACE(`${name}: FAILED ${e.message || String(e)}`);\n    throw new ConnectError(name, e.message || String(e));\n  }\n}\n\n/** Short, and never leaks key material into a log file. */\nfunction summarise(v) {\n  if (v == null) return '(no data)';\n  if (typeof v !== 'object') return String(v).slice(0, 120);\n  const out = {};\n  for (const [k, val] of Object.entries(v)) {\n    if (/^(ca|cert|key|password|token)$/i.test(k)) {\n      out[k] = val ? `<${String(val).length} chars>` : '<empty>';\n    } else if (typeof val === 'string') {\n      out[k] = val.length > 60 ? `${val.slice(0, 60)}\u2026` : val;\n    } else if (typeof val !== 'object') {\n      out[k] = val;\n    }\n  }\n  return JSON.stringify(out).slice(0, 300);\n}\n\n/**\n * Connect to `device`.\n *\n * @param bridge      the WCP client\n * @param device      a DeviceInfo record from sw_GetLocalDevices\n * The key exchange needs no human for a machine that already trusts our client\n * id, which is why there is no PIN parameter: the auth code is fixed.\n * @param opts.user        { userid, nickname } for the pairing request\n * @param opts.onStep      progress callback (text)\n */\nexport async function connect(bridge, device, opts = {}) {\n  const { user = {}, onStep = () => {}, trace } = opts;\n  TRACE = trace || (() => {});\n  const ip = device[DEVICE.IP];\n  const sn = device[DEVICE.SN];\n  if (!ip) throw new ConnectError('precheck', 'the saved device has no IP address');\n  if (!sn) throw new ConnectError('precheck', 'the saved device has no serial number');\n\n  let target = device;\n\n  // A signed-in account can be issued keys by the cloud, which avoids the PIN\n  // entirely. Try it before falling back to LAN pairing.\n  if (!hasTlsMaterial(target) && user && user.token) {\n    onStep('Fetching credentials from your account\u2026');\n    try {\n      const cert = await fetchCloudCert(target, user);\n      if (cert) target = Object.assign({}, target, cert);\n    } catch (e) {\n      // Not fatal: LAN pairing still works.\n      onStep(`Cloud credentials unavailable (${e.message}); pairing over the LAN instead`);\n    }\n  }\n\n  let device_ = target;\n  const paired = hasTlsMaterial(device_);\n  const clientId = clientIdFor(device_);\n\n\n  // ---- phase 1: plain MQTT on :1884, to obtain credentials ---------------\n  //\n  // Skipped entirely when the device already carries keys.\n  let material = null;\n  if (!paired) {\n    const pairAddr = `mqtt://${ip}:${PAIR_PORT}`;\n    onStep(`Opening ${pairAddr}\u2026`);\n    // The shipped page uses a throwaway id for this leg and keeps the saved one\n    // for the session proper.\n    const tryId = `orca-try-${Date.now()}`;\n    const p1 = await step('create pairing client', bridge.request(CMD.CREATE_MQTT_CLIENT,\n      mqttParams(pairAddr, tryId, device_, sn, user)));\n    if (!p1 || !p1.id) throw new ConnectError('create pairing client', 'no engine id');\n    await step('connect pairing client', bridge.request(CMD.MQTT_CONNECT, { id: p1.id }));\n\n    onStep('Exchanging keys\u2026');\n    try {\n      material = await requestKeys(bridge, p1.id, clientId, TRACE);\n    } catch (e) {\n      throw new ConnectError('request key', e.message);\n    } finally {\n      bridge.request(CMD.MQTT_DISCONNECT, { id: p1.id }).catch(() => {});\n    }\n    device_ = Object.assign({}, device_, {\n      [DEVICE.CA]: material.ca,\n      [DEVICE.CERT]: material.cert,\n      [DEVICE.KEY]: material.key,\n      [DEVICE.PORT]: material.port || device_[DEVICE.PORT] || 8883,\n    });\n  }\n\n  // ---- phase 2: mTLS on :8883, the session proper ------------------------\n  const port = device_[DEVICE.PORT] || 8883;\n  const address = `mqtts://${ip}:${port}`;\n  onStep(`Opening ${address}\u2026`);\n\n  const params = mqttParams(address, clientId, device_, sn, user);\n  params.ca = device_[DEVICE.CA];\n  params.cert = device_[DEVICE.CERT];\n  params.key = device_[DEVICE.KEY];\n  params.username = device_[DEVICE.USER] || '';\n  params.password = device_[DEVICE.PASSWORD] || '';\n\n  TRACE(`create client params ${summarise(params)}`);\n  const created = await step('create client', bridge.request(CMD.CREATE_MQTT_CLIENT, params));\n  const id = created && created.id;\n  if (!id) throw new ConnectError('create client', 'the host returned no engine id');\n\n  onStep('Connecting\u2026');\n  await step('connect', bridge.request(CMD.MQTT_CONNECT, { id }));\n\n  // The host routes inbound traffic by topic, so the session's topics have to be\n  // subscribed before it is handed over.\n  for (const suffix of ['status', 'response', 'notification']) {\n    const topic = `${sn}/${suffix}`;\n    await step(`subscribe ${suffix}`, bridge.subscribe(CMD.MQTT_SUBSCRIBE,\n      { id, topic, qos: 1, event_id: topic }, () => {}));\n  }\n\n  // ---- hand the engine to Orca's Moonraker host ---------------------------\n  onStep('Attaching\u2026');\n  const engineParams = {\n    engine_id: id,\n    ip,\n    port,\n    sn,\n    clientId,\n    ca: device_[DEVICE.CA],\n    cert: device_[DEVICE.CERT],\n    key: device_[DEVICE.KEY],\n    user: device_[DEVICE.USER] || '',\n    password: device_[DEVICE.PASSWORD] || '',\n    link_mode: device_[DEVICE.LINK_MODE] || 'lan',\n    // Leave our own page alone: with need_reload true the host reloads the\n    // Device webview mid-sequence, which would tear this down halfway.\n    need_reload: false,\n  };\n  TRACE(`set engine params ${summarise(engineParams)}`);\n  await step('set engine', bridge.request(CMD.MQTT_SET_ENGINE, engineParams));\n\n  onStep('Connected');\n  return { engineId: id, paired: true };\n}\n\n/** Tear the session down. Best effort - a dead engine id is not an error worth raising. */\nexport async function disconnect(bridge, engineId) {\n  if (!engineId) return;\n  try {\n    await bridge.request(CMD.MQTT_DISCONNECT, { id: engineId });\n  } catch { /* already gone */ }\n}\n", "session.js": "/*\n * session.js - everything the dialog knows, and where it came from.\n *\n * The dialog has TWO sources and the whole surface exists to reconcile them:\n *\n *   the FILE      sw_GetFileFilamentMapping, answered by Orca out of the sliced plate\n *   the MACHINE   print_task_config on the state stream, plus each extruder's\n *                 nozzle_diameter\n *\n * Neither is derived from the other, and that is the point: the toolhead a filament may\n * be assigned to is one whose TYPE and NOZZLE both match, so a page that built one list\n * out of the other could never report a mismatch. The shipped bundle names a third\n * command for the machine side - `sw_GetMachineFilamentMapping`, index 29 - which\n * Orca does not implement (`implemented_in_cpp: false` in data/wcp-commands.json), so\n * `print_task_config` is the only source there is.\n *\n * What this module does NOT do is decide anything. It reads, it normalises the two\n * shapes into one vocabulary, and it holds the operator's edits. Which head is offered,\n * which is refused and what the Send button does are the panels' and send.js's.\n */\n'use strict';\n\nimport { CMD, SUBSCRIBE_OBJECTS, TOOLHEADS } from '../../../shared/js/protocol.js';\nimport { connect } from '../../../shared/js/connection.js';\nimport { aceBayAddr, aceOverridesUrl, parseAceOverrides } from '../../../shared/js/multiACE.js';\nimport { cssColor, nozzleStr } from '../widgets/format.js';\n\n/**\n * One file filament, from the reply's PARALLEL ARRAYS.\n *\n * There is no `filaments[]` in this reply and there never has
