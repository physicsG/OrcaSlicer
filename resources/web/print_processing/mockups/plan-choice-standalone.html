sMaterial(f) {\n  return f.used > 0 || f.usedMm > 0 || f.usedMm === -1;\n}\n\nfunction multiColors(m) {\n  if (!m || typeof m !== 'object' || !Array.isArray(m.colors)) return null;\n  const out = m.colors.map(cssColor).filter(Boolean);\n  return out.length ? out : null;\n}\nconst single = (v) => { const c = cssColor(v); return c ? [c] : []; };\n\n/**\n * One toolhead, as the dropdown item needs it: `index`, `filamentType`,\n * `nozzleDiameter`, and the colour.\n *\n * The nozzle comes off the EXTRUDER object rather than print_task_config, because that\n * is where the machine reports it - `SUBSCRIBE_OBJECTS` asks each extruder for\n * `nozzle_diameter` and has since the Device page's first subscription.\n */\nexport function machineToolheads(state) {\n  const tc = (state && state.objects && state.objects['print_task_config']) || {};\n  const arr = (k) => (Array.isArray(tc[k]) ? tc[k] : []);\n  const types = arr('filament_type');\n  const rgba = arr('filament_color_rgba');\n  const argb = arr('filament_color');\n  const multi = arr('filament_color_multi');\n  const exists = arr('filament_exist');\n\n  return TOOLHEADS.map((key, i) => {\n    const ext = (state && state.objects && state.objects[key]) || {};\n    const type = types[i];\n    return {\n      index: i,\n      // The bundle compares this string directly, and treats \"NONE\" as its own case -\n      // it gets a different tooltip from a plain mismatch.\n      filamentType: type == null || type === '' ? 'NONE' : type,\n      nozzleDiameter: nozzleStr(ext.nozzle_diameter),\n      colors: multiColors(multi[i]) || single(rgba[i] != null ? rgba[i] : argb[i]),\n      colorMode: multi[i] && multi[i].mode != null ? Number(multi[i].mode) : 0,\n      loaded: exists[i] !== false,\n    };\n  });\n}\n\n/**\n * May this file filament print from this toolhead?\n *\n * `A.aJQ.$1`, verbatim:\n *\n *     r = file.filamentType == head.filamentType\n *      && file.nozzleDiameter != null\n *      && String(file.nozzleDiameter) === String(head.nozzleDiameter)\n *\n * and `r` is passed as the menu item's ENABLED flag. A head that does not match is not\n * merely discouraged - it cannot be chosen. Both halves matter and the file having no\n * declared nozzle fails the test on its own.\n *\n * The two refusals are told apart because the bundle tells them apart: a head reading\n * NONE gets `dialog_filament_type_none_tips`, anything else\n * `dialog_filament_type_not_match_tips`.\n */\nexport function matchOf(fil, head) {\n  if (!fil || !head) return { ok: false, reason: 'none' };\n  const ok = head.filamentType === fil.type\n          && fil.nozzle != null\n          && String(fil.nozzle) === String(head.nozzleDiameter);\n  if (ok) return { ok: true, reason: null };\n  return { ok: false, reason: head.filamentType === 'NONE' ? 'none' : 'mismatch' };\n}\n\n/**\n * `A.R5`, the nozzle-mismatch banner, and `A.c8l`, the comparison behind it.\n *\n * Set containment, not equality, and deliberately silent at both edges: an empty machine\n * list means the banner never fires, so a page that has not heard from the printer yet\n * does not accuse it of anything.\n */\nexport function nozzleMismatch(fileNozzles, machineNozzles) {\n  const a = (fileNozzles || []).filter(Boolean);\n  const b = (machineNozzles || []).filter(Boolean);\n  if (!a.length && !b.length) return false;\n  if (!b.length) return false;              // c8l: `!n && b.length === 0` -> true\n  const have = new Set(b.map(String));\n  return !a.every((x) => have.has(String(x)));\n}\n\n/**\n * Read everything Orca can tell us about the job, in the shipped popup's own order.\n *\n * Each is independent and each is allowed to fail: a dialog that cannot read the\n * legality check should still draw the file, and one that cannot reach the printer\n * should still say which file it was about to send. What a failure must never do is\n * pass silently - every one lands in `errors`, which the status line reads.\n */\nexport async function readJob(bridge, { log = () => {} } = {}) {\n  const out = { file: null, mapping: null, legal: null, device: null, devices: [],\n                errors: [] };\n\n  const step = async (what, fn) => {\n    try { return await fn(); }\n    catch (e) { out.errors.push(`${what}: ${e.message}`); log(what, e); return null; }\n  };\n\n  out.file = await step('active file', () => bridge.request(CMD.GET_ACTIVE_FILE, {}));\n  out.device = await step('connected machine',\n                          () => bridge.request(CMD.GET_CONNECTED_MACHINE, {}));\n  // The saved list, so the picker has something to offer even when nothing is connected.\n  const list = await step('device list', () => bridge.request(CMD.GET_LOCAL_DEVICES, {}));\n  out.devices = Array.isArray(list) ? list : (list && list.devices) || [];\n\n  if (out.device && (out.device.model_name || out.device.machineType)) {\n    out.legal = await step('legality', () => bridge.request(CMD.GET_PRINT_LEGAL, {\n      connected_model: out.device.model_name || out.device.machineType,\n    }));\n  }\n\n  out.mapping = await step('filament mapping', () => bridge.request(\n    CMD.GET_FILE_FILAMENT_MAPPING,\n    { filename: (out.file && out.file.filename) || '' }));\n\n  return out;\n}\n\n/**\n * Bring the machine half up: a transport if nothing has one, then the subscription.\n *\n * `sw_GetMachineState` answers out of a Moonraker host, and something has to ATTACH one\n * first - `sw_mqtt_set_engine` is what does it. Inside Orca the Device tab usually has,\n * and this popup inherits it. Opened without the Device tab having connected, or run\n * outside Orca against u1_bridge.py, nothing has: every state command comes back\n *\n *     no engine attached yet (sw_mqtt_set_engine has not run)\n *\n * and the dialog draws four toolheads reading NONE with no nozzles - which looks exactly\n * like a printer with nothing loaded. That is the worst kind of wrong: it is a plausible\n * screen, and the operator would map filaments against it.\n *\n * So: try, and if the host says there is no engine, connect and try again. The connect\n * path is the Device page's, unchanged - `shared/js/connection.js`.\n *\n * A device that has never been paired cannot be brought up from here. Pairing needs the\n * PIN the printer is showing, and asking for it is the Device tab's job; this returns the\n * failure rather than growing a second pairing flow.\n */\nexport async function subscribeState(bridge, state, device,\n                                     { log = () => {}, onStep = () => {} } = {}) {\n  const filterAndSubscribe = async () => {\n    try {\n      await bridge.request(CMD.SET_SUBSCRIBE_FILTER, { objects: SUBSCRIBE_OBJECTS });\n    } catch (e) {\n      // Best-effort, as on the Device page: the filter narrows what arrives, and a host\n      // that refuses it still pushes everything.\n      log('subscribe filter', e);\n    }\n    const snap = await bridge.request(CMD.GET_MACHINE_STATE, { objects: SUBSCRIBE_OBJECTS });\n    state.applyPayload(snap);\n    await bridge.subscribe(CMD.SUBSCRIBE_MACHINE_STATE, {}, (d) => state.applyPayload(d));\n  };\n\n  try {\n    await filterAndSubscribe();\n    return { connected: false };            // something already had a host attached\n  } catch (e) {\n    if (!needsEngine(e) || !device) throw e;\n    log('no engine attached; connecting', e);\n  }\n\n  onStep('Connecting to the printer\u2026');\n  const engine = await connect(bridge, device, { onStep, trace: (m) => log('connect', m) });\n  await filterAndSubscribe();\n  return { connected: true, engine };\n}\n\n/**\n * Did that fail because no transport is attached, rather than because the machine said\n * no? The host answers with that sentence and nothing else does.\n */\nfunction needsEngine(e) {\n  return /no engine attached/i.test((e && e.message) || '');\n}\n\n/**\n * The assignment: which toolhead each file filament prints from.\n *\n * It starts from `filament_extruder_map` - Orca's OWN map, made in the Prepare sidebar\n * and handed over in the mapping reply - rather than from nothing. Falls back to\n * identity, which is what the popup shows for a plate Orca has no opinion about.\n */\nexport function initialAssignment(mapping, filaments) {\n  const map = (mapping && mapping.filament_extruder_map) || {};\n  const out = {};\n  filaments.forEach((f) => {\n    const v = map[f.key] != null ? map[f.key] : map[f.index];\n    const n = Number(v);\n    // NOT identity. A filament Orca has no opinion about is UNASSIGNED, which the card\n    // draws as `!` in the warning colour, and which is the bundle's own answer.\n    //\n    // Falling back to `f.index` looked harmless and is not. Against the real machine on\n    // 2026-09-02 the plate wanted PLA in all four while the printer held\n    // [\"PLA\",\"PLA\",\"NONE\",\"PETG\"], so identity put filament 3 on an empty head and\n    // filament 4 on PETG - two toolheads the picker itself REFUSES - and nothing on\n    // screen said so, because the warning mark means \"nothing chosen\" and something had\n    // been. An assignment the operator never made should not be one they have to notice\n    // is wrong.\n    out[f.key] = Number.isFinite(n) ? n : null;\n  });\n  return out;\n}\n\n/* ==================================================================== *\n * The ACE half.\n *\n * Everything below is inert on every plate the slicer can produce today: `ace_plan` is\n * a key `sw_GetFileFilamentMapping` does not send, so `filePlan()` returns null and the\n * dialog is exactly the dialog that already ships. It lights up when the planner lands.\n * See docs/u1-webui/03-print-processing/06-multiace.md.\n * ==================================================================== */\n\n/**\n * The plan the SLICER made, if this plate has one.\n *\n * Normalised rather than trusted: every field is defaulted, and a step's unit falls back\n * to its head's. That fallback is not tidiness - in `head` mode a head is wired to one\n * unit and carrying it per step is redundant, but in `multi` a head has NO unit and its\n * places come one from each cabinet, so the step is the only thing that can say which.\n * Reading the head's there produced `bayAddr(undefined, \u2026)`, which renders as `NaN1`.\n */\nexport function filePlan(mapping) {\n  const raw = mapping && mapping.ace_plan;\n  if (!raw || !Array.isArray(raw.heads) || !raw.heads.length) return null;\n  return {\n    mode: raw.mode || 'head',\n    swaps: Number(raw.swaps) || 0,\n    purgeG: Number(raw.purge_g) || 0,\n    savedSwaps: Number(raw.saved_swaps) || 0,\n    savedPurgeG: Number(raw.saved_purge_g) || 0,\n    heads: raw.heads.map((h) => ({\n      head: Number(h.head) || 0,\n      feeder: !!h.feeder,\n      unit: h.unit != null ? Number(h.unit) : null,\n      lane: h.lane != null ? Number(h.lane) : null,\n      run: (Array.isArray(h.run) ? h.run : []).map((s) => ({\n        filament: Number(s.filament) || 0,\n        unit: s.unit != null ? Number(s.unit) : (h.unit != null ? Number(h.unit) : null),\n        slot: s.slot != null ? Number(s.slot) : null,\n      })),\n    })),\n  };\n}\n\n/**\n * Read the `ace` object.\n *\n * On its own, because it is NOT on `SUBSCRIBE_OBJECTS` - that list is pinned to the\n * shipped bundle's and adding to it would change what every other surface receives. The\n * Device page reads it exactly this way and for exactly this reason.\n *\n * Fails quietly: no multiACE, no printer, or a host that does not know the object all\n * mean the same thing here - there is no ACE to draw, and `ace().present` is false.\n */\nexport async function refreshAce(bridge, state) {\n  try {\n    const snap = await bridge.request(CMD.GET_MACHINE_STATE, {\n      objects: { ace: null, ace_bg_swap: null, save_variables: null },\n    });\n    state.applyPayload(snap);\n    return true;\n  } catch (e) {\n    return false;\n  }\n}\n\n/**\n * multiACE's override store, which is where a bay's NAME lives.\n *\n * The raw slots carry no identity - `{material:\"\", brand:\"\", rfid:0}` - so without this\n * every bay a person named by hand reads as `?`. `/multiace/api/state` is CORS-refused;\n * the store is a file under Moonraker's config root and Moonraker reflects the Origin.\n * Same fetch the Device page makes, and it fails quietly for the same reasons.\n */\nexport async function syncBays(device, mock) {\n  if (mock && mock.aceOverrides) return mock.aceOverrides();\n  const url = aceOverridesUrl(device);\n  if (!url) return null;\n  try {\n    const r = await fetch(url, { cache: 'no-store' });\n    if (!r.ok) throw new Error(`HTTP ${r.status}`);\n    return parseAceOverrides(await r.json());\n  } catch (e) {\n    return null;\n  }\n}\n\n/** rfid and override are ASSERTED. derived is inferred, and is not evidence of a colour. */\nconst TRUSTED = new Set(['rfid', 'override']);\n\n/**\n * Does this bay hold what the plate wants of it?\n *\n * Colour and material, brand ignored: colour alone passes PLA where PETG is loaded, and\n * a brand check flags a Kingroon-against-Generic difference nobody cares about.\n *\n * Four answers, and the third is the one that earns its keep. A bay whose identity was\n * merely DERIVED - inferred from what the head last loaded, asserted by nobody - is not\n * evidence of a wrong spool, and calling it one is a false accusation. A check that cries\n * wolf gets ignored, which costs more than no check. An empty bay is always `differs`:\n * the machine is not guessing about emptiness.\n */\nexport function judgeBay(bay, want) {\n  if (!bay) return { verdict: 'unchecked', say: 'Not reported' };\n  if (!bay.occupied) {\n    return { verdict: 'differs', say: 'Empty', fix: `Put the ${want.type} spool in` };\n  }\n  if (!TRUSTED.has(bay.source)) {\n    return { verdict: 'unsure', say: 'Occupied, nothing names it',\n             fix: 'Tag it, or name it in multiACE' };\n  }\n  const sameType = (bay.material || '') === want.type;\n  const bc = cssColor(bay.color);\n  const sameColour = !!bc && !!want.colors[0]\n    && bc.toUpperCase() === String(want.colors[0]).toUpperCase();\n  if (sameType && sameColour) {\n    return { verdict: 'agrees',\n             say: [bay.vendor, bay.material].filter(Boolean).join(' ') || bay.material };\n  }\n  if (!sameType) {\n    return { verdict: 'differs', say: `${bay.material || '?'}, not ${want.type}`,\n             fix: `Put the ${want.type} spool in` };\n  }\n  return { verdict: 'differs', say: `${bay.material}, wrong colour`,\n           fix: 'Put the right spool in' };\n}\n\n/**\n * Every place the plate needs, in plan order, judged against the machine.\n *\n * A stock feeder is NOT judged, and the page has to say so rather than tick it: the ACE\n * reports its own bays and nothing else, so a wrong colour on a feeder head goes\n * undetected. A tick there would claim a check that was never made.\n */\nexport function reconcile(plan, ace, filaments) {\n  const rows = [];\n  if (!plan) return { rows, differs: 0, unsure: 0, checked: false };\n  const units = (ace && ace.units) || [];\n  const unitOf = (i) => units.find((u) => u.index === i) || null;\n  const checked = !!(ace && ace.present) && units.length > 0;\n  const filAt = (i) => filaments[i] || { index: i, type: '---', colors: [] };\n\n  plan.heads.forEach((h) => {\n    h.run.forEach((step, order) => {\n      const want = filAt(step.filament);\n      if (h.feeder) {\n        rows.push({ head: h.head, feeder: true, order, want, addr: null,\n                    verdict: 'unchecked',\n                    say: 'Stock feeder \u2014 the ACE does not report it' });\n        return;\n      }\n      const ui = step.unit != null ? step.unit : h.unit;\n      const u = unitOf(ui);\n      const bay = u && step.slot != null ? u.bays[step.slot] : null;\n      const j = checked && u ? judgeBay(bay, want)\n                             : { verdict: 'unchecked', say: 'No ACE reported' };\n      rows.push({ head: h.head, feeder: false, unit: ui, slot: step.slot, order,\n                  addr: aceBayAddr(ui, step.slot), want, bay, ...j });\n    });\n  });\n\n  return { rows, checked,\n           differs: rows.filter((r) => r.verdict === 'differs').length,\n           unsure: rows.filter((r) => r.verdict === 'unsure').length };\n}\n", "filament-view.js": "/*\n * filament-view.js - Edit Filament.\n *\n * A Wrap of 80 x 100 cards, spacing 12 both ways, one per file filament (`A.aiy` ->\n * `A.A0`). Each card is a colour block over a toolhead picker, split flex 3 / a 1px rule\n * / flex 4. The block carries the filament's TYPE and its weight in the ink that stays\n * legible on it; the picker carries a 28px disc with the chosen toolhead's 1-based\n * number, or `!` when nothing is chosen yet.\n *\n * That last one is the section's only affordance for \"you still have to decide\", and it\n * comes with a warning-coloured card border. Both are the bundle's.\n *\n * Cards are reconciled by key rather than rebuilt: a card whose menu is open must not be\n * replaced under the pointer, and the state stream pushes about once a second.\n */\n'use strict';\n\nimport { el } from '../../../../shared/js/dom.js';\nimport { keyedList, text, data } from '../../../../shared/js/render.js';\nimport { paintFilament, makeDisc, updateDisc } from '../../widgets/art.js';\nimport { openPicker, closePicker, isPickerOpen } from '../../widgets/picker.js';\nimport { grams0, inkOn } from '../../widgets/format.js';\nimport { matchOf } from '../../core/session.js';\nimport { aceBadge, ACE_MODE_LABELS } from '../../../../shared/js/multiACE.js';\n\n/**\n * What feeds a toolhead, in one short phrase, or null when there is nothing to add.\n *\n * `ace.heads[i]` is the Device page's own resolution - manual, then feeder, then ACE -\n * so this surface does not re-derive it. A stock feeder gets nothing: it is the ordinary\n * case and naming it on every row would bury the one row that differs.\n */\nfunction headSource(ace, i) {\n  const h = ace && ace.present && (ace.heads || [])[i];\n  if (!h) return null;\n  if (h.source === 'manual') return 'hand-fed';\n  if (h.source !== 'ace') return null;\n  return h.bay != null ? `ACE ${h.unitId}${h.bay + 1}` : `ACE ${h.unitId}`;\n}\n\n/**\n * The machine's own line: its ACE mode and its units.\n *\n * Drawn from `ace` alone and therefore on EVERY plate, which is the repair - the plan\n * decides whether the mapping is a choice, and the machine decides what feeds each head.\n * Absent on a printer that reports no ACE, so an ordinary U1 sees the dialog it always\n * saw.\n */\nfunction paintMachine(host, ace) {\n  const on = !!(ace && ace.present && (ace.units || []).length);\n  host.hidden = !on;\n  if (!on) return;\n  const sig = `${ace.mode}|` + ace.units.map((u) => u.id + u.bays.map(\n    (b) => (b.occupied ? (b.material || '?') + (b.color || '') : '-')).join('')).join('|');\n  if (host.dataset.sig === sig) return;      // the state stream pushes about once a second\n  host.dataset.sig = sig;\n  host.textContent = '';\n\n  host.appendChild(el('span', 'fil-mode', `ACE mode \u00b7 ${ACE_MODE_LABELS[ace.mode] || ace.mode}`));\n  ace.units.forEach((u) => {\n    const one = el('span', 'fil-unit');\n    const badge = aceBadge(u.bays, 17 / 26);\n    badge.setAttribute('aria-hidden', 'true');\n    one.appendChild(badge);\n    one.appendChild(el('span', null, `ACE ${u.id}`));\n    one.title = `ACE ${u.id}${u.model ? ` \u00b7 ${u.model}` : ''}`;\n    host.appendChild(one);\n  });\n  const heads = (ace.heads || []).filter((h) => h.source === 'ace')\n    .map((h) => `Toolhead ${h.index + 1}`);\n  if (heads.length) {\n    host.appendChild(el('span', 'fil-feeds',\n      `feeds ${heads.join(', ')}`));\n  }\n}\n\n/* The bundle's own two strings for the two ways a toolhead can be refused. They are\n   localisation keys with no English entry in the bundle, so they render as themselves -\n   which is what the shipped dialog shows too. */\nconst TIP_NONE = 'dialog_filament_type_none_tips';\nconst TIP_MISMATCH = 'dialog_filament_type_not_match_tips';\n\nexport function mount(root) {\n  /*\n   * The MACHINE, above the cards, when it has an ACE.\n   *\n   * This panel is the mapping control for a plate that addresses no bays, and that is\n   * still the right control - the file made no choice, so the operator's is real. What it\n   * could not do was describe an ACE-fed head: it drew `head 4: PLA` for a head whose\n   * filament is whichever of three spools the unit last loaded, and said nothing about the\n   * other two sitting in the same cabinet.\n   *\n   * That was the wrong branch. Whether the FILE addresses bays and whether the MACHINE has\n   * an ACE are two different facts, and only the first was wired - so on every plate that\n   * exists today the ACE was read, merged, and thrown away.\n   */\n  root.appendChild(el('div', 'fil-machine'));\n  root.appendChild(el('div', 'fil-grid'));\n}\n\nexport function update(root, model, ctx) {\n  const { filaments, toolheads, assignment, ace } = model;\n  const grid = root.querySelector('.fil-grid');\n\n  paintMachine(root.querySelector('.fil-machine'), ace);\n\n  keyedList(grid, filaments, {\n    key: (f) => f.key,\n    create: (f) => buildCard(f),\n    update: (node, f) => paintCard(node, f, toolheads, assignment, ace, ctx),\n  });\n\n  // `B.aya` - an invisible 80x100 box holds the row open when there is nothing to draw,\n  // so the section does not collapse to its title while the mapping is still arriving.\n  data(grid, 'empty', filaments.length ? null : '1');\n}\n\nfunction buildCard(f) {\n  const card = el('div', 'fil-card');\n\n  const block = el('div', 'fil-block');\n  block.appendChild(el('div', 'fil-type'));\n  block.appendChild(el('div', 'fil-used'));\n  card.appendChild(block);\n\n  card.appendChild(el('div', 'fil-rule'));\n\n  const pick = el('button', 'fil-pick');\n  pick.type = 'button';\n  pick.setAttribute('aria-haspopup', 'listbox');\n  pick.setAttribute('aria-expanded', 'false');\n  pick.setAttribute('aria-label', `Toolhead for filament ${f.index + 1}`);\n  pick.appendChild(makeDisc());\n  pick.appendChild(el('span', 'fil-caret'));\n  card.appendChild(pick);\n\n  return card;\n}\n\nfunction paintCard(card, f, toolheads, assignment, ace, ctx) {\n  const block = card.querySelector('.fil-block');\n  paintFilament(block, f.colors, f.colorMode);\n  const ink = inkOn(f.colors[0]);\n  const type = card.querySelector('.fil-type');\n  const used = card.querySelector('.fil-used');\n  text(type, f.type);\n  text(used, grams0(f.used));\n  type.style.color = ink;\n  used.style.color = ink;\n\n  const at = assignment[f.key];\n  const head = at == null ? null : toolheads[at];\n  const unset = !head;\n  card.classList.toggle('unset', unset);\n\n  updateDisc(card.querySelector('.disc'), {\n    colors: head ? head.colors : [],\n    mode: head ? head.colorMode : 0,\n    // `s ? \"\"+(a2+1) : \"!\"` - the 1-based toolhead number, or the mark for undecided.\n    label: head ? String(head.index + 1) : '!',\n    ink: head ? inkOn(head.colors[0]) : '',\n    unset,\n  });\n\n  const pick = card.querySelector('.fil-pick');\n  pick.onclick = () => {\n    if (isPickerOpen(pick)) { closePicker(); return; }\n    openPicker({\n      trigger: pick,\n      kind: 'head',\n      within: ctx.dialog(),\n      value: at,\n      items: toolheads.map((h) => {\n        const m = matchOf(f, h);\n        return {\n          value: h.index,\n          // The bundle passes this as the DropdownMenuItem's `enabled` flag. A toolhead\n          // whose type or nozzle does not match the file filament is not merely\n          // discouraged - it cannot be chosen at all.\n          enabled: m.ok,\n          title: m.ok ? '' : (m.reason === 'none' ? TIP_NONE : TIP_MISMATCH),\n          build: (node) => {\n            const d = makeDisc('disc-menu');\n            updateDisc(d, { colors: h.colors, mode: h.colorMode,\n                            label: String(h.index + 1), ink: inkOn(h.colors[0]) });\n            node.appendChild(d);\n            const label = el('span', 'menu-type', h.filamentType);\n            if (!m.ok) label.classList.add('bad');\n            node.appendChild(label);\n            /* Where that filament came from, when the machine can say. `head 4: PLA` is\n               true and useless on an ACE-fed head - it is whichever of the unit's spools\n               was last loaded, and the address is what lets someone go and look. */\n            const src = headSource(ace, h.index);\n            if (src) node.appendChild(el('span', 'menu-src', src));\n            if (h.index === at) node.appendChild(el('span', 'menu-tick'));\n            if (!m.ok) node.appendChild(el('span', 'menu-warn'));\n          },\n        };\n      }),\n      onPick: (v) => ctx.assign(f, Number(v)),\n    });\n  };\n}\n", "preferences-view.js": "/*\n * preferences-view.js - Print Preferences.\n *\n * Three rows in a Wrap with runSpacing 12 and spacing 170 (`A.Ja`), each row a\n * ConstrainedBox of 152..220 by 20 (`B.VS`). At this dialog's width the 170 gutter is\n * what puts them one per line; the numbers are kept rather than replaced with a column,\n * because the wrap is what decides the layout at any other width.\n *\n * The toggle is an 18px ROUND CHECKBOX, not a switch: `A.a3(..., 18, ..., 18)` with\n * radius 9, a 2px border, and `B.fx` green with a 14px white check when on.\n *\n * Only the first carries a help control, and it opens a real dialog rather than a\n * tooltip - `A.rB(...)` with an OK button.\n */\n'use strict';\n\nimport { el } from '../../../../shared/js/dom.js';\nimport { attr } from '../../../../shared/js/render.js';\nimport { PRINT_PREFERENCES } from '../../../../shared/js/protocol.js';\n\n/* The bundle's own help text, verbatim, for the one preference that has any. */\nexport const FLOW_HELP = {\n  title: 'Extrusion Flow Calibration',\n  body: 'When enabled, the printer will automatically calibrate flow compensation '\n      + 'before printing. Recommended after each filament change.',\n};\n\nexport function mount(root, ctx) {\n  const wrap = el('div', 'prefs');\n  PRINT_PREFERENCES.forEach(({ key, label }) => {\n    const row = el('button', 'pref');\n    row.type = 'button';\n    row.dataset.key = key;\n    row.setAttribute('role', 'switch');\n    row.appendChild(el('span', 'pref-label', label));\n    if (key === PRINT_PREFERENCES[0].key) {\n      const help = el('span', 'pref-help');\n      help.setAttribute('role', 'button');\n      help.tabIndex = 0;\n      help.title = FLOW_HELP.title;\n      const ask = (e) => { e.stopPropagation(); ctx.explain(FLOW_HELP); };\n      help.onclick = ask;\n      help.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') ask(e); };\n      row.appendChild(help);\n    }\n    row.appendChild(el('span', 'pref-box'));\n    row.onclick = () => ctx.togglePreference(key, !ctx.prefValue(key));\n    wrap.appendChild(row);\n  });\n  root.appendChild(wrap);\n}\n\nexport function update(root, { prefs }) {\n  root.querySelectorAll('.pref').forEach((row) => {\n    attr(row, 'aria-checked', String(!!prefs[row.dataset.key]));\n  });\n}\n", "ace-fixture.js": "/*\n * ace-fixture.js - the data the multiACE print-dialog mockups run on.\n *\n * Three things and nothing else: the FILE (a plate wanting seven filaments), the MACHINE\n * (four toolheads and the places that can feed them), and the judgement between them.\n *\n * IT IS THE DEVICE PAGE'S MODEL, NOT A NEW ONE\n *\n * `bays[]` here is exactly what `aceUnit()` in shared/js/multiACE.js returns - `index`,\n * `addr`, `occupied`, `known`, `material`, `subType`, `vendor`, `color`, `rfid`,\n * `source` - because the print dialog is looking at the same machine the Device page's\n * Filament panel draws, and a second vocabulary for one object is how two surfaces come\n * to disagree about it. `source` carries multiACE's own precedence, `rfid > override >\n * derived`, and that is what makes the verdict below three-valued rather than two.\n *\n * `heads[]` is `state.filaments()`' shape plus the head's `nozzle`, which is where the\n * dialog already reads it from - the extruder object, not print_task_config.\n *\n * WHERE THE NUMBERS COME FROM\n *\n * The machine is the U1 at 192.168.2.242 as the Filament panel was measured against it:\n * `mode: \"head\"`, one ACE 2 Pro (`protocol: \"v2\"`) at 39% RH feeding toolhead 4, heads\n * 1-3 on their stock feeders. Capacity is therefore 3 + 4 = SEVEN places, which is the\n * whole reason this dialog needs rebuilding: the four-card dialog has four labels.\n *\n * THE PLATE'S SIDE IS A PLAN, AND IT IS THE FILE'S\n *\n * On a plate sliced for an ACE the emitter has already decided which head runs which\n * filament and out of which bay, and it wrote that into the gcode. So `PLAN` describes a\n * file that exists; it is not a proposal this dialog is making, and none of these three\n * options has a head picker. What the dialog can still do is check the machine against\n * it, and say what to move.\n */\n'use strict';\n\n/* ---- the plate ---------------------------------------------------------- */\n\n/** Standing in for `thumbnails[0].url` - on a real reply, a base64 PNG of the plate. */\nfunction plateThumb(colors) {\n  const band = (i, c) => `<rect x=\"58\" y=\"${56 + i * 12}\" width=\"84\" height=\"12\" fill=\"${c}\"/>`;\n  const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\">\n    <defs><linearGradient id=\"bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"#2a3542\"/><stop offset=\"1\" stop-color=\"#131a22\"/>\n    <\/linearGradient><\/defs>\n    <rect width=\"200\" height=\"200\" fill=\"url(#bg)\"/>\n    <g opacity=\".16\" stroke=\"#7f8d9d\" stroke-width=\"1\">\n      ${Array.from({ length: 7 }, (_, i) => `<path d=\"M${30 + i * 20} 150 L${100 + (i - 3) * 10} 176\"/>`).join('')}\n    <\/g>\n    <path d=\"M30 150 L100 176 L170 150 L100 126 Z\" fill=\"#1b232d\" stroke=\"#3c4956\"/>\n    <g>${colors.map((c, i) => band(colors.length - 1 - i, c)).join('')}<\/g>\n    <path d=\"M58 56 L58 140 L100 156 L100 72 Z\" fill=\"#000\" opacity=\".18\"/>\n    <path d=\"M100 72 L100 156 L142 140 L142 56 Z\" fill=\"#fff\" opacity=\".07\"/>\n  <\/svg>`;\n  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);\n}\n\nconst F = (i, type, color, name, weight, mm) =>\n  ({ index: i, key: String(i), type, color, name, weight, usedMm: mm });\n\n/** The seven the plate prints, in the plate's own order. */\nexport const FILAMENTS = [\n  F(0, 'PLA', '#EC008C', 'Magenta', 6.6, 2210),\n  F(1, 'PLA', '#FEC600', 'Amber', 7.27, 2431),\n  F(2, 'PLA', '#00AE42', 'Green', 7.36, 2460),\n  F(3, 'PLA', '#0056B8', 'Blue', 7.58, 2534),\n  F(4, 'PLA', '#F44336', 'Red', 6.7, 2240),\n  F(5, 'PLA', '#F2F2F2', 'White', 6.5, 2173),\n  F(6, 'PLA', '#1A1A1A', 'Black', 6.7, 2241),\n];\n\n/*\n * `sw_GetFileFilamentMapping` as SSWCP.cpp:3039 builds it - PARALLEL ARRAYS, never a\n * `filaments[]` of objects.\n *\n * Everything here exists today. What does not is `ace_plan` below, and its absence is\n * the first integration item: nothing in this reply says a plate was sliced for an ACE.\n */\nexport const MAPPING = {\n  filename: 'colour_cube_7.gcode',\n  filepath: '/tmp/SnapmakerOrca/plate_1.gcode',\n  machine_model: 'Snapmaker U1',\n  estimated_time: 14232,\n  filament_type: FILAMENTS.map((f) => f.type),\n  filament_color_rgba: FILAMENTS.map((f) => f.color),\n  filament_weight: FILAMENTS.map((f) => f.weight),\n  filament_weight_total: FILAMENTS.reduce((a, f) => a + f.weight, 0),\n  filament_used_mm: FILAMENTS.map((f) => f.usedMm),\n  nozzle_diameters: ['0.4', '0.4', '0.4', '0.4'],\n  nozzle_info: ['0.4'],\n  filament_extruder_map: { 0: '3', 1: '0', 2: '1', 3: '2', 4: '3', 5: '3', 6: '3' },\n  thumbnails: [{ url: plateThumb(FILAMENTS.map((f) => f.color)), width: 512, height: 512 }],\n};\n\n/*\n * PROPOSED - `ace_plan`, the one key that would make a plate legible here.\n *\n * Nothing in it would be computed by the page: the slicer decides the layout, writes a\n * plan line into the gcode header and emits an `ACE_SWAP_HEAD HEAD=n ACE=u SLOT=s` for\n * every swap. This is that, handed over.\n *\n *   heads[h].run   the file filaments head h runs, IN THE ORDER IT RUNS THEM, each with\n *                  the bay it comes from when the head is ACE-fed\n *   swaps/purge_g  what the layout costs, which the operator is entitled to before Send\n */\nexport const PLAN = {\n  mode: 'head',\n  swaps: 300,\n  purge_g: 40.4,\n  /*\n   * What the grouping BOUGHT, which is the line Bambu's Slicing Result panel carries\n   * (\"Save 25g filament and 100 nozzle purges compared to a printer with one nozzle\").\n   *\n   * The U1's comparison is not against one nozzle - it has four - but against the same\n   * plate with every filament on the ACE head, which is what a machine with no free tool\n   * changes would have to do. Three of the seven ride stock feeders, so every change into\n   * those three is a tool change instead of a swap. The planner computes both; these are\n   * the difference.\n   */\n  savedSwaps: 212,\n  savedPurge_g: 28.6,\n  heads: [\n    { head: 0, feeder: true, run: [{ filament: 1 }] },\n    { head: 1, feeder: true, run: [{ filament: 2 }] },\n    { head: 2, feeder: true, run: [{ filament: 3 }] },\n    { head: 3, feeder: false, unit: 0,\n      run: [{ filament: 0, unit: 0, slot: 0 }, { filament: 4, unit: 0, slot: 1 },\n            { filament: 5, unit: 0, slot: 2 }, { filament: 6, unit: 0, slot: 3 }] },\n  ],\n};\n\n/*\n * The same seven filaments on a machine with TWO ACE units.\n *\n * Two stock feeders and two ACE-fed heads is 2 + 4 + 4 = TEN places, so a seven-filament\n * plate no longer has to stack four onto one head: the planner spreads them, and the\n * swap count falls because each ACE head changes spools less often. Which is the whole\n * argument for a second unit, and the reason it belongs in a mockup - the dialog has to\n * be legible when a chip's address could name either cabinet.\n */\nexport const PLAN_TWO = {\n  mode: 'head',\n  swaps: 164,\n  purge_g: 22.1,\n  savedSwaps: 348,\n  savedPurge_g: 46.9,\n  heads: [\n    { head: 0, feeder: true, run: [{ filament: 1 }] },\n    { head: 1, feeder: true, run: [{ filament: 2 }] },\n    { head: 2, feeder: false, unit: 1,\n      run: [{ filament: 3, unit: 1, slot: 0 }, { filament: 4, unit: 1, slot: 1 }] },\n    { head: 3, feeder: false, unit: 0,\n      run: [{ filament: 0, unit: 0, slot: 0 }, { filament: 5, unit: 0, slot: 1 },\n            { filament: 6, unit: 0, slot: 2 }] },\n  ],\n};\n\n/*\n * The same plate in MULTI mode, which is a different machine.\n *\n * The Device page's reading, measured: bay `i` of EVERY unit is plumbed to head `i`. So a\n * head is not wired to a unit at all - it has a LANE, and its places are one bay from\n * each cabinet. Head 1 can only ever be fed A1 or B1; A2 is not reachable from it at any\n * price. `head_feeder` and `head_ace` are ignored outright in this mode, so no head is a\n * stock feeder and the capacity is heads x units = EIGHT.\n *\n * That constraint is what the mode costs: seven filaments fit, but only in the shape the\n * lanes allow, and the planner has less freedom than in head mode - here 214 swaps\n * against head mode's 164 on the same two units.\n *\n * NOTE, and it is a real disagreement rather than a wording difference: the Prepare tab\n * says the opposite. `Plater.cpp:9845` labels this mode \"Units pooled onto a single ACE\n * head\" and `PrintConfig.cpp:3995` \"\\\"Combined\\\" pools several units onto a single head\".\n * One says every head gets a lane; the other says every unit converges on one head. Only\n * one can be true of the hardware. These mockups follow the Device page, which is the\n * surface that was built against the live mode switch.\n */\nexport const PLAN_MULTI = {\n  mode: 'multi',\n  swaps: 214,\n  purge_g: 29.8,\n  savedSwaps: 298,\n  savedPurge_g: 39.2,\n  heads: [\n    { head: 0, feeder: false, lane: 0,\n      run: [{ filament: 1, unit: 0, slot: 0 }, { filament: 0, unit: 1, slot: 0 }] },\n    { head: 1, feeder: false, lane: 1,\n      run: [{ filament: 2, unit: 0, slot: 1 }, { filament: 4, unit: 1, slot: 1 }] },\n    { head: 2, feeder: false, lane: 2,\n      run: [{ filament: 3, unit: 0, slot: 2 }, { filament: 5, unit: 1, slot: 2 }] },\n    { head: 3, feeder: false, lane: 3,\n      run: [{ filament: 6, unit: 0, slot: 3 }] },\n  ],\n};\n\n/** Four filaments, no plan - which is every plate the slicer can make today. */\nexport const PLAIN_MAPPING = {\n  ...MAPPING,\n  filename: 'benchy_4colour.gcode',\n  estimated_time: 4412,\n  filament_type: ['PLA', 'PLA', 'PLA', 'PLA'],\n  filament_color_rgba: ['#FEC600', '#00AE42', '#0056B8', '#EC008C'],\n  filament_weight: [7.27, 7.36, 7.58, 6.6],\n  filament_used_mm: [2431, 2460, 2534, 2210],\n  filament_extruder_map: { 0: '0', 1: '1', 2: '2', 3: '3' },\n};\n\nexport const JOB = { displayName: 'colour_cube_7.gcode', sizeBytes: 31_402_118 };\nexport const DEVICE = { name: 'U1 (workshop)', model: 'Snapmaker U1',\n                        sn: '811002511261022618B3', connected: true };\n\n/* ---- the machine -------------------------------------------------------- */\n\n/*\n * A bay, in `aceUnit()`'s own shape. `source` is where the identity came from, and it is\n * the field the whole judgement turns on:\n *\n *   rfid      the spool said so over the air        eye, and the green RFID mark\n *   override  somebody named it in multiACE         pencil\n *   derived   inferred from what the head loaded    pencil, but nobody asserted it\n *   unknown   occupied, nothing names it            the grey chip and `?`\n *   empty     the checkerboard\n */\nconst BAY = (index, o) => Object.assign(\n  { index, addr: bayAddr(0, index), occupied: false, known: false,\n    material: '', subType: '', vendor: '', color: null, rfid: 0, source: 'empty' }, o);\n\nconst SPOOL = (index, material, color, vendor, source) => BAY(index, {\n  occupied: true, known: true, material, color, vendor,\n  rfid: source === 'rfid' ? 1 : 0, source,\n});\n\n/** rfid and override are ASSERTED. derived is inferred, and is not evidence of a colour. */\nexport const TRUSTED = new Set(['rfid', 'override']);\n\nconst HEAD = (index, o) => Object.assign(\n  { index, type: null, color: null, vendor: null, nozzle: '0.4', loaded: false }, o);\n\n/* Heads 1-3 on their stock feeders, head 4 fed by ACE 1 - the measured machine. */\nconst FEEDERS = [\n  HEAD(0, { type: 'PLA', color: '#FEC600', vendor: 'Jayo', loaded: true }),\n  HEAD(1, { type: 'PLA', color: '#00AE42', vendor: 'Forshape', loaded: true }),\n  HEAD(2, { type: 'PLA', color: '#0056B8', vendor: 'Kingroon', loaded: true }),\n];\nconst ACE_HEAD = HEAD(3, { type: 'PLA', color: '#EC008C', vendor: 'Jayo', loaded: true });\n\nconst UNIT = (bays, o) => Object.assign(\n  { index: 0, id: 'A', model: 'ACE 2 Pro', connected: true, humidity: 39,\n    temperature: 27, dryer: { running: false }, bays }, o);\n\n/*\n * A second unit. `ACE_SET_HEAD_ACE` binds a head to exactly one unit and says nothing\n * about the reverse, so two units feeding two heads is the ordinary two-ACE shape - and\n * the machine reports the model per unit, which is why B is an older ACE Pro here: two\n * units are not necessarily the same device, and a page that assumes they are will draw\n * the wrong one.\n */\nconst UNIT_B = (bays, o) => UNIT(bays, Object.assign(\n  { index: 1, id: 'B', model: 'ACE Pro', humidity: 44, temperature: 26 }, o));\n\nconst bayIn = (unit, index, o) => Object.assign(\n  BAY(index, o), { addr: bayAddr(unit, index) });\n\nconst SPOOL_B = (index, material, color, vendor, source) => bayIn(1, index, {\n  occupied: true, known: true, material, color, vendor,\n  rfid: source === 'rfid' ? 1 : 0, source,\n});\n\nconst AS_PLANNED = () => [\n  SPOOL(0, 'PLA', '#EC008C', 'Jayo', 'rfid'),\n  SPOOL(1, 'PLA', '#F44336', 'Jayo', 'rfid'),\n  SPOOL(2, 'PLA', '#F2F2F2', 'Generic', 'override'),\n  SPOOL(3, 'PLA', '#1A1A1A', 'Jayo', 'rfid'),\n];\n\n/* ---- the scenarios ------------------------------------------------------ */\n\n/*\n * Six. Each is a thing that has happened on this machine or is one spool away from it.\n * \"No printer\" is not among them - the four-card mockups already cover it and nothing\n * about it is ACE-specific.\n */\nexport const SCENARIOS = {\n  ready: {\n    label: 'Every place holds the plan',\n    note: 'All seven places hold what the plate was sliced for, and every ACE bay is '\n        + 'either tag-read or named by hand.',\n    plan: PLAN, mapping: MAPPING,\n    ace: { present: true, mode: 'head', units: [UNIT(AS_PLANNED())] },\n    heads: FEEDERS.concat([ACE_HEAD]),\n  },\n\n  swapped: {\n    label: 'Two bays are the other way round',\n    note: 'A2 holds white and A3 holds red; the plate wants the reverse. Both are named, '\n        + 'so the machine is sure, and the fix is two spools.',\n    plan: PLAN, mapping: MAPPING,\n    ace: { present: true, mode: 'head',\n           units: [UNIT((() => { const b = AS_PLANNED();\n                                 const r = { ...b[1] }, w = { ...b[2] };\n                                 b[1] = { ...w, index: 1, addr: 'A2' };\n                                 b[2] = { ...r, index: 2, addr: 'A3' };\n                                 return b; })())] },\n    heads: FEEDERS.concat([ACE_HEAD]),\n  },\n\n  unnamed: {\n    label: 'A bay nobody named',\n    note: 'A4 holds a spool with no tag and no override. Its identity is derived, not '\n        + 'asserted, so the honest verdict is \u201ccannot tell\u201d rather than \u201cwrong\u201d.',\n    plan: PLAN, mapping: MAPPING,\n    ace: { present: true, mode: 'head',\n           units: [UNIT((() => { const b = AS_PLANNED();\n                                 b[3] = BAY(3, { addr: 'A4', occupied: true, known: false,\n                                                 source: 'unknown' });\n                                 return b; })(), { humidity: 52 })] },\n    heads: FEEDERS.concat([ACE_HEAD]),\n  },\n\n  wrong: {\n    label: 'Wrong material, and an empty bay',\n    note: 'A2 has Kingroon PETG where the plate wants PLA, and A4 is empty. Emptiness is '\n        + 'never a judgement call.',\n    plan: PLAN, mapping: MAPPING,\n    ace: { present: true, mode: 'head',\n           units: [UNIT((() => { const b = AS_PLANNED();\n                                 b[1] = SPOOL(1, 'PETG', '#83AFFF', 'Kingroon', 'rfid');\n                                 b[1].addr = 'A2';\n                                 b[3] = BAY(3, { addr: 'A4' });\n                                 return b; })())] },\n    heads: FEEDERS.concat([ACE_HEAD]),\n  },\n\n  noace: {\n    label: 'The plate has a plan; the machine has no ACE',\n    note: 'The printer reports no `ace` object at all. Nothing can be checked, and a tick '\n        + 'meaning \u201ccould not check\u201d would be worse than no tick.',\n    plan: PLAN, mapping: MAPPING,\n    ace: { present: false, mode: null, units: [] },\n    heads: FEEDERS.concat([HEAD(3, {})]),\n  },\n\n  twoace: {\n    label: 'Two ACE units',\n    note: 'ACE A feeds toolhead 4 and ACE B feeds toolhead 3, so ten places hold seven '\n        + 'filaments and the ACE heads swap far less. Every chip\u2019s address could now name '\n        + 'either cabinet.',\n    plan: PLAN_TWO, mapping: MAPPING,\n    ace: { present: true, mode: 'head',\n           units: [\n             UNIT([\n               SPOOL(0, 'PLA', '#EC008C', 'Jayo', 'rfid'),\n               SPOOL(1, 'PLA', '#F2F2F2', 'Generic', 'override'),\n               SPOOL(2, 'PLA', '#1A1A1A', 'Jayo', 'rfid'),\n               BAY(3, { addr: 'A4' }),\n             ]),\n             UNIT_B([\n               SPOOL_B(0, 'PLA', '#0056B8', 'Kingroon', 'rfid'),\n               SPOOL_B(1, 'PLA', '#F44336', 'Jayo', 'rfid'),\n               bayIn(1, 2, {}),\n               bayIn(1, 3, {}),\n             ]),\n           ] },\n    heads: [\n      HEAD(0, { type: 'PLA', color: '#FEC600', vendor: 'Jayo', loaded: true }),\n      HEAD(1, { type: 'PLA', color: '#00AE42', vendor: 'Forshape', loaded: true }),\n      HEAD(2, { type: 'PLA', color: '#0056B8', vendor: 'Kingroon', loaded: true }),\n      ACE_HEAD,\n    ],\n  },\n\n  multi: {\n    label: 'Multi mode \u2014 every head has a lane',\n    note: 'Bay i of every unit is plumbed to head i, so head 1 can only ever be fed A1 or '\n        + 'B1. No head is a stock feeder, capacity is heads x units = eight, and the '\n        + 'planner has less freedom than head mode has on the same two cabinets.',\n    plan: PLAN_MULTI, mapping: MAPPING,\n    ace: { present: true, mode: 'multi',\n           units: [\n             UNIT([\n               SPOOL(0, 'PLA', '#FEC600', 'Jayo', 'rfid'),\n               SPOOL(1, 'PLA', '#00AE42', 'Forshape', 'rfid'),\n               SPOOL(2, 'PLA', '#0056B8', 'Kingroon', 'override'),\n               SPOOL(3, 'PLA', '#1A1A1A', 'Jayo', 'rfid'),\n             ]),\n             UNIT_B([\n               SPOOL_B(0, 'PLA', '#EC008C', 'Jayo', 'rfid'),\n               SPOOL_B(1, 'PLA', '#F44336', 'Jayo', 'rfid'),\n               SPOOL_B(2, 'PLA', '#F2F2F2', 'Generic', 'override'),\n               bayIn(1, 3, {}),\n             ]),\n           ] },\n    heads: [\n      HEAD(0, { type: 'PLA', color: '#FEC600', vendor: 'Jayo', loaded: true }),\n      HEAD(1, { type: 'PLA', color: '#00AE42', vendor: 'Forshape', loaded: true }),\n      HEAD(2, { type: 'PLA', color: '#0056B8', vendor: 'Kingroon', loaded: true }),\n      HEAD(3, { type: 'PLA', color: '#1A1A1A', vendor: 'Jayo', loaded: true }),\n    ],\n  },\n\n  plain: {\n    label: 'An ordinary plate \u2014 no ACE plan',\n    note: 'Four filaments, four heads, nothing in the file about an ACE \u2014 which is every '\n        + 'plate today. The dialog must be the dialog that already shipped.',\n    plan: null, mapping: PLAIN_MAPPING,\n    ace: { present: true, mode: 'head', units: [UNIT(AS_PLANNED())] },\n    heads: FEEDERS.concat([ACE_HEAD]),\n  },\n};\n\n/* ---- the judgement ------------------------------------------------------ */\n\n/**\n * Does this place hold what the plate wants of it?\n *\n * Colour and material, and the brand is ignored on purpose: colour alone would pass PLA\n * where PETG is loaded, and a brand check flags a Kingroon-vs-Generic difference nobody\n * cares about.\n *\n * Four answers, and the third is the one that earns the design its keep:\n *\n *   agrees     it is what the plate wants\n *   differs    it is not, and the machine is sure - a named spool, or an empty bay\n *   unsure     something is there, nothing asserted what - do not accuse it\n *   unchecked  no answer exists: a stock feeder, or a machine with no ACE\n */\nexport function judge(bay, want) {\n  if (!bay) return { verdict: 'unchecked', say: 'Not reported' };\n  if (!bay.occupied) {\n    return { verdict: 'differs', say: 'Empty', fix: `Put the ${want.name} spool in` };\n  }\n  if (!TRUSTED.has(bay.source)) {\n    return { verdict: 'unsure', say: 'Occupied, nothing names it',\n             fix: 'Tag it, or name it in multiACE' };\n  }\n  const sameType = bay.material === want.type;\n  const sameColour = !!bay.color && bay.color.toUpperCase() === want.color.toUpperCase();\n  if (sameType && sameColour) {\n    return { verdict: 'agrees', say: [bay.vendor, bay.material].filter(Boolean).join(' ') };\n  }\n  if (!sameType) {\n    return { verdict: 'differs', say: `${bay.material}, not ${want.type}`,\n             fix: `Put the ${want.name} ${want.type} spool in` };\n  }\n  return { verdict: 'differs', say: `${bay.material}, wrong colour`,\n           fix: `Put the ${want.name} spool in` };\n}\n\n/**\n * Every place the plate needs, in plan order, judged.\n *\n * A stock feeder is NOT judged, and the page has to say so rather than tick it: the ACE\n * reports its own bays and nothing else, so a wrong colour on a feeder head goes\n * undetected. Ticking it would claim a check that was never made.\n */\nexport function reconcile(scn) {\n  const rows = [];\n  if (!scn.plan) return { rows, differs: 0, unsure: 0, checked: false };\n  const units = scn.ace.units || [];\n  /* The head's OWN unit, not the first one. `ACE_SET_HEAD_ACE` binds each head to exactly\n     one unit, so with two plugged in, reading unit[0] for every head judges toolhead 3's\n     bays against toolhead 4's cabinet - which agrees with itself and is wrong. */\n  const unitOf = (i) => units.find((u) => u.index === i) || null;\n  const checked = !!(scn.ace && scn.ace.present) && units.length > 0;\n\n  scn.plan.heads.forEach((h) => {\n    h.run.forEach((step, order) => {\n      const want = FILAMENTS[step.filament];\n      if (h.feeder) {\n        rows.push({ head: h.head, feeder: true, order, want,\n                    verdict: 'unchecked', say: 'Stock feeder \u2014 the ACE does not report it' });\n        return;\n      }\n      /* The STEP's unit, not the head's. In multi a head's places come from different\n         cabinets - one bay from each - so a unit on the head cannot describe it. */\n      const u = unitOf(step.unit != null ? step.unit : h.unit);\n      const bay = u ? u.bays[step.slot] : null;\n      const j = checked && u ? judge(bay, want)\n                             : { verdict: 'unchecked', say: 'No ACE reported' };\n      const ui = step.unit != null ? step.unit : h.unit;\n      rows.push({ head: h.head, feeder: false, unit: ui, slot: step.slot, order,\n                  addr: bayAddr(ui, step.slot), want, bay, ...j });\n    });\n  });\n\n  return { rows, checked,\n           differs: rows.filter((r) => r.verdict === 'differs').length,\n           unsure: rows.filter((r) => r.verdict === 'unsure').length };\n}\n\n/** `aceBayAddr` in shared/js/multiACE.js: unit A-D, slot 1-based. \"A2\". */\nexport function bayAddr(unit, slot) {\n  return `${['A', 'B', 'C', 'D'][unit] || Number(unit) + 1}${(slot | 0) + 1}`;\n}\n\n/* ---- formatting --------------------------------------------------------- */\n\nexport function humanDuration(sec) {\n  const s = Number(sec);\n  if (!Number.isFinite(s) || s <= 0) return 'N/A';\n  const h = Math.floor(s / 3600);\n  const m = Math.round((s % 3600) / 60);\n  return h ? `${h} h ${m} min` : `${m} min`;\n}\nexport const grams = (g) => (Number.isFinite(+g) && +g > 0 ? `${(+g).toFixed(1)} g` : '\u2014');\nexport const megabytes = (b) => `${(Number(b) / 1048576).toFixed(1)} MB`;\n\nexport const PREFERENCES = [\n  { key: 'flow_calibrate', label: 'Extrusion Flow Calibration',\n    hint: 'Runs a short flow test before the print.' },\n  { key: 'time_lapse_camera', label: 'Time-lapse Camera', hint: 'Records a frame per layer.' },\n  { key: 'auto_bed_leveling', label: 'Auto Leveling', hint: 'Probes the bed before starting.' },\n];\n", "plan-choice.entry.js": "\n'use strict';\n\n/* The dialog's own panels. Nothing here re-draws them. */\nimport * as modelInfo from '../js/views/model-info/model-info-view.js';\nimport * as printerView from '../js/views/printer/printer-view.js';\nimport * as grouping from '../js/views/grouping/grouping-view.js';\nimport * as fourCards from '../js/views/filament/filament-view.js';\nimport * as prefsView from '../js/views/preferences/preferences-view.js';\nimport { el } from '../../shared/js/dom.js';\nimport { openPicker, closePicker, isPickerOpen } from '../js/widgets/picker.js';\n\nimport { FILAMENTS, MAPPING, PLAN, SCENARIOS, DEVICE, PREFERENCES, reconcile }\n  from './ace-fixture.js';\n\n/* ====================================================================== *\n * The two states, both composed from the shared fixture.\n * ====================================================================== */\n\n/* The grouping view reads `fil.colors[0]`; the fixture stores a single `color`. */\nconst FILS = FILAMENTS.map((f) => ({\n  index: f.index, key: f.key, type: f.type, name: f.name,\n  colors: [f.color], color: f.color, colorMode: 0,\n  weight: f.weight, used: f.weight, usedMm: f.usedMm,\n}));\n\n/* The four-card view reads a toolhead's `colors`/`colorMode` to fill its disc; the\n   fixture stores one `color` per head, as the machine reports it. */\nconst HEADS = (heads) => heads.map((h) => ({\n  ...h, colors: h.color ? [h.color] : ['#B7BDC6'], colorMode: 0,\n}));\n\n/* Sliced onto the ACE: the fixture's own \"two bays the other way round\". */\nconst AWARE = SCENARIOS.swapped;\n\n/* Sliced with no ACE in the preset, on a printer that has one. The file is the ordinary\n   seven-colour plate - no plan, no bay named anywhere - and the machine reports the same\n   ACE the other state uses. Three filaments have no head to print from. */\nconst UNAWARE = {\n  plan: null,\n  mapping: MAPPING,\n  ace: AWARE.ace,\n  heads: AWARE.heads,\n  assignment: { 0: 0, 1: 1, 2: 2, 3: 3, 4: null, 5: null, 6: null },\n  orphans: [4, 5, 6],\n};\n\n/* ====================================================================== *\n * The answers. Each is a WHOLE PLAN in the fixture's own shape, so the grid\n * below is the real grouping view reading it and the verdicts are the real\n * three-valued reconciliation judging it. Nothing here decides what is wrong;\n * `reconcile()` does, exactly as the page does.\n *\n * The machine (fixture scenario `swapped`) holds A1 magenta, A2 white,\n * A3 red, A4 black. The file was sliced expecting red in A2 and white in A3.\n * ====================================================================== */\nconst FEEDER = (head, filament) => ({ head, feeder: true, run: [{ filament }] });\nconst ACE = (head, run) => ({ head, feeder: false, unit: 0,\n  run: run.map(([filament, slot]) => ({ filament, unit: 0, slot })) });\n\nconst PLANS = {\n  /* As sliced: a hand layout saved with the plate, so not the cheapest one. */\n  sliced: { mode: 'head', swaps: 349, purge_g: 47.0,\n    heads: [FEEDER(0, 1), FEEDER(1, 2), FEEDER(2, 3),\n            ACE(3, [[0, 0], [4, 1], [5, 2], [6, 3]])] },\n  /* Same toolheads, same slots' worth of swapping - only the two addresses change,\n     so red is drawn from A3 and white from A2, which is where they actually are. */\n  addresses: { mode: 'head', swaps: 349, purge_g: 47.0,\n    heads: [FEEDER(0, 1), FEEDER(1, 2), FEEDER(2, 3),\n            ACE(3, [[0, 0], [4, 2], [5, 1], [6, 3]])] },\n  /* Black is the colour this plate prints most, so it goes on a free toolhead and\n     amber - printed twice - goes behind the changer. Cheaper, and two spools move. */\n  replan: { mode: 'head', swaps: 300, purge_g: 40.4,\n    heads: [FEEDER(0, 6), FEEDER(1, 2), FEEDER(2, 3),\n            ACE(3, [[0, 0], [4, 2], [5, 1], [1, 3]])] },\n};\n\nconst ANSWERS = {\n  aware: [\n    { key: 'sliced', label: 'As sliced', cost: 'as in the file', tag: 'no',\n      say: 'The layout saved with the plate. Two bays it names hold the other spool.',\n      swaps: 349, purge: 47.0, move: [], button: 'Send' },\n    { key: 'addresses', label: 'Keep the layout, fix the bay addresses', cost: 'free', tag: 'free',\n      say: 'Every filament stays on its toolhead; only the bay it is drawn from changes.',\n      swaps: 349, purge: 47.0, move: [], button: 'Send' },\n    { key: 'replan', label: 'Re-plan for the fewest swaps', cost: 're-export', tag: 'work',\n      say: 'The most-printed colour moves to a free toolhead, the rare one behind the ACE.',\n      swaps: 300, purge: 40.4,\n      move: ['Take Black out of bay A4 and put it in Toolhead 1',\n             'Put Amber, from Toolhead 1, into bay A4'],\n      button: 'Re-export and send' },\n  ],\n  unaware: [\n    { key: 'asis', label: 'Send as sliced', cost: 'refused', tag: 'no',\n      say: 'The file names T5, T6 and T7; the printer has four heads and nothing maps them.',\n      swaps: null, purge: null, blocked: true, move: [], button: 'Send' },\n    { key: 'reslice', label: 'Take the ACE into the preset and slice again',\n      cost: 're-slice', tag: 'work',\n      say: 'Toolhead 4 becomes ACE-fed with four bays, so seven filaments have seven places.',\n      swaps: 300, purge: 40.4, move: [], button: 'Sync and re-slice' },\n  ],\n};\n\n/* An answer chosen a chip at a time. It appears only once something has been picked. */\nconst HAND = { key: 'hand', label: 'Chosen by hand', cost: 'varies', tag: 'work',\n  say: 'Your own picks, over the layout in the file.', swaps: null, purge: null,\n  move: [], button: 'Send' };\n\nconst WHY = {\n  aware: 'The toolhead IS the tool number, so moving it re-exports the gcode. The bay is '\n       + 'one argument on each <code>ACE_SWAP_HEAD<\/code>, so changing it is a text edit '\n       + 'over the file on disk. Neither re-slices geometry.',\n  unaware: 'No bay is named anywhere in this file, so there is no address to re-map. The '\n         + 'tool numbers are wrong, and those are written at slicing time.',\n};\n\n/* ====================================================================== *\n * Model. The keys are the ones each panel declares in its `reads`.\n * ====================================================================== */\nconst prefs = {};\nPREFERENCES.forEach((p) => { prefs[p.key] = p.key === 'auto_bed_leveling'; });\n\nconst state = {\n  scenario: new URLSearchParams(location.search).get('scenario') === 'unaware'\n            ? 'unaware' : 'aware',\n  choice: 'sliced',\n  hand: {},          // filament -> { slot } or { head }, picked in the chip menu\n  sending: false,\n};\n\nfunction scn() { return state.scenario === 'aware' ? AWARE : UNAWARE; }\nfunction answers() {\n  const base = ANSWERS[state.scenario];\n  return state.scenario === 'aware' && Object.keys(state.hand).length\n    ? base.concat([HAND]) : base;\n}\nfunction chosen() {\n  return answers().find((a) => a.key === state.choice) || answers()[0];\n}\n\n/* A deep-enough copy that editing one answer's plan cannot mutate the table above. */\nconst clonePlan = (p) => ({ ...p, heads: p.heads.map((h) => ({ ...h, run: h.run.map((r) => ({ ...r })) })) });\n\n/**\n * The plan the grid draws: the chosen answer, then whatever has been picked by hand.\n *\n * A hand pick is one of two things and they cost different amounts, which is the whole\n * point: a BAY only rewrites one argument on the swap lines, a TOOLHEAD renumbers the\n * tools and re-exports the file.\n */\nfunction planNow() {\n  if (state.scenario !== 'aware') return null;\n  /* Hand picks belong to the hand answer and to nothing else. Applying them on top of\n     whichever answer is selected made choosing a suggestion show a corrupted version of\n     it - the suggestion is an alternative TO the picks, not a base for them. Keeping them\n     here means flipping between the four is non-destructive. */\n  const plan = clonePlan(PLANS[state.choice === 'hand' ? 'sliced' : state.choice] || PLANS.sliced);\n  if (state.choice !== 'hand') return plan;\n\n  Object.entries(state.hand).forEach(([fil, pick]) => {\n    const f = Number(fil);\n    const here = plan.heads.find((h) => h.run.some((r) => r.filament === f));\n    if (!here) return;\n    const step = here.run.find((r) => r.filament === f);\n    if (pick.slot != null) { step.slot = pick.slot; return; }\n    if (pick.head == null || pick.head === here.head) return;\n    const to = plan.heads.find((h) => h.head === pick.head);\n    if (!to) return;\n    here.run = here.run.filter((r) => r.filament !== f);\n    if (to.feeder) {\n      /* A feeder holds one spool, so the filament already there is displaced onto the\n         head this one came from. Somebody has to carry two spools across the room; the\n         panel's job is to say so rather than to pretend the swap is free. */\n      const displaced = to.run[0];\n      to.run = [{ filament: f }];\n      if (displaced) here.run.push(here.feeder ? { filament: displaced.filament }\n        : { filament: displaced.filament, unit: 0, slot: step.slot != null ? step.slot : 0 });\n    } else {\n      const used = new Set(to.run.map((r) => r.slot));\n      let slot = 0; while (used.has(slot) && slot < 4) slot++;\n      to.run.push({ filament: f, unit: 0, slot });\n    }\n  });\n  return plan;\n}\n\n\n\nfunction model() {\n  const s = scn();\n  return {\n    mapping: s.mapping, file: s.mapping, filaments: FILS,\n    devices: [DEVICE], device: DEVICE, legal: { legal: true },\n    plan: planNow(), ace: s.ace, toolheads: HEADS(s.heads),\n    assignment: s.assignment || {},\n    check: planNow() ? reconcile({ ...s, plan: planNow() })\n                     : { rows: [], differs: 0, unsure: 0, checked: false },\n    prefs,\n  };\n}\n\n/* ====================================================================== *\n * The shell: the real card, in the real order, with the real spacing.\n * shell.js builds `section.card > .card-title + .card-gap + .card-body`.\n * ====================================================================== */\nconst SECTIONS = [\n  { id: 'model-info', title: 'Model Information', view: modelInfo },\n  { id: 'printer', title: 'Select Printer', view: printerView },\n  { id: 'filament', title: 'Filament', view: null },   // grouping or four cards, per state\n  { id: 'preferences', title: 'Print Preferences', view: prefsView },\n];\n\nconst host = document.getElementById('body');\nconst bodies = {};\n\nfunction buildShell() {\n  host.textContent = '';\n  host.appendChild(el('div', 'sp-16'));\n  SECTIONS.forEach((s, i) => {\n    if (i) host.appendChild(el('div', 'sp-8'));\n    const section = el('section', 'card');\n    section.id = `panel-${s.id}`;\n    const title = el('div', 'card-title');\n    title.appendChild(el('span', null, s.title));\n    section.appendChild(title);\n    section.appendChild(el('div', 'card-gap'));\n    const body = el('div', 'card-body');\n    section.appendChild(body);\n    host.appendChild(section);\n    bodies[s.id] = { section, body, title };\n    /* Every panel builds its own fixed structure once, exactly as shell.js has it.\n       The filament slot is mounted separately because which panel it is depends on\n       whether the file carries a plan. */\n    if (s.view) s.view.mount(body);\n  });\n  host.appendChild(el('div', 'sp-20'));\n}\n\n/* The Filament section is remounted when the state changes, because the two states are\n   two different panels - which is exactly what app.js does with the same two. */\nlet filamentKind = null;\nfunction mountFilament() {\n  const kind = planNow() ? 'grouping' : 'four';\n  if (kind === filamentKind) return;\n  filamentKind = kind;\n  const b = bodies.filament.body;\n  b.textContent = '';\n  bodies.filament.title.querySelector('span').textContent =\n    kind === 'grouping' ? 'Filament' : 'Edit Filament';\n  (kind === 'grouping' ? grouping : fourCards).mount(b);\n  /* The answers go ABOVE the evidence. The decision is what the section is for; the head\n     boxes are what justifies it, and a chooser below four boxes and seven chips is 300px\n     under the fold on a 714x750 dialog - measured. */\n  const pc = pcBlock();\n  const grid = b.querySelector('.g-heads');\n  if (grid) b.insertBefore(pc, grid); else b.appendChild(pc);\n}\n\n/* ---- the new block ------------------------------------------------------ */\nfunction pcBlock() {\n  const wrap = el('div', 'pc');\n  wrap.appendChild(el('div', 'pc-h'));\n  wrap.appendChild(el('div', 'pc-opts'));\n  wrap.appendChild(el('div', 'pc-detail'));\n  const why = document.createElement('details');\n  why.className = 'pc-why';\n  why.appendChild(document.createElement('summary'));\n  why.appendChild(el('div', 'pc-whybody'));\n  wrap.appendChild(why);\n  return wrap;\n}\n\nfunction paintPc() {\n  const wrap = bodies.filament.body.querySelector('.pc');\n  const a = chosen();\n\n  wrap.querySelector('.pc-h').textContent = state.scenario === 'aware'\n    ? 'Two bays hold another spool. Three answers:'\n    : 'This plate cannot print as it is. Two answers:';\n\n  const opts = wrap.querySelector('.pc-opts');\n  opts.textContent = '';\n  answers().forEach((ans) => {\n    const b = el('button', 'pc-opt');\n    b.type = 'button';\n    b.dataset.key = ans.key;\n    b.setAttribute('aria-pressed', String(state.choice === ans.key));\n    b.appendChild(el('span', 'pc-dot'));\n    b.appendChild(el('span', 'pc-lab', ans.label));\n    b.appendChild(el('span', `pc-cost ${ans.tag}`, ans.cost));\n    b.appendChild(el('span', 'pc-num',\n      ans.swaps == null ? '\u2014' : `${ans.swaps} swaps \u00b7 ${ans.purge.toFixed(1)} g`));\n    b.addEventListener('click', () => { state.choice = ans.key; paint(); });\n    opts.appendChild(b);\n  });\n\n  /* Only the chosen one explains itself, and only where there is something to do. */\n  const d = wrap.querySelector('.pc-detail');\n  d.textContent = '';\n  d.appendChild(el('span', null, a.say));\n  if (a.move.length) {\n    d.appendChild(el('b', null, ` Move ${a.move.length} spools first:`));\n    const ul = el('ul');\n    a.move.forEach((m) => ul.appendChild(el('li', null, m)));\n    d.appendChild(ul);\n  }\n\n  const why = wrap.querySelector('.pc-why');\n  why.querySelector('summary').textContent = state.scenario === 'aware'\n    ? 'Why one of these costs nothing' : 'Why a re-map cannot help here';\n  why.querySelector('.pc-whybody').innerHTML = WHY[state.scenario];\n}\n\n/* ====================================================================== *\n * The chip menu - the dropdown this dialog does not have yet.\n *\n * WHAT IT HOLDS, and what each row costs. A filament on an ACE-fed head can come from any\n * bay of THAT head's unit (head mode binds one unit per head, so the other cabinets are\n * not reachable from here at any price), or it can be moved to another toolhead. Those\n * two cost different things and EVERY ROW SAYS WHICH, rather than a heading per group:\n *\n *   the bays of this head's unit   one argument on each swap line   free\n *   the other toolheads            the tool numbers themselves      re-export\n *\n * Headings were the first shape and they do not survive the widget: it focuses the first\n * enabled item when it opens, which scrolls a disabled heading out of the menu. The cost\n * is a property of the choice in any case, not of the group it sits in.\n *\n * A row is REFUSED, not merely discouraged, when the place cannot serve the filament:\n * an empty bay has nothing to draw from, and a bay whose material the machine is sure\n * about and which is not this filament's is the same refusal the toolhead menu already\n * makes (`matchOf`: type and nozzle, never colour). Colour is shown on every row and\n * blocks nothing - remapping colour is what this menu is FOR, and the verdict line under\n * the grid already says when one differs.\n * ====================================================================== */\nfunction wireChips(m) {\n  const unit = (m.ace && m.ace.units || [])[0];\n  bodies.filament.body.querySelectorAll('.g-chip').forEach((chip) => {\n    const fil = Number(chip.dataset.fil);\n    const head = m.plan.heads.find((h) => h.run.some((r) => r.filament === fil));\n    if (!head) return;\n    chip.classList.add('pc-pick');\n    chip.setAttribute('role', 'button');\n    chip.tabIndex = 0;\n    chip.onclick = () => openSource(chip, fil, head, m, unit);\n    chip.onkeydown = (e) => {\n      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chip.click(); }\n    };\n  });\n}\n\nfunction openSource(chip, fil, head, m, unit) {\n  if (isPickerOpen(chip)) { closePicker(); return; }\n  const want = m.filaments[fil];\n  const step = head.run.find((r) => r.filament === fil);\n  const items = [];\n\n  if (!head.feeder && unit) {\n    unit.bays.forEach((bay) => {\n      const knownOther = bay.known && bay.material && bay.material !== want.type;\n      const enabled = bay.occupied && !knownOther;\n      items.push({\n        value: `b:${bay.index}`,\n        enabled,\n        title: !bay.occupied ? 'This bay is empty \u2014 nothing to draw from.'\n             : knownOther ? `This bay holds ${bay.material}; the plate wants ${want.type}.` : '',\n        build: (node) => {\n          const d = el('span', 'menu-addr', bay.addr);\n          if (bay.occupied) {\n            d.style.background = bay.color || '#B7BDC6';\n            d.style.color = bay.color ? inkFor(bay.color) : '#1a1a1a';\n          } else d.classList.add('empty');\n          node.appendChild(d);\n          /* Two lines, not two columns. The toolhead menu is 200px wide - the bundle's\n             own measurement - and a material, a vendor and a cost tag side by side\n             truncated all three. The row is 48px tall and was carrying one line of it. */\n          const col = el('span', 'menu-col');\n          col.appendChild(el('b', null, bay.occupied ? (bay.material || 'Unknown') : 'Empty'));\n          col.appendChild(el('span', bay.known ? '' : 'dim',\n            bay.occupied ? (bay.vendor || 'not named') : 'nothing to draw from'));\n          node.appendChild(col);\n          if (step && bay.index === step.slot) node.appendChild(el('span', 'menu-tick'));\n          else if (enabled) node.appendChild(el('span', 'menu-cost free', 'free'));\n          if (!enabled) node.appendChild(el('span', 'menu-warn'));\n        },\n      });\n    });\n  }\n\n  m.plan.heads.forEach((h) => {\n    if (h.head === head.head) return;\n    items.push({\n      value: `h:${h.head}`,\n      enabled: true,\n      build: (node) => {\n        const d = el('span', 'menu-addr', String(h.head + 1));\n        const other = m.filaments[(h.run[0] || {}).filament];\n        d.style.background = other ? other.colors[0] : '#B7BDC6';\n        d.style.color = other ? inkFor(other.colors[0]) : '#1a1a1a';\n        node.appendChild(d);\n        const col = el('span', 'menu-col');\n        col.appendChild(el('b', null, `Toolhead ${h.head + 1}`));\n        /* What that toolhead holds now - a state, not a sentence about consequences.\n           `swaps with Amber` was the first draft and it truncated at the menu's 200px;\n           the name alone says the same thing and the cost tag beside it says the rest. */\n        col.appendChild(el('span', 'dim',\n          h.feeder ? (other ? other.name : 'empty') : `ACE ${unit ? unit.id : ''}`));\n        node.appendChild(col);\n        node.appendChild(el('span', 'menu-cost', 're-export'));\n      },\n    });\n  });\n\n  openPicker({\n    trigger: chip, kind: 'head', within: document.querySelector('.dlg-body'),\n    /* No `value`: the picker scrolls the selected row into view, and with a heading as\n       the first row that scrolled the heading out of the menu. The tick in each row\n       already says which place is in use. */\n    items,\n    onPick: (v) => {\n      const [what, n] = String(v).split(':');\n      if (what === 'b') state.hand[fil] = { slot: Number(n) };\n      else if (what === 'h') state.hand[fil] = { head: Number(n) };\n      state.choice = 'hand';\n      paint();\n    },\n  });\n}\n\n/* Readable ink on a filled disc - `inkOn` in the page's own widgets/format.js. */\nfunction inkFor(hex) {\n  const n = parseInt(String(hex).slice(1), 16);\n  const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;\n  return l > 0.6 ? '#1a1a1a' : '#ffffff';\n}\n\n/* ---- footer ------------------------------------------------------------- */\nfunction paintFoot() {\n  const a = chosen();\n  const send = document.getElementById('send');\n  send.textContent = a.button;\n  /* The gate is the page's own rule: a bay the plan names that holds another spool blocks\n     the send. Reading it off the live reconciliation rather than off the answer means the\n     mockup cannot claim an answer works when the machine says otherwise. */\n  const differs = state.scenario === 'aware' ? model().check.differs : 0;\n  send.disabled = state.sending || a.blocked || differs > 0;\n  send.title = differs > 0 ? `${differs} place(s) hold another spool` : '';\n}\n\ndocument.getElementById('send').addEventListener('click', () => {\n  if (state.sending) return;\n  state.sending = true; paintFoot();\n  const fill = document.getElementById('bar-fill');\n  const pct = document.getElementById('pct');\n  let n = 0;\n  const t = setInterval(() => {\n    n = Math.min(100, n + 8);\n    fill.style.width = n + '%';\n    pct.textContent = n + '%';\n    if (n >= 100) { clearInterval(t); state.sending = false; paintFoot(); }\n  }, 120);\n});\n\n/* ---- paint -------------------------------------------------------------- */\nfunction paint() {\n  document.getElementById('s-aware').setAttribute('aria-pressed', String(state.scenario === 'aware'));\n  document.getElementById('s-unaware').setAttribute('aria-pressed', String(state.scenario === 'unaware'));\n  mountFilament();\n  const m = model();\n  const ctx = { model: m, pending: {}, commands: {}, say: () => {} };\n  modelInfo.update(bodies['model-info'].body, m, ctx);\n  printerView.update(bodies.printer.body, m, ctx);\n  if (m.plan) { grouping.update(bodies.filament.body, m, ctx); wireChips(m); }\n  else fourCards.update(bodies.filament.body, m, ctx);\n  prefsView.update(bodies.preferences.body, m, ctx);\n  paintPc();\n  paintFoot();\n}\n\nfunction pick(s) {\n  state.scenario = s;\n  state.choice = ANSWERS[s][0].key;\n  state.hand = {};\n  state.sending = false;\n  document.getElementById('bar-fill').style.width = '0';\n  document.getElementById('pct').textContent = '0%';\n  const u = new URL(location.href);\n  u.searchParams.set('scenario', s);\n  history.replaceState(null, '', u);\n  paint();\n}\ndocument.getElementById('s-aware').addEventListener('click', () => pick('aware'));\ndocument.getElementById('s-unaware').addEventListener('click', () => pick('unaware'));\n\nbuildShell();\npaint();\n\nwindow.__mockup = {\n  name: 'plan-choice',\n  get state() { return { scenario: state.scenario, choice: state.choice }; },\n  answers: ANSWERS,\n  get model() { return model(); },\n};\n"};window.__ORDER=["dom.js", "render.js", "protocol.js", "format.js", "model-info-view.js", "picker.js", "printer-view.js", "multiACE.js", "grouping-view.js", "art.js", "connection.js", "session.js", "filament-view.js", "preferences-view.js", "ace-fixture.js", "plan-choice.entry.js"];</script><script type="module">
