<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print Preprocessing — plan choice</title>
<!--
  PLAN CHOICE - what the dialog should offer when the plan and the machine disagree.

  BUILT ON THE PAGE, NOT BESIDE IT. This loads the popup's own two stylesheets and mounts
  the popup's own panels - model-info, printer, grouping (or the four cards), preferences -
  from `../js/views/`. Everything you see except the block marked `pc-` IS the shipped
  dialog, running on `ace-fixture.js`, the same fixture the other ACE mockups use. So a
  difference between this and the real popup is a bug in one of them, not a drawing choice
  in here.

  What is new is one block inside the Filament section, because that is where it would
  ship: the answers, with what each costs.

    ?scenario=aware     sliced onto the ACE. The file names a bay per filament and two of
                        them hold the other spool, so Send is refused. Three answers.
    ?scenario=unaware   sliced with no ACE in the preset, on a printer that has one. Seven
                        filaments, four heads, and not one bay address in the whole file.

  WHY THE THIRD ANSWER EXISTS. D/E/F treat the plan as fixed; G offers to change it and
  says the button must read "Re-slice", because when G was drawn the slicer emitted the
  plan and both levers were baked into the gcode. Route C does the rewrite in the host
  AFTER export, which splits them:

      the HEAD is the tool number        -> changing it re-exports the gcode
      the BAY is one argument per swap   -> changing it is a text edit, and free

  So "keep the layout, fix the bay addresses" costs nothing, clears the refusal, and is
  invisible in every earlier design. The reasoning, and the measurement that says
  preferring Orca's own assignment is NOT on its own enough, is
  docs/u1-webui/03-print-processing/10-plan-choice.md.

  Numbers are the branch's own: 349 swaps / 47.0 g for a hand layout against the planner's
  300 / 40.4, measured on the seven-colour cube (docs/ace-mmu/13-roadmap.md).
-->


<style>
/*
 * base.css - tokens and primitives shared by both reconstructed surfaces.
 *
 * Surface-specific rules live in each surface's own stylesheet and are layered
 * on top of this file.
 */
:root {
  --bg:        #f4f6f8;
  --panel:     #ffffff;
  --panel-2:   #eef2f6;
  --ink:       #16202b;
  --ink-2:     #47566a;
  --muted:     #7c8b9d;
  --line:      #d8e0e8;
  --accent:    #0f6e7b;
  --accent-in: #ffffff;
  --ok:        #1f7a4d;
  --warn:      #9a5b12;
  --err:       #a32b2b;
  --radius:    8px;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #0e1319;
    --panel:   #161d26;
    --panel-2: #1d2732;
    --ink:     #e6ecf3;
    --ink-2:   #b3c0cf;
    --muted:   #7f8d9d;
    --line:    #26313d;
    --accent:  #4fbecd;
    --accent-in: #08181c;
    --ok:      #4cc38a;
    --warn:    #d79a4f;
    --err:     #e07070;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
}

/* ---- build badge ------------------------------------------------------
   The reconstruction marker. Deliberately unmissable but out of the way:
   fixed to the bottom-right of whichever surface is running. */
.build-badge {
  position: fixed;
  right: 10px;
  bottom: 10px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
  letter-spacing: .01em;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 6px 18px rgba(0, 0, 0, .10);
  pointer-events: auto;
  user-select: text;
}
.build-badge .bb-surface { color: var(--accent); font-weight: 600; }
.build-badge .bb-sep     { color: var(--muted); }
.build-badge .bb-build   { font-variant-numeric: tabular-nums; }
.build-badge .bb-commit  { color: var(--ink); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/*
 * preprint.css - the print-processing popup.
 *
 * Every number in here is a measurement, not a preference: either a constant resolved
 * out of the shipped bundle or a pixel read off screenshots/preuploadandprint.png. The
 * specification is docs/u1-webui/03-print-processing/original-dialog-mockup.html, which
 * cites the source for each and is held to them by check_mockup.py.
 *
 * Layered on ../shared/css/base.css for the trace pane and the build badge; the dialog
 * itself does NOT use those tokens, because it is reproducing a specific screen rather
 * than joining a design system.
 */

:root {
  --f-bg:      #ffffff;   /* page + card fill                                   */
  --f-border:  #d9d9d9;   /* card border, 2px            A.de(ax.ry, -1, 2)     */
  --f-title:   #4b4b4b;   /* section titles and body text                       */
  --f-hint:    #999999;   /* the picker placeholder (ax.k3 at 204/255)          */
  --f-blue:    #2196f3;   /* Send, state 1               B.eM  0xFF2196F3       */
  --f-amber:   #ff9800;   /* Send, states 2/3/4          B.iZ  0xFFFF9800       */
  --f-green:   #4caf50;   /* Send state 5, checked box   B.fx  0xFF4CAF50       */
  --f-red:     #f44336;   /* Send state 6                B.oL  0xFFF44336       */
  --f-grey:    #9e9e9e;   /* Send states 7/0             B.ci  0xFF9E9E9E       */
  --f-track:   #eeeeee;   /* progress track              B.bQ  0xFFEEEEEE       */
  --f-warn:    #ff3b30;   /* ax.fy, from B.YP = 0x0DFF3B30                       */
  --f-warn-bg: rgba(255, 59, 48, .051);          /* B.YP: alpha 13/255          */
  --f-divider: #e0e0e0;
  --f-sans: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* The dialog is opened at 714 x 750 DIP and does not scroll as a whole; its body does. */
html, body.dlg { height: 100%; }
body.dlg {
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--f-bg);
  color: var(--f-title);
  font-family: var(--f-sans);
  font-size: 14px;
  line-height: 1.4;
}

/* 16px inset each side - the capture puts the card's left border at x=16. */
.dlg-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; position: relative; }

.sp-16 { height: 16px; }   /* B.aE */
.sp-8  { height: 8px;  }   /* B.aB */
.sp-20 { height: 20px; }   /* B.eS */
.sp-13 { height: 13px; }   /* B.ayg */
.sp-10 { height: 10px; }   /* B.c_  */
.gap-20 { flex: none; width: 20px; }   /* B.lr */

/* ---- a section --------------------------------------------------------- */
/*
 * `hidden` is a UA rule at the very bottom of the cascade, and ANY author `display:`
 * beats it. `.card` is `display: flex`, so `section.hidden = true` on a card hid nothing
 * at all - the four filament cards went on being drawn beside the grouping panel that had
 * replaced them. Author-level and `!important`, so it wins wherever it is used.
 *
 * The nozzle banner never hit this because it sets `hidden` on its `.bare` body, which
 * has no `display` of its own. The rule below is what makes that an accident that does
 * not matter rather than the only reason a thing works.
 */
[hidden] { display: none !important; }


.card {
  display: flex;
  align-items: flex-start;          /* B.a6 = CrossAxisAlignment.start */
  border: 2px solid var(--f-border);
  border-radius: 8px;               /* A.aU(8) */
  padding: 12px;                    /* B.ch = EdgeInsets.all(12) */
  background: var(--f-bg);
}
/* A.eQ(B.m4, ...) -> ConstrainedBox(minWidth 120, maxWidth 180) */
.card-title {
  flex: none;
  min-width: 120px;
  max-width: 180px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 600;                 /* B.ba = w600 */
  color: var(--f-title);
}
.card-gap { flex: none; width: 12px; }   /* B.bA */
.card-body { flex: 1; min-width: 0; }

/* the refresh control, 20px, inside the title column */
.card-refresh {
  flex: none;
  width: 20px; height: 20px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--f-title);
  cursor: pointer;
  background-repeat: no-repeat;
  background-position: center;
  background-size: 20px 20px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234b4b4b'%3E%3Cpath d='M17.65 6.35A8 8 0 1019.73 14h-2.08A6 6 0 1112 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z'/%3E%3C/svg%3E");
}
.card-refresh:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 2px; }

/* ---- Model Information ------------------------------------------------- */
.mi { display: flex; align-items: flex-start; }
.mi-thumb {
  flex: none;
  width: 100px; height: 100px;
  border-radius: 16px;              /* A.aU(16) */
  object-fit: cover;
  display: block;
  background: var(--f-track);
}
/* No thumbnail is a state, not a broken image. */
.mi-thumb.empty {
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23c9c9c9'%3E%3Crect x='22' y='62' width='56' height='6'/%3E%3Ccircle cx='38' cy='44' r='12'/%3E%3Cpath d='M50 56l14-18 12 18z'/%3E%3C/g%3E%3C/svg%3E");
  background-size: 100px 100px;
}
.mi-facts { flex: 1; min-width: 0; }
.mi-fact {
  font-size: 14px;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- Select Printer ---------------------------------------------------- */
.sp { display: flex; align-items: center; }
.sp-cover {
  flex: none;
  width: 100px; height: 100px;
  border-radius: 16px;
  background: var(--f-track) center / 100px 100px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23c9c9c9' stroke-width='3'%3E%3Cpath d='M50 28l22 12v24L50 76 28 64V40z'/%3E%3Cpath d='M28 40l22 12 22-12M50 52v24'/%3E%3C/g%3E%3C/svg%3E");
}
/* A.a2l(50, 300, B.c8, ...) - height 50, width 300, padding LTRB(16,0,16,0) */
.picker {
  width: 300px;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 16px;
  border: 1px solid #777;
  border-radius: 0;
  background: var(--f-bg);
  font: inherit;
  color: var(--f-title);
  text-align: left;
  cursor: pointer;
}
.picker:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 2px; }
.picker-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.picker .dev-text { gap: 0; }
.picker-hint { font-size: 12px; color: var(--f-hint); }
.picker-caret {
  flex: none; width: 24px; height: 24px;
  background: center / 24px 24px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23757575'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
}
.legal-line { margin: 9px 0 0; font-size: 12px; color: var(--f-warn); }

/* ---- Edit Filament ----------------------------------------------------- */
/* Wrap(spacing 12, runSpacing 12) - A.mO via aiy.y */
.fil-grid { display: flex; flex-wrap: wrap; gap: 12px; }
/* B.aya: an invisible 80x100 holds the row open when there is nothing to draw. */
.fil-grid[data-empty="1"]::before { content: ""; display: block; width: 80px; height: 100px; }

/* A.A0: BoxConstraints(80, 80, 100, 100), radius 8, 1px border */
.fil-card {
  flex: none;
  width: 80px; height: 100px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--f-border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--f-bg);
}
/* An unassigned filament wears the warning colour - it is the only thing on this
   surface that says a decision is outstanding. */
.fil-card.unset { border-color: var(--f-warn); }

.fil-block {
  flex: 3 1 0;                       /* A.bH(stack, 3) */
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3px 2px;                  /* B.RL */
  overflow: hidden;
}
.fil-type {
  position: relative;
  font-size: 12px;
  font-weight: 500;                  /* B.H */
  line-height: 1.15;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fil-used {
  position: relative;
  font-size: 12px;
  font-weight: 400;                  /* B.w */
  line-height: 1.15;
  margin-top: 1px;                   /* B.ayj */
}
.fil-rule { flex: none; height: 1px; background: var(--f-divider); }  /* A.aHd(_,1,_) */
.fil-pick {
  flex: 4 1 0;                       /* A.bH(picker, 4) */
  min-height: 0;
  display: flex;
  align-items: center;
  gap: 6px;                          /* B.fJ */
  padding: 0 2px 0 6px;
  border: 0;
  background: none;
  font: inherit;
  cursor: pointer;
}
.fil-pick:focus-visible { outline: 2px solid var(--f-blue); outline-offset: -2px; }
.fil-caret {
  flex: none; width: 16px; height: 16px; margin-left: auto;
  background: center / 16px 16px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23757575'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
}

/* ---- the colour art ---------------------------------------------------- */
/* Bands are flex children, one per colour, exactly as A.abX.VO builds them. */
.sw-banded { display: flex; flex-direction: row; }
.fil-block.sw-banded { align-items: stretch; }
.sw-band { flex: 1; }
.fil-block.sw-banded .fil-type,
.fil-block.sw-banded .fil-used { position: absolute; }
.fil-block.sw-banded .fil-type { top: 3px; }
.fil-block.sw-banded .fil-used { bottom: 3px; }
/* Alpha zero is an absence, not black. A.abX draws a hatch for it. */
.sw-hatch {
  background:
    repeating-linear-gradient(45deg, #8d8d8d 0 3px, #acacac 3px 6px);
}

/* A.a6K - the 28px target disc */
.disc {
  flex: none;
  position: relative;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--f-border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.disc.unset { border-color: var(--f-warn); }
.disc-n {
  position: relative;
  font-size: 12px;
  font-weight: 800;                  /* B.nn */
  line-height: 1;
}
.disc.unset .disc-n { color: var(--f-warn); }
/* In the menu the number is 14px w600, not 12px w800 - A.aJQ vs A.A0. */
.disc-menu .disc-n { font-size: 14px; font-weight: 600; }

/* ---- Print Preferences ------------------------------------------------- */
/* Wrap(runSpacing 12, spacing 170) of ConstrainedBox(152..220 x 20) */
.prefs { display: flex; flex-wrap: wrap; row-gap: 12px; column-gap: 170px; }
.pref {
  flex: none;
  width: 220px;
  height: 20px;
  display: flex;
  align-items: center;
  gap: 4px;                          /* B.a4Y */
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--f-title);
  text-align: left;
  cursor: pointer;
}
.pref:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 3px; }
.pref-label {
  flex: 1; min-width: 0;
  font-size: 14px;
  font-weight: 500;                  /* B.H */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pref-help {
  flex: none; width: 20px; height: 20px;
  cursor: pointer;
  background: center / 20px 20px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239e9e9e'%3E%3Cpath d='M12 2a10 10 0 100 20 10 10 0 000-20zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26A1.96 1.96 0 0014 9a2 2 0 10-4 0H8a4 4 0 118 0c0 .88-.36 1.68-.93 2.25z'/%3E%3C/svg%3E");
}
.pref-help:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 2px; }
/* An 18px ROUND CHECKBOX, radius 9, 2px border - not a switch. */
.pref-box {
  flex: none;
  width: 18px; height: 18px;
  border: 2px solid var(--f-border);
  border-radius: 9px;
  background: var(--f-bg);
}
.pref[aria-checked="true"] .pref-box {
  background: var(--f-green) center / 14px 14px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/%3E%3C/svg%3E");
  border-color: var(--f-green);
}

/* ---- the nozzle banner (A.R5) ------------------------------------------ */
.nozzle-warn {
  display: flex;
  align-items: flex-start;
  gap: 4px;                          /* B.aI */
  width: 100%;
  padding: 18px 12px;                /* B.zp */
  border-radius: 4px;                /* A.aU(4) */
  background: var(--f-warn-bg);
}
.nozzle-icon {
  flex: none; width: 14px; height: 14px; margin-top: 1px;
  background: center / 14px 14px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3b30'%3E%3Cpath d='M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z'/%3E%3C/svg%3E");
}
.nozzle-text { flex: 1; font-size: 12px; font-weight: 400; line-height: 1.35; color: var(--f-warn); }

/* ---- the dropdowns ----------------------------------------------------- */
.menu {
  position: absolute;
  z-index: 40;
  background: var(--f-bg);
  overflow-y: auto;
  overflow-x: hidden;
}
/* B.aqV(50, B.c8) + bEo(..., 0, null, B.o, B.a4, null, 300) */
.menu-printer { width: 300px; border: 1px solid rgba(0, 0, 0, .118); }
.menu-printer .menu-item { height: 50px; padding: 0 16px; gap: 12px; }
/* B.aqU(48, B.c8) + bEo(..., 8, 300, B.asz, null, HI, 200) */
.menu-head {
  width: 200px;
  max-height: 300px;
  border-radius: 8px;
  box-shadow: 0 5px 5px -3px rgba(0, 0, 0, .2), 0 8px 10px 1px rgba(0, 0, 0, .14),
              0 3px 14px 2px rgba(0, 0, 0, .12);     /* Material elevation 8 */
  scrollbar-width: thin;
}
.menu-head::-webkit-scrollbar { width: 6px; }        /* A.HI: thickness 6 */
.menu-head::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .32); border-radius: 40px; }
.menu-head .menu-item { height: 48px; padding: 0 16px; gap: 8px; }

.menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  border: 0;
  background: none;
  font: inherit;
  color: var(--f-title);
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: rgba(0, 0, 0, .04); }
.menu-item:focus-visible { outline: 2px solid var(--f-blue); outline-offset: -2px; }
/* Not merely discouraged: openMenu refuses to pick it. */
.menu-item[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

.menu-cover { flex: none; width: 24px; height: 24px; border-radius: 4px; background: var(--f-track); }
.menu-name { font-size: 14px; }
.menu-lan { font-size: 12px; color: var(--f-title); }

/* A device over two lines: the name, then how to tell it from the others.
   The shipped dialog draws one line - see deviceMeta() in printer-view.js for why this
   one does not. The 50px row (B.aqV) has the room; nothing else moves. */
.dev-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.dev-name {
  font-size: 14px; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dev-meta {
  font-size: 11px; line-height: 1.25; color: var(--f-hint);
  font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.menu-grow { flex: 1; }
.menu-type {
  flex: 1; min-width: 0;
  font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.menu-type.bad { color: var(--f-warn); }
.menu-tick {
  flex: none; width: 20px; height: 20px;
  background: center / 20px 20px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234caf50'%3E%3Cpath d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/%3E%3C/svg%3E");
}
.menu-warn {
  flex: none; width: 16px; height: 16px;
  background: center / 16px 16px no-repeat
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3b30'%3E%3Cpath d='M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z'/%3E%3C/svg%3E");
}

/* ---- the send bar ------------------------------------------------------ */
.dlg-foot {
  flex: none;
  display: flex;
  align-items: center;
  padding: 16px;                     /* B.bV */
}
.bar { flex: 1; min-width: 0; }
.bar-track { height: 8px; border-radius: 4px; background: var(--f-track); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--f-blue); transition: width .15s linear; }
.pct { flex: none; margin-left: 5px; font-size: 14px; font-variant-numeric: tabular-nums; }  /* B.RH */

.send {
  flex: none;
  width: 120px; height: 40px;        /* A.al(120, 40, ...) */
  margin: 0 10px 0 30px;             /* B.ay6 before, B.RG after */
  border: 0;
  border-radius: 4px;
  background: var(--f-grey);
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
/* A.Jb.aKO() - five colours over eight states. */
.send[data-state="ready"]      { background: var(--f-blue); }
.send[data-state="packaging"],
.send[data-state="uploading"],
.send[data-state="starting"]   { background: var(--f-amber); }
.send[data-state="done"]       { background: var(--f-green); }
.send[data-state="failed"]     { background: var(--f-red); }
.send:disabled { cursor: not-allowed; }
.send:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .send[data-busy="1"] { animation: none; }
  .bar-fill { transition: none; }
}

/* ---- the help dialog --------------------------------------------------- */
.explain {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  background: rgba(0, 0, 0, .32);
}
.explain-box {
  width: 320px;
  padding: 20px 24px 12px;
  border-radius: 4px;
  background: var(--f-bg);
  box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14);
}
.explain-box h2 { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
.explain-box p { margin: 0 0 8px; font-size: 14px; line-height: 1.45; }
.explain-ok {
  display: block; margin-left: auto;
  padding: 8px 12px;
  border: 0; background: none;
  color: var(--f-blue);
  font: inherit; font-weight: 500; text-transform: uppercase;
  cursor: pointer;
}

/* ---- status, trace and the build badge ---------------------------------
 *
 * None of these is part of the dialog: they are the reconstruction's own, and on a
 * 714 x 750 modal there is very little room for them. They stack above the send bar
 * rather than over it - the badge's shared position is bottom-right, which on this
 * surface is exactly where the Send button is, and a marker that hides the control
 * being pressed is worse than no marker. drive/print-dialog.js asserts that none of
 * them overlaps it.
 */
.build-badge { bottom: 88px !important; }

.status {
  position: fixed;
  left: 16px; bottom: 62px;
  z-index: 50;
  max-width: 460px;
  padding: 4px 9px;
  border-radius: 4px;
  background: rgba(20, 28, 38, .88);
  color: #fff;
  font-family: var(--mono);
  font-size: 11px;
}
.status[data-kind="err"]  { background: rgba(163, 43, 43, .92); }
.status[data-kind="warn"] { background: rgba(154, 91, 18, .92); }
.status[data-kind="ok"]   { background: rgba(31, 122, 77, .92); }

.trace-wrap { position: fixed; right: 10px; bottom: 62px; z-index: 50; font-size: 11px; }
.trace-wrap summary { cursor: pointer; color: var(--f-hint); font-family: var(--mono); }
.trace-wrap #trace {
  max-height: 180px; width: 320px; overflow: auto;
  background: rgba(20, 28, 38, .92); color: #cfe;
  font-family: var(--mono); padding: 6px; border-radius: 4px;
}
.trace-wrap .t { white-space: pre; }

/* ---- Model Information: the plate's filaments -------------------------
   Every filament the plate uses, numbered as the Prepare sidebar numbers them. Four on an
   ordinary plate; seven on one sliced onto an ACE, which is the case three text facts
   cannot describe. */
.mi-strip { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.mi-fil {
  flex: none; display: grid; place-items: center;
  width: 22px; height: 22px; border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, .22);
  font: 600 11px/1 var(--mono);
}

/* ---- the grouping panel -----------------------------------------------
   What the slicer grouped onto each toolhead, drawn in the language this machine already
   has: the Device page's Filament panel and the Prepare tab's Printer section. The whole
   panel is absent on a plate with no ace_plan, which is every plate today. */

.g-mode { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; min-width: 0; }

}
.g-pill.dim { color: var(--ink-dim); }
.g-say { font-size: 11px; color: var(--ink-dim); min-width: 0;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The units, where no head is wired to one: above the grid in multi, below in normal.

.g-band {

.band-below .g-band { margin: 8px 0 0; order: 2; }
.band-below { display: flex; flex-direction: column; }
.g-unit { display: inline-flex; align-items: center; gap: 6px; min-width: 0;
          font-size: 11.5px; color: var(--ink-2); }
.g-unit b { color: var(--ink); font-weight: 600; }
.g-dim { color: var(--ink-dim); font-size: 10.5px; }
.g-hum { font: 10.5px/1 var(--mono); color: var(--ink-2); }

/* One box per toolhead, two across - the Prepare tab's own grid. */
.g-heads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g-head {
  border: 1px solid var(--line); border-radius: var(--radius);

}

.g-hrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
.g-hrow h4 { margin: 0; font: 500 11.5px/1 var(--sans); color: var(--ink-2);
             white-space: nowrap; }
.g-spacer { flex: 1; }

/* What feeds this head. One badge, on the head, because ACE_SET_HEAD_ACE binds a head to
   exactly one unit - drawn per chip it was the same cabinet three times on one toolhead. */
.g-src { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.g-srcname { font: 11px/1 var(--sans); color: var(--ink); white-space: nowrap; }
.g-srcname.dim { color: var(--ink-dim); }
.g-srcname.mono { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
.g-feedmark { display: block; flex: none; }
.g-src .ace-badge { display: block; flex: none; }

/* One filament: the material on a bar in its own colour, and where it comes from. */
.g-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.g-chip {
  flex: none; width: 62px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); overflow: hidden;
}
.g-chip.is-bad { border-color: var(--err); }
.g-chip.is-warn { border-color: var(--warn); }
.g-type {
  display: block; height: 19px; line-height: 19px;
  font: 600 10.5px/19px var(--sans); text-align: center;
  border-bottom: 1px solid var(--line);
}
.g-from {
  display: block; height: 22px; line-height: 22px;
  font: 10.5px/22px var(--mono); color: var(--ink-2); text-align: center;
}
.g-chip.is-bad .g-from { color: var(--err); }
.g-chip.is-warn .g-from { color: var(--warn); }

.g-verdict { margin-top: 5px; font-size: 11px; line-height: 1.4; min-height: 15px; }
.g-verdict.ok { color: var(--ok); }
.g-verdict.warn { color: var(--warn); }
.g-verdict.bad { color: var(--err); }
.g-verdict.dim { color: var(--ink-dim); }

/* The limit, stated once, and the cost, before Send rather than after. */
.g-note { margin-top: 7px; font-size: 11px; line-height: 1.45; color: var(--ink-dim); }
.g-note.warn { color: var(--warn); }
.g-cost { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px;
          margin-top: 6px; font-size: 11.5px; color: var(--ink-dim); }
.g-cost b { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.g-saved { margin-left: 4px; }

/* ---- Edit Filament: the machine, when it has an ACE --------------------
   The four cards are the mapping control for a plate that addresses no bays, and they
   stay. What they could not do is describe an ACE-fed head - `head 4: PLA` for a head
   whose filament is whichever of the unit's spools was last loaded. This line and the

.fil-machine {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px;

  border-bottom: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-dim);
}

  border: 1px solid var(--line); background: var(--pill);
  color: var(--ink-2); white-space: nowrap;

.fil-unit { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }

bridge commands (docs: 02-bridge-sswcp/02-command-reference.md)\n * ------------------------------------------------------------------ */\nexport const CMD = {\n  // connection / identity\n  GET_CONNECTED_MACHINE: 'sw_GetConnectedMachine',   // ONLY returns a device whose\n                                                    // connected flag is true; empty\n                                                    // otherwise. Use the list below\n                                                    // to show saved-but-idle machines.\n  GET_LOCAL_DEVICES: 'sw_GetLocalDevices',           // -> bare ARRAY of DeviceInfo\n  SUBSCRIBE_LOCAL_DEVICES: 'sw_SubscribeLocalDevices',  // pushes the same bare array\n\n  // ---- bringing a session up ---------------------------------------------\n  // The page drives the transport; Orca only owns the socket. See\n  // docs/u1-webui/02-device-page/06-connection.md\n  FILE_LOG: 'sw_FileLog',            // { level, content } -> Orca's own log file\n  GET_USER_LOGIN_STATE: 'sw_GetUserLoginState',  // -> { status, userid, nickname, ... }\n  // Opens ORCA's own login dialog on Snapmaker's real login page (id.snapmaker.com).\n  // The page never sees a credential; it asks for the dialog and re-reads the state.\n  USER_LOGIN: 'sw_UserLogin',                   // { show }\n  GET_PINCODE: 'sw_GetPincode',                 // { ip, userid, nickname, port=1884 }\n  CREATE_MQTT_CLIENT: 'sw_create_mqtt_client',  // { server_address, clientId, ca?, cert?,\n                                                //   key?, username?, password?,\n                                                //   clean_session? } -> { type, id }\n  MQTT_CONNECT: 'sw_mqtt_connect',              // { id }\n  MQTT_DISCONNECT: 'sw_mqtt_disconnect',        // { id }\n  MQTT_SUBSCRIBE: 'sw_mqtt_subscribe',          // { id, topic, qos } + event_id;\n                                                //   pushes { topic, data } where\n                                                // --------------\n  GET_ACTIVE_FILE: 'sw_GetActiveFile',\n  GET_PRINT_LEGAL: 'sw_GetPrintLegal',             // { connected_model } -> { legal, preset_model }\n  // The RIGHT door for the file: { is_zip } -> { file_name, file_url, origin_size,\n  // checksum }. `file_url` is a localhost URL on Orca's own page HTTP server - the one\n  // already serving this document - so the page fetches the zip rather than being\n  // handed it. NOT printer-backed: both branches build m_res_data and send_to_js().\n  GET_FILE_STREAM: 'sw_GetFileStream',\n  // The other one, kept named because it is what the reconstruction used to call:\n  // `content` comes from a std::vector<char>, which serialises as one JSON integer per\n  // byte. A 12 MB zip crosses as ~40 MB of JSON.\n  GET_PRINT_ZIP: 'sw_GetPrintZip',                 // -> { name, content: number[] }\n  GET_FILE_FILAMENT_MAPPING: 'sw_GetFileFilamentMapping',   // { filename }\n  UPDATE_MACHINE_FILAMENT_INFO: 'sw_UpdateMachineFilamentInfo',\n  SET_FILAMENT_MAPPING_COMPLETE: 'sw_SetFilamentMappingComplete', // { status }\n  FINISH_FILAMENT_MAPPING: 'sw_FinishFilamentMapping',\n  FINISH_PREPRINT: 'sw_FinishPreprint',            // { status }\n  START_LOCAL_PRINT: 'sw_StartLocalPrint',\n  START_CLOUD_PRINT: 'sw_StartCloudPrint',\n};\n\n/**\n * The two outcome strings sw_SetFilamentMappingComplete accepts.\n *\n * Anything else is treated by the host as an error and raises a native\n * \"setting failed\" MessageDialog instead of closing the popup.\n * See docs/u1-webui/03-print-processing/02-lifecycle.md\n */\nexport const MAPPING_STATUS = { SUCCESS: 'success', CANCELED: 'canceled' };\n\n/* ------------------------------------------------------------------ *\n * Machine state model (docs: 03-printer-protocol/03-state-model.md)\n * Recovered verbatim from the bundle's subscription list + field filter.\n * `null` means \"every field of this object\".\n * ------------------------------------------------------------------ */\nexport con 'filament_feed right':    null,\n  'machine_state_manager':  ['main_state', 'action_code'],\n  'filament_detect':        null,\n  'defect_detection':       null,\n};\n\n/*\n * DeviceInfo, as Orca stores it in app_config and hands back over the bridge.\n * Field names are snake_case and come straight from the C++ struct\n * (src/libslic3r/AppConfig.hpp) - NOT the camelCase a JS client might assume.\n */\nexport const DEVICE = {\n  NAME: 'dev_name',\n  MODEL: 'model_name',\n  SN: 'sn',\n  IP: 'ip',\n  CONNECTED: 'connected',\n  ID: 'dev_id',\n  PRESET: 'preset_name',\n  NOZZLES: 'nozzle_sizes',\n  // TLS material, empty until the machine has been paired\n  CA: 'ca',\n  CERT: 'cert',\n  KEY: 'key',\n  CLIENT_ID: 'clientId',\n  USER: 'user',\n  PASSWORD: 'password',\n  PORT: 'port',\n  LINK_MODE: 'link_mode',\n};\n\n/** The port the printer listens on for plain-MQTT pairing. */\nexport const PAIR_PORT = 1884;\n\n/**\n * The LAN authorisation code.\n *\n * NOT a user-entered PIN for an already-bound printer: it is a fixed literal in\n * the shipped bundle (18 occurrences, alongside port 1884), and it is the value\n * the real Device page uses. A captured connect from Orca subscribes\n * `12345678/config/response` and `12345678/config/notification`, which are\n * exactly the topics Moonraker_Mqtt::ask_for_tls_info() derives from\n * `<auth_code>/config/...`.\n *\n * Using it is what lets a bound machine reconnect with no human in the loop.\n * A PIN is only needed when the printer does not already trust our client id.\n */\nexport const LAN_AUTH_CODE = '12345678';\n\n/** The shipped page sends this on every create; keep parity. */\nexport const MQTT_KEEPALIVE = 30;\n\n/**\n * The camera does not stream, and it does not push frames.\n *\n * Measured against a U1 (2026-08-24), not inferred: `camera.start_monitor` answers\n * `{ state: 'success', url: '/files/camera/monitor.jpg' }` and then nothing else\n * arrives over MQTT. The printer rewrites that one file at `interval` er  /webcam2/snapshot.jpg  1280x720    87 KB   44 ms\n *     gui       iframe                 /screen/snapshot        480x320   710 B  <- the\n *                                        printer's own touchscreen, not a camera\n *     multiACE  iframe                 (no snapshot_url)      <- a web panel entirely\n *\n * So the list is Moonraker's and anything may register in it. An entry is a camera when\n * it has a snapshot_url; `gui` is offered last and labelled, and multiACE never appears.\n *\n * Chained in WebKitGTK - the engine Orca renders with - the case camera reached\n * **14.0 fps**, which is 28x the monitor file. The webcam entries report\n * `target_fps: 15`, so that IS the printer's cap and asking for 30 buys nothing.\n * ------------------------------------------------------------------ */\n\n/** Moonraker's own camera list. It sends CORS headers; nginx on :80 does not. */\nexport const MOONRAKER_WEBCAMS = '/server/webcams/list';\n\n/**\n * How a frame gets here. Ordered best-first: `pickTransport` walks this and takes the\n * first the engine can actually do.\n *\n * The two streaming transports are **dead in WebKitGTK** and it is not close - measured\n * in the engine rather than assumed:\n *\n *   canPlayType('video/mp4; codecs=\"avc1.42E01E\")   ->  \"\"        (empty = no)\n *   MediaSource.isTypeSupported(same)               ->  false     (VP8 is true, so MSE\n *                                                                  is fine; the codec\n *                                                                  is what is missing)\n *   typeof RTCPeerConnection                        ->  \"undefined\"\n *\n * Windows (WebView2) and macOS (WKWebView) ship both, so this is a per-platform question\n * and never a global answer. It is why AUTO probes rather than picking.\n */\nexport const CAMERA_TRANSPORT = {\n  AUTO:     'auto',\n  WEBRTC:   'webrtc',      // POST /webcam/webrtc  -> RTCPeerConnection\n  H264:     'h264',        // GET  /webcam/stream.h264 -> MSE\n  SNAPSHOT: 'snapshot',    // GET  /webcam/snapshot.jpg, re-pointed on load\n  MONITOR:  'monitor',     // camera.start_monitor -> timelapse/monitor.jpg\n};\n\n/** Best first. AUTO is not in it: AUTO is the act of walking it. */\nexport const CAMERA_TRANSPORT_ORDER = [\n  CAMERA_TRANSPORT.WEBRTC, CAMERA_TRANSPORT.H264,\n  CAMERA_TRANSPORT.SNAPSHOT, CAMERA_TRANSPORT.MONITOR,\n];\n\n/**\n * What each one is called and why it might not be offered.\n *\n * The name IS the transport, deliberately. Naming these Smooth/Sharp/Saver reads better\n * until one is greyed out, at which point \"not on Linux\" is a worse explanation than\n * \"this engine has no H.264 decoder\" for someone who has to act on it.\n */\nexport const CAMERA_TRANSPORT_TEXT = {\n  [CAMERA_TRANSPORT.AUTO]:     { name: 'Auto',            hint: 'the best this computer can decode' },\n  [CAMERA_TRANSPORT.WEBRTC]:   { name: 'WebRTC',          hint: '/webcam/webrtc \\u00b7 30 fps',\n                                 absent: 'this engine has no WebRTC' },\n  [CAMERA_TRANSPORT.H264]:     { name: 'H.264 stream',    hint: '/webcam/stream.h264 \\u00b7 30 fps',\n                                 absent: 'this engine has no H.264 decoder' },\n  [CAMERA_TRANSPORT.SNAPSHOT]: { name: 'Direct snapshot', hint: '/webcam/snapshot.jpg \\u00b7 up to 15 fps',\n                                 absent: 'this printer has no camera service' },\n  [CAMERA_TRANSPORT.MONITOR]:  { name: 'Monitor file',    hint: 'camera.start_monitor \\u00b7 0.5 fps' },\n};\n\n/** How many pictures at once. */\nexport const CAMERA_VIEW = { SINGLE: 'single', SPLIT: 'split', GRID: 'grid', PIP: 'pip' };\n\n/** How many tiles each view draws. */\nexport const CAMERA_VIEW_TILES = {\n  [CAMERA_VIEW.SINGLE]: 1, [CAMERA_VIEW.SPLIT]: 2,\n  [CAMERA_VIEW.GRID]: 4,   [CAMERA_VIEW.PIP]: 2,\n};\n\n/**\n * Frames per second the page asks for.\n *\n * The scale stops at 15 because the printer does: every webcam entry reports\n * `target_fps: 15`, and the 14.0 measured in the engine is that cap rather than a client\n * limit. Offering 30 would offer nothing.\n */\nexport const CAMERA_FPS_CHOICES = [1, 5, 10, 15];\nexport const CAMERA_FPS_DEFAULT = 15;\n\n/**\n * What an unfocused tile drops to.\n *\n * A grid is one poll per tile - there is no multiplexed stream to share - so three tiles\n * at 15 fps is 4.7 MB/s, dominated entirely by the case camera's 226 KB frame (the USB\n * camera is 87 KB and the touchscreen is 710 bytes). Polling only the focused tile fast\n * brings that to 3.5 MB/s, and it is one number rather than a policy.\n */\nexport const CAMERA_FPS_UNFOCUSED = 1;\n\n/** Moonraker registers non-cameras in the same list. A camera has a still to fetch. */\nexport function isCamera(w) {\n  return !!(w && w.enabled !== false && w.snapshot_url);\n}\n\n/**\n * The touchscreen is in the webcam list and is not a camera.\n *\n * It is genuinely useful as a tile - it shows what the printer thinks it is doing - so\n * it is offered, last, under its own name rather than sitting in the camera list\n * unexplained.\n */\nexport const CAMERA_SCREEN_NAME = 'gui';\nexport const CAMERA_LABELS = { case: 'Case', usb: 'USB', gui: 'Screen' };\nexport function cameraLabel(w) {\n  const n = String((w && w.name) || '');\n  return CAMERA_LABELS[n] || (n ? n.charAt(0).toUpperCase() + n.slice(1) : 'Camera');\n}\n\n/**\n * A camera's still, absolute.\n *\n * `snapshot_url` is relative to the printer's web UI on **:80**, which is where it\n * genuinely lives - unlike the monitor file, whose reply names a :80 path that answers\n * with the SPA shell. nginx there sends no `Access-Control-Allow-Origin` at all, so an\n * `<img>` loads it (images are not CORS-restricted unless their pixels are read) and a\n * `fetch()` of the identical URL fails \"Load failed\". Both measured. Display with\n * `<img>`; never fetch a frame.\n */\nexport function snapshotUrl(device, w) {\n  const ip = device && device[DEVICE.IP];\n  const rel = w && w.snapshot_url;\n  if (!rel) return null;\n  // Absolute already, which is also how the simulator hands back a frame: a data: URI,\n  // the same shape the monitor reply uses.\n  if (/^(data:|blob:|https?:)/i.test(rel)) return rel;\n  if (!ip) return null;\n  return `http://${ip}${rel.startsWith('/') ? '' : '/'}${rel}`;\n}\n\n/** Where the camera list is asked for. Moonraker, because :80 refuses cross-origin. */\nexport function webcamListUrl(device) {\n  const ip = device && device[DEVICE.IP];\n  return ip ? `http://${ip}:${MOONRAKER_HTTP_PORT}${MOONRAKER_WEBCAMS}` : null;\n}\n\n/**\n * What this engine can decode. Three one-line tests, run once.\n *\n * Deliberately not cached across reloads: it is a property of the running webview, and\n * Orca's is WebKitGTK on Linux, WebView2 on Windows and WKWebView on macOS. A value\n * remembered from one is wrong on the next.\n */\nexport function engineCaps() {\n  const mp4 = 'video/mp4; codecs=\"avc1.42E01E\"';\n  let h264 = false;\n  try {\n    h264 = (typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported(mp4))\n        || document.createElement('video').canPlayType(mp4) !== '';\n  } catch { h264 = false; }\n  return { h264, webrtc: typeof RTCPeerConnection !== 'undefined' };\n}\n\n/**\n * The best transport that both ends can do.\n *\n * `direct` says the printer answered the webcam list with at least one camera, which is\n * how the extended firmware is DETECTED rather than configured. Without it the only\n * thing on offer is the monitor file, which is what every stock U1 has and what this\n * page did before.\n */\nexport function pickTransport(caps, direct) {\n  return CAMERA_TRANSPORT_ORDER.find((t) => transportUsable(t, caps, direct))\n      || CAMERA_TRANSPORT.MONITOR;\n}\n\nexport function transportUsable(t, caps, direct) {\n  if (t === CAMERA_TRANSPORT.MONITOR) return true;\n  if (!direct) return false;\n  if (t === CAMERA_TRANSPORT.WEBRTC) return !!(caps && caps.webrtc);\n  if (t === CAMERA_TRANSPORT.H264) return !!(caps && caps.h264);\n  return true;                                   // SNAPSHOT, once there is a camera\n}\n\n/** True when a saved device already carries the mTLS material to connect directly. */\nexport function hasTlsMaterial(d) {\n  return !!(d && d[DEVICE.CA] && d[DEVICE.CERT] && d[DEVICE.KEY]);\n}\n\n/**\n * Normalise a device-list response.\n *\n * `sw_GetLocalDevices` replies with a bare array (`m_res_data = devices`), and so\n * does the `sw_SubscribeLocalDevices` push. Accept the `{devices: [...]}` wrapper\n * too, so a hand-written mock that guessed wrong still works.\n */\nexport function asDeviceList(data) {\n  if (Array.isArray(data)) return data;\n  if (data && Array.isArray(data.devices)) return data.devices;\n  return [];\n}\n\n/** A human label for a device, preferring the name the user gave it. */\nexport function deviceLabel(d) {\n  if (!d) return 'Unconnected';\n  return d[DEVICE.NAME] || d[DEVICE.MODEL] || d[DEVICE.SN] || 'Unknown device';\n}\n\n/** Klipper names the first toolhead `extruder`, not `extruder0`. */\nexport const TOOLHEADS = ['extruder', 'extruder1', 'extruder2', 'extruder3'];\n\n/*\n * `print_task_config` is the single biggest thing the two surfaces share.\n *\n * The Device tab READS it - to label each toolhead with the filament loaded.\n * The print popup WRITES it - the filament mapping and the three preference\n * toggles are edits to these same fields. Same object, different verb.\n */\n/**\n * Filament colour -> a CSS colour, from any of the three forms that reach us.\n *\n * Measured on a U1: `filament_color` is an **ARGB integer** (4294198070 = 0xFFF44336)\n * and `filament_color_rgba` is hex **without a leading #** (\"F44336FF\", RRGGBBAA). The\n * simulator used to send '#E03131FF', which is why assigning the value straight to\n * `style.background` worked in tests and silently did nothing on hardware - an invalid\n * CSS colour is dropped, not reported.\n *\n * Returns null when there is no usable colour, so callers can fall back deliberately\n * rather than painting an empty string.\n *\n * **A fully transparent value is NOT black.** The alpha is carried in both forms and was\n * being discarded, so `00000000` - which is the machine's way of saying *no colour* -\n * came back `#000000` and got painted. multiACE writes exactly that:\n * `_clear_filament_display()` sends\n * `SET_PRINT_FILAMENT_CONFIG FILAMENT_TYPE=\"\" FILAMENT_COLOR_RGBA=00000000 VENDOR=\"\"`\n * to every feeder head when the machine enters head mode, and the panel drew four black\n * spools. Reported as \"switching between ACE modes switches filaments, blacks them\".\n *\n * Opaque black is `FF000000` as an ARGB integer and `000000FF` as RRGGBBAA, and both\n * still come back `#000000` - it is only alpha ZERO that is an absence.\n */\nexport function cssColor(v) {\n  if (v == null) return null;\n  if (typeof v === 'number' && Number.isFinite(v)) {\n    // ARGB: the alpha rides in the top byte and the rest is plain RGB\n    const n = v >>> 0;\n    if ((n >>> 24) === 0) return null;          // alpha 0 - an absence, not black\n    return '#' + (n & 0xFFFFFF).toString(16).padStart(6, '0').toUpperCase();\n  }\n  const t = String(v).trim().replace(/^#/, '');\n  if (/^[0-9a-f]{8}$/i.test(t)) {\n    return /^00$/i.test(t.slice(6)) ? null : '#' + t.slice(0, 6).toUpperCase();\n  }\n  if (/^[0-9a-f]{6}$/i.test(t)) return '#' + t.slice(0, 6).toUpperCase();\n  if (/^[0-9a-f]{3}$/i.test(t)) return '#' + t.replace(/./g, (c) => c + c).toUpperCase();\n  return null;\n}\n\n/** Is a CSS colour dark enough to need light text on top? */\nexport function isDarkColor(v) {\n  const c = cssColor(v);\n  if (!c) return false;\n  const n = parseInt(c.slice(1), 16);\n  return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 140;\n}\n\n/*\n * multiACE has a module of its own: shared/js/multiACE.js.\n *\n * Its macro names, unit letters, dryer presets, humidity buckets, override-store URL and\n * state model were here and in state.js and in a view, which is three places to look for\n * one subsystem - and is how the panel came to read bay identity from a source that does\n * not carry it. Everything about the ACE is in that one file now, and it is what every\n * part that touches an ACE calls.\n */\n\n/**\n * purifier.mode is an INTEGER on the wire, not the 'inner'/'exhaust' strings the page\n * used to send - which is why the status row showed a bare \"0\".\n *\n * Only `0` is measured (an idle U1 with no purifier attached: power_detected false).\n * The names for 1 and 2 are inferred from the two modes the shipped page offers and are\n * NOT verified - confirming them means changing the mode on a real machine, which is a\n * physical action rather than a read. Treat the labels as provisional; the integer is\n * what goes on the wire either way.\n */\nexport const PURIFIER_MODES = { 0: 'Off', 1: 'Recirculation Mode', 2: 'Exhaust Mode' };\n\n/**\n * The commands the PRINTER answers, as opposed to the ones Orca answers itself.\n *\n * It matters because their replies arrive shaped differently. A printer-backed handler\n * routes the reply through `on_mqtt_msg_arrived`, which assigns the JSON-RPC envelope\n * verbatim (`m_res_data = response`, SSWCP.cpp:1194) into `payload.data` (:946) - so the\n * caller receives `{jsonrpc, result, id}` and the payload it wants is one level down.\n * Everything else answers with its payload directly.\n *\n * Derived from SSWCP.cpp by finding every handler whose body reaches\n * `on_mqtt_msg_arrived`, and re-derived by the conformance suite so it cannot drift.\n *\n * Two were wrong until the derivation learned to end a handler at its own closing brace\n * rather than at the next `sw_*` signature: `sw_GetFileStream` and\n * `sw_UnsubscribeCacheKeys` both build `m_res_data` and call `send_to_js()`, and were\n * credited with an `on_mqtt_msg_arrived` belonging to a function declared between them\n * and the next handler the TO_LEVEL: 'auto_bed_leveling',\n};\n\n/**\n * The three toggles, in the order the shipped UI lists them.\n *\n * `key` reads the state, `arg` writes it, and they are two fields because for one of the\n * three they are not the same word: the machine reports `auto_bed_leveling` and the macro\n * that sets it takes `BED_LEVEL`. Recovered from the shipped bundle, where the toggle\n * writes into a map literally keyed `[\"bed_level\", \"flow_calibrate\", \"time_lapse_camera\"]`\n * and that map is what `SET_PRINT_PREFERENCES` is built from. Sending `AUTO_BED_LEVELING=`\n * is an argument the macro does not have, which a G-code macro answers `ok` to.\n */\nexport const PRINT_PREFERENCES = [\n  { key: TASK_CONFIG.FLOW_CALIBRATE, arg: 'flow_calibrate', label: 'Extrusion Flow Calibration' },\n  { key: TASK_CONFIG.TIME_LAPSE, arg: 'time_lapse_camera', label: 'Time-lapse Camera' },\n  { key: TASK_CONFIG.AUTO_LEVEL, arg: 'bed_level', label: 'Auto Leveling' },\n];\n\n/* ------------------------------------------------------------------ *\n * Writing print_task_config\n *\n * `print_task_config` is READ off the state stream and WRITTEN with G-code macros - four\n * of them, none of which appears in `printer.gcode.help` and all four recovered verbatim\n * from the shipped bundle (`setPrintFilamentConfig` / `setPrePrintConfiguration` in\n * main.dart.js; see docs/u1-webui/02-device-page/12-orca-integration.md).\n *\n * They are here rather than in a panel because two surfaces send them and because the\n * quoting differs between the two families, which is exactly the kind of detail that\n * gets re-derived slightly wrong the second time:\n *\n *   SET_PRINT_FILAMENT_CONFIG   KEY='value'   single-quoted; a vendor with a space in it\n *                                             is one argument only because of the quotes\n *   SET_PRINT_PREFERENCES       KEY=value     bare, and the key is upper-cased from the\n *                                             `print_task_config` field
