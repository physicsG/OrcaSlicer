<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print Preprocessing — plan choice</title>
<!--
  PLAN CHOICE - what the dialog should offer when the plan and the machine disagree.

  BUILT ON THE PAGE, NOT BESIDE IT. This loads the popup's own two stylesheets and mounts
  the popup's own panels - model-info, printer, grouping (or the four cards), preferences -
  from `../js/views/`. Everything you see except the block marked `pc-` IS the shipped
  dialog, running on `ace-fixture.js`, the same fixture the other ACE mockups use. So a
  difference between this and the real popup is a bug in one of them, not a drawing choice
  in here.

  What is new is one block inside the Filament section, because that is where it would
  ship: the answers, with what each costs.

    ?scenario=aware     sliced onto the ACE. The file names a bay per filament and two of
                        them hold the other spool, so Send is refused. Three answers.
    ?scenario=unaware   sliced with no ACE in the preset, on a printer that has one. Seven
                        filaments, four heads, and not one bay address in the whole file.

  WHY THE THIRD ANSWER EXISTS. D/E/F treat the plan as fixed; G offers to change it and
  says the button must read "Re-slice", because when G was drawn the slicer emitted the
  plan and both levers were baked into the gcode. Route C does the rewrite in the host
  AFTER export, which splits them:

      the HEAD is the tool number        -> changing it re-exports the gcode
      the BAY is one argument per swap   -> changing it is a text edit, and free

  So "keep the layout, fix the bay addresses" costs nothing, clears the refusal, and is
  invisible in every earlier design. The reasoning, and the measurement that says
  preferring Orca's own assignment is NOT on its own enough, is
  docs/u1-webui/03-print-processing/10-plan-choice.md.

  Numbers are the branch's own: 349 swaps / 47.0 g for a hand layout against the planner's
  300 / 40.4, measured on the seven-colour cube (docs/ace-mmu/13-roadmap.md).
-->
<link rel="stylesheet" href="../../shared/css/base.css">
<link rel="stylesheet" href="../css/preprint.css">
<style>
/* The harness strip. Not part of the dialog, and marked so it cannot be mistaken for it. */
.mock-bar {
  display: flex; align-items: center; gap: 10px; padding: 6px 16px;
  border-bottom: 1px dashed var(--f-border); background: var(--f-bg);
  font: 11px/1 var(--sans); color: var(--ink-dim); flex: none;
}
.mock-bar .grow { flex: 1; }
.mock-bar button {
  font: inherit; font-size: 11px; padding: 4px 9px; border: 1px solid var(--f-border);
  border-radius: 5px; background: var(--f-bg); color: var(--ink-2); cursor: pointer;
}
.mock-bar button[aria-pressed="true"] { border-color: var(--f-blue); color: var(--ink); font-weight: 600; }
.mock-bar .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; }

/* ---- the new block, in the Filament card's body ------------------------- */
/* One line per answer. The dialog is 750 tall and the grouping panel already fills 383
   of it, so an answer that costs three lines costs the whole decision its visibility -
   measured: the real page overflows by 182, and prose rows took that past 500. */
.pc { margin: 2px 0 9px; border-bottom: 1px solid var(--f-divider); padding-bottom: 8px; }
.pc-h { font: 600 11px/1.3 var(--sans); color: var(--ink-2); margin-bottom: 6px; }
.pc-opts { display: flex; flex-direction: column; gap: 3px; }
.pc-opt {
  display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
  font: inherit; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid transparent; border-radius: 5px; padding: 3px 6px;
}
.pc-opt:hover { background: var(--f-divider); }
.pc-opt[aria-pressed="true"] { border-color: var(--f-blue); background: none; }
.pc-opt:focus-visible { outline: 2px solid var(--f-blue); outline-offset: 1px; }
.pc-dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  border: 1.5px solid var(--ink-dim);
}
.pc-opt[aria-pressed="true"] .pc-dot { border-color: var(--f-blue); border-width: 3.5px; }
.pc-lab { font: 500 11.5px/1.3 var(--sans); flex: 1; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-opt[aria-pressed="true"] .pc-lab { font-weight: 600; }
.pc-num { font: 10.5px/1 var(--mono); color: var(--ink-2); white-space: nowrap;
          font-variant-numeric: tabular-nums; }
.pc-cost {
  font: 600 9px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 5px; border-radius: 8px; white-space: nowrap; flex: none;
}
.pc-cost.free { color: var(--ok, #1f9254); background: rgba(31, 146, 84, .13); }
.pc-cost.work { color: var(--warn); background: rgba(196, 101, 30, .14); }
.pc-cost.no   { color: var(--err); background: rgba(192, 57, 43, .13); }
/* Only the chosen answer explains itself. Three explanations is a paragraph nobody reads. */
.pc-detail { margin: 5px 0 0 23px; font: 10.5px/1.45 var(--sans); color: var(--ink-dim); }
.pc-detail b { color: var(--ink-2); font-weight: 600; }
.pc-detail ul { margin: 2px 0 0; padding-left: 15px; }
.pc-why { margin: 5px 0 0 23px; font: 10.5px/1.45 var(--sans); color: var(--ink-dim); }
.pc-why summary { cursor: pointer; color: var(--ink-2); }
.pc-why code { font-family: var(--mono); font-size: 10px; }
</style>
</head>
<body class="dlg">

<div class="mock-bar">
  <span class="tag">MOCKUP</span>
  <span>Print Preprocessing, on the page's own CSS and panels</span>
  <span class="grow"></span>
  <button id="s-unaware" type="button" aria-pressed="false">Sliced without the ACE</button>
  <button id="s-aware" type="button" aria-pressed="true">Sliced onto the ACE</button>
</div>

<div id="body" class="dlg-body"></div>

<div class="dlg-foot">
  <div class="bar"><div class="bar-track"><div id="bar-fill" class="bar-fill"></div></div></div>
  <span id="pct" class="pct">0%</span>
  <button id="send" class="send" type="button">Send</button>
</div>

<script>
/* A mockup that fails silently is worse than one that fails: record it and show it. */
window.__err = null;
window.addEventListener('error', (e) => { window.__err = (e.error && e.error.stack) || e.message; });
window.addEventListener('unhandledrejection', (e) => { window.__err = String(e.reason && e.reason.stack || e.reason); });
</script>

<script type="module">
'use strict';

/* The dialog's own panels. Nothing here re-draws them. */
import * as modelInfo from '../js/views/model-info/model-info-view.js';
import * as printerView from '../js/views/printer/printer-view.js';
import * as grouping from '../js/views/grouping/grouping-view.js';
import * as fourCards from '../js/views/filament/filament-view.js';
import * as prefsView from '../js/views/preferences/preferences-view.js';
import { el } from '../../shared/js/dom.js';

import { FILAMENTS, MAPPING, PLAN, SCENARIOS, DEVICE, PREFERENCES, reconcile }
  from './ace-fixture.js';

/* ====================================================================== *
 * The two states, both composed from the shared fixture.
 * ====================================================================== */

/* The grouping view reads `fil.colors[0]`; the fixture stores a single `color`. */
const FILS = FILAMENTS.map((f) => ({
  index: f.index, key: f.key, type: f.type, name: f.name,
  colors: [f.color], color: f.color, colorMode: 0,
  weight: f.weight, used: f.weight, usedMm: f.usedMm,
}));

/* The four-card view reads a toolhead's `colors`/`colorMode` to fill its disc; the
   fixture stores one `color` per head, as the machine reports it. */
const HEADS = (AWARE_HEADS) => AWARE_HEADS.map((h) => ({
  ...h, colors: h.color ? [h.color] : ['#B7BDC6'], colorMode: 0,
}));

/* Sliced onto the ACE: the fixture's own "two bays the other way round". */
const AWARE = SCENARIOS.swapped;

/* Sliced with no ACE in the preset, on a printer that has one. The file is the ordinary
   seven-colour plate - no plan, no bay named anywhere - and the machine reports the same
   ACE the other state uses. Three filaments have no head to print from. */
const UNAWARE = {
  plan: null,
  mapping: MAPPING,
  ace: AWARE.ace,
  heads: AWARE.heads,
  assignment: { 0: 0, 1: 1, 2: 2, 3: 3, 4: null, 5: null, 6: null },
  orphans: [4, 5, 6],
};

/* ====================================================================== *
 * The answers. Costs are the branch's measured numbers.
 * ====================================================================== */
const ANSWERS = {
  aware: [
    { key: 'sliced', label: 'As sliced', cost: 'refused', tag: 'no',
      say: 'The layout saved with the plate. Two bays it names hold the other spool.',
      swaps: 349, purge: 47.0, blocked: true, move: [], button: 'Send' },
    { key: 'addresses', label: 'Keep the layout, fix the bay addresses', cost: 'free', tag: 'free',
      say: 'Every filament stays on its toolhead; only the bay it is drawn from changes.',
      swaps: 349, purge: 47.0, blocked: false, move: [], button: 'Send' },
    { key: 'replan', label: 'Re-plan for the fewest swaps', cost: 're-export', tag: 'work',
      say: 'The most-printed colour moves to a free toolhead, the rare one behind the ACE.',
      swaps: 300, purge: 40.4, blocked: false,
      move: ['Take Black out of bay A4 and put it in Toolhead 1',
             'Put Amber, from Toolhead 1, into bay A4'],
      button: 'Re-export and send' },
  ],
  unaware: [
    { key: 'asis', label: 'Send as sliced', cost: 'refused', tag: 'no',
      say: 'The file names T5, T6 and T7; the printer has four heads and nothing maps them.',
      swaps: null, purge: null, blocked: true, move: [], button: 'Send' },
    { key: 'reslice', label: 'Take the ACE into the preset and slice again',
      cost: 're-slice', tag: 'work',
      say: 'Toolhead 4 becomes ACE-fed with four bays, so seven filaments have seven places.',
      swaps: 300, purge: 40.4, blocked: false, move: [], button: 'Sync and re-slice' },
  ],
};

const WHY = {
  aware: 'The toolhead IS the tool number, so moving it re-exports the gcode. The bay is '
       + 'one argument on each <code>ACE_SWAP_HEAD</code>, so changing it is a text edit '
       + 'over the file on disk. Neither re-slices geometry.',
  unaware: 'No bay is named anywhere in this file, so there is no address to re-map. The '
         + 'tool numbers are wrong, and those are written at slicing time.',
};

/* ====================================================================== *
 * Model. The keys are the ones each panel declares in its `reads`.
 * ====================================================================== */
const prefs = {};
PREFERENCES.forEach((p) => { prefs[p.key] = p.key === 'auto_bed_leveling'; });

const state = {
  scenario: new URLSearchParams(location.search).get('scenario') === 'unaware'
            ? 'unaware' : 'aware',
  choice: 'sliced',
  sending: false,
};

function scn() { return state.scenario === 'aware' ? AWARE : UNAWARE; }
function answers() { return ANSWERS[state.scenario]; }
function chosen() {
  return answers().find((a) => a.key === state.choice) || answers()[0];
}

function model() {
  const s = scn();
  return {
    mapping: s.mapping, file: s.mapping, filaments: FILS,
    devices: [DEVICE], device: DEVICE, legal: { legal: true },
    plan: s.plan, ace: s.ace, toolheads: HEADS(s.heads),
    assignment: s.assignment || {},
    check: s.plan ? reconcile(s) : { rows: [], differs: 0, unsure: 0, checked: false },
    prefs,
  };
}

/* ====================================================================== *
 * The shell: the real card, in the real order, with the real spacing.
 * shell.js builds `section.card > .card-title + .card-gap + .card-body`.
 * ====================================================================== */
const SECTIONS = [
  { id: 'model-info', title: 'Model Information', view: modelInfo },
  { id: 'printer', title: 'Select Printer', view: printerView },
  { id: 'filament', title: 'Filament', view: null },   // grouping or four cards, per state
  { id: 'preferences', title: 'Print Preferences', view: prefsView },
];

const host = document.getElementById('body');
const bodies = {};

function buildShell() {
  host.textContent = '';
  host.appendChild(el('div', 'sp-16'));
  SECTIONS.forEach((s, i) => {
    if (i) host.appendChild(el('div', 'sp-8'));
    const section = el('section', 'card');
    section.id = `panel-${s.id}`;
    const title = el('div', 'card-title');
    title.appendChild(el('span', null, s.title));
    section.appendChild(title);
    section.appendChild(el('div', 'card-gap'));
    const body = el('div', 'card-body');
    section.appendChild(body);
    host.appendChild(section);
    bodies[s.id] = { section, body, title };
    /* Every panel builds its own fixed structure once, exactly as shell.js has it.
       The filament slot is mounted separately because which panel it is depends on
       whether the file carries a plan. */
    if (s.view) s.view.mount(body);
  });
  host.appendChild(el('div', 'sp-20'));
}

/* The Filament section is remounted when the state changes, because the two states are
   two different panels - which is exactly what app.js does with the same two. */
let filamentKind = null;
function mountFilament() {
  const kind = scn().plan ? 'grouping' : 'four';
  if (kind === filamentKind) return;
  filamentKind = kind;
  const b = bodies.filament.body;
  b.textContent = '';
  bodies.filament.title.querySelector('span').textContent =
    kind === 'grouping' ? 'Filament' : 'Edit Filament';
  (kind === 'grouping' ? grouping : fourCards).mount(b);
  /* The answers go ABOVE the evidence. The decision is what the section is for; the head
     boxes are what justifies it, and a chooser below four boxes and seven chips is 300px
     under the fold on a 714x750 dialog - measured. */
  const pc = pcBlock();
  const grid = b.querySelector('.g-heads');
  if (grid) b.insertBefore(pc, grid); else b.appendChild(pc);
}

/* ---- the new block ------------------------------------------------------ */
function pcBlock() {
  const wrap = el('div', 'pc');
  wrap.appendChild(el('div', 'pc-h'));
  wrap.appendChild(el('div', 'pc-opts'));
  wrap.appendChild(el('div', 'pc-detail'));
  const why = document.createElement('details');
  why.className = 'pc-why';
  why.appendChild(document.createElement('summary'));
  why.appendChild(el('div', 'pc-whybody'));
  wrap.appendChild(why);
  return wrap;
}

function paintPc() {
  const wrap = bodies.filament.body.querySelector('.pc');
  const a = chosen();

  wrap.querySelector('.pc-h').textContent = state.scenario === 'aware'
    ? 'Two bays hold another spool. Three answers:'
    : 'This plate cannot print as it is. Two answers:';

  const opts = wrap.querySelector('.pc-opts');
  opts.textContent = '';
  answers().forEach((ans) => {
    const b = el('button', 'pc-opt');
    b.type = 'button';
    b.dataset.key = ans.key;
    b.setAttribute('aria-pressed', String(state.choice === ans.key));
    b.appendChild(el('span', 'pc-dot'));
    b.appendChild(el('span', 'pc-lab', ans.label));
    b.appendChild(el('span', `pc-cost ${ans.tag}`, ans.cost));
    b.appendChild(el('span', 'pc-num',
      ans.swaps == null ? '—' : `${ans.swaps} swaps · ${ans.purge.toFixed(1)} g`));
    b.addEventListener('click', () => { state.choice = ans.key; paint(); });
    opts.appendChild(b);
  });

  /* Only the chosen one explains itself, and only where there is something to do. */
  const d = wrap.querySelector('.pc-detail');
  d.textContent = '';
  d.appendChild(el('span', null, a.say));
  if (a.move.length) {
    d.appendChild(el('b', null, ` Move ${a.move.length} spools first:`));
    const ul = el('ul');
    a.move.forEach((m) => ul.appendChild(el('li', null, m)));
    d.appendChild(ul);
  }

  const why = wrap.querySelector('.pc-why');
  why.querySelector('summary').textContent = state.scenario === 'aware'
    ? 'Why one of these costs nothing' : 'Why a re-map cannot help here';
  why.querySelector('.pc-whybody').innerHTML = WHY[state.scenario];
}

/* ---- footer ------------------------------------------------------------- */
function paintFoot() {
  const a = chosen();
  const send = document.getElementById('send');
  send.textContent = a.button;
  send.disabled = state.sending || a.blocked;
}

document.getElementById('send').addEventListener('click', () => {
  if (state.sending) return;
  state.sending = true; paintFoot();
  const fill = document.getElementById('bar-fill');
  const pct = document.getElementById('pct');
  let n = 0;
  const t = setInterval(() => {
    n = Math.min(100, n + 8);
    fill.style.width = n + '%';
    pct.textContent = n + '%';
    if (n >= 100) { clearInterval(t); state.sending = false; paintFoot(); }
  }, 120);
});

/* ---- paint -------------------------------------------------------------- */
function paint() {
  document.getElementById('s-aware').setAttribute('aria-pressed', String(state.scenario === 'aware'));
  document.getElementById('s-unaware').setAttribute('aria-pressed', String(state.scenario === 'unaware'));
  mountFilament();
  const m = model();
  const ctx = { model: m, pending: {}, commands: {}, say: () => {} };
  modelInfo.update(bodies['model-info'].body, m, ctx);
  printerView.update(bodies.printer.body, m, ctx);
  if (scn().plan) grouping.update(bodies.filament.body, m, ctx);
  else fourCards.update(bodies.filament.body, m, ctx);
  prefsView.update(bodies.preferences.body, m, ctx);
  paintPc();
  paintFoot();
}

function pick(s) {
  state.scenario = s;
  state.choice = ANSWERS[s][0].key;
  state.sending = false;
  document.getElementById('bar-fill').style.width = '0';
  document.getElementById('pct').textContent = '0%';
  const u = new URL(location.href);
  u.searchParams.set('scenario', s);
  history.replaceState(null, '', u);
  paint();
}
document.getElementById('s-aware').addEventListener('click', () => pick('aware'));
document.getElementById('s-unaware').addEventListener('click', () => pick('unaware'));

buildShell();
paint();

window.__mockup = {
  name: 'plan-choice',
  get state() { return { scenario: state.scenario, choice: state.choice }; },
  answers: ANSWERS,
  get model() { return model(); },
};
</script>
</body>
</html>
